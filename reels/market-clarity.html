<script>
/* ===================== CONFIG ===================== */
const FPS=30;
const CX0=95, CX1=900, CY0=450, CY1=1130;   // chart box (right gutter for profile)

/* Candles below are REAL COMEX Gold (GC=F, 1H, ~XAUUSD) pulled from a live feed. */
const SCENES=[

  { key:'profile', dur:7.0, title:'البروفايل اليومي والأسبوعي', lo:4333.8, hi:4373.1,
    candles:[[4344.4,4364.5,4341.4,4355.7],[4355.6,4368.1,4355.4,4361.8],[4361.5,4362.3,4346.4,4361.5],[4361.8,4364.4,4357.4,4360.0],[4359.6,4364.3,4352.4,4355.6],[4355.3,4356.7,4351.3,4353.0],[4352.6,4355.9,4348.7,4355.0],[4354.8,4358.0,4349.1,4350.8],[4350.9,4361.9,4348.2,4356.9],[4356.4,4369.8,4354.1,4361.0],[4360.9,4364.4,4349.6,4351.2],[4351.0,4353.7,4348.4,4351.2],[4352.2,4353.6,4337.1,4346.1],[4346.2,4353.8,4340.4,4346.1],[4346.5,4351.2,4340.1,4351.2],[4351.1,4352.5,4344.1,4344.7]] },
  { key:'structure', dur:6.4, title:'الماركت ستركتشر', lo:4093.7, hi:4201.4,
    candles:[[4141.9,4144.6,4135.4,4135.8],[4135.4,4150.9,4132.7,4137.1],[4136.9,4144.6,4130.6,4142.4],[4142.4,4150.5,4142.4,4147.1],[4147.1,4170.0,4143.0,4168.6],[4168.6,4187.0,4166.0,4184.1],[4184.1,4192.4,4167.3,4170.0],[4169.7,4175.1,4154.5,4165.0],[4165.0,4166.7,4146.9,4150.1],[4150.4,4158.7,4148.2,4156.6],[4156.7,4159.8,4151.8,4155.9],[4156.0,4156.5,4136.1,4138.0],[4137.9,4138.7,4102.7,4125.1],[4125.3,4126.7,4114.2,4116.6],[4106.5,4116.9,4104.0,4109.5]],
    swings:[{i:2,p:4130.6,t:'HL'},{i:6,p:4192.4,t:'HH'}],
    bos:{p:4130.6, breakI:12} },
  { key:'balance', dur:6.4, title:'التوازن وعدم التوازن', lo:4184.4, hi:4341.6,
    candles:[[4212.1,4231.2,4203.0,4206.7],[4207.4,4229.5,4197.5,4224.9],[4224.9,4256.8,4221.0,4232.4],[4232.3,4254.1,4228.6,4236.5],[4236.5,4247.1,4234.0,4241.8],[4242.2,4256.2,4234.9,4236.2],[4236.2,4240.8,4223.2,4231.9],[4231.6,4240.6,4230.7,4238.8],[4325.6,4327.0,4300.0,4305.8],[4305.6,4315.4,4301.3,4314.3],[4314.3,4328.5,4312.7,4313.1]],
    dispI:8, balance:[4197.5,4256.8,0,7], imbalance:[4240.6,4301.3,7,9] },
  { key:'cta', dur:2.6 }
];

const HOOKS=[
  {t:0.0, html:"إذا تبي <em>حركة السوق</em><br>تصير واضحة"},
  {t:2.3, html:"تعلّم <em>3 أشياء</em> بس"},

  {t:11.2,html:"الهيكل يكسر<br><em>الاتجاه يتغيّر</em>"},
  {t:17.6,html:"من التوازن…<br><em>تجي الحركة القوية</em>"},
  {t:24.0,html:"احفظها 📌 وطبّقها<br><span class='sub'>3 أدوات تكفيك</span>"}
];
/* ================================================= */

const cv=document.getElementById('chart'), ctx=cv.getContext('2d');
const ov=document.getElementById('ov'), hook=document.getElementById('hook');
const stepEl=document.getElementById('step');
const W=1080,H=1920;
const TOTAL=SCENES.reduce((a,s)=>a+s.dur,0);
let acc=0; SCENES.forEach(s=>{s.start=acc; acc+=s.dur; s.end=acc;});

const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const ss=(a,b,x)=>{x=clamp((x-a)/(b-a),0,1);return x*x*(3-2*x);};
const lerp=(a,b,x)=>a+(b-a)*x;
const eOut=x=>1-Math.pow(1-clamp(x,0,1),3);

function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}

const n=s=>s.candles.length;
const cxi=(s,i)=>{const st=(CX1-CX0)/(n(s)-1);return CX0+i*st;};
const cwv=s=>(CX1-CX0)/(n(s)-1)*0.56;
const pyv=(s,p)=>CY0+(s.hi-p)/(s.hi-s.lo)*(CY1-CY0);

function candle(s,i,grow,alpha){
  const [o,h,l,c]=s.candles[i]; const up=c>=o; const col=up?'#2ECC9A':'#E15A5A';
  const x=cxi(s,i); const yO=pyv(s,o),yC=pyv(s,c),yH=pyv(s,h),yL=pyv(s,l);
  const bt=Math.min(yO,yC),bb=Math.max(yO,yC);
  const gt=lerp(yO,bt,grow),gb=lerp(yO,bb,grow),gH=lerp(yO,yH,grow),gL=lerp(yO,yL,grow);
  ctx.globalAlpha=alpha; ctx.strokeStyle=col; ctx.lineWidth=3;
  ctx.beginPath();ctx.moveTo(x,gH);ctx.lineTo(x,gL);ctx.stroke();
  ctx.fillStyle=col; const w=cwv(s); rr(x-w/2,gt,w,Math.max(3,gb-gt),5); ctx.fill();
  ctx.globalAlpha=1;
}
function hline(y,col,lw,dash,x0,x1){ctx.save();ctx.strokeStyle=col;ctx.lineWidth=lw;if(dash)ctx.setLineDash(dash);ctx.beginPath();ctx.moveTo(x0,y);ctx.lineTo(x1,y);ctx.stroke();ctx.restore();}

function computeProfile(s,bins){
  const arr=new Array(bins).fill(0); const {lo,hi}=s;
  for(const [o,h,l,c] of s.candles){
    const b0=Math.floor((l-lo)/(hi-lo)*bins), b1=Math.ceil((h-lo)/(hi-lo)*bins);
    for(let b=Math.max(0,b0);b<Math.min(bins,b1);b++) arr[b]+= (Math.abs(c-o)+0.5); // weight bodies
  }
  const max=Math.max(...arr); let pocB=arr.indexOf(max);
  // value area 70%
  const total=arr.reduce((a,v)=>a+v,0); let lo_=pocB,hi_=pocB,accv=arr[pocB];
  while(accv<total*0.7 && (lo_>0||hi_<bins-1)){
    const dn=lo_>0?arr[lo_-1]:-1, upv=hi_<bins-1?arr[hi_+1]:-1;
    if(upv>=dn){hi_++;accv+=arr[hi_];}else{lo_--;accv+=arr[lo_];}
  }
  const binP=b=>lo+(b+0.5)/bins*(hi-lo);
  return {arr,max,pocP:binP(pocB),vah:lo+ (hi_+1)/bins*(hi-lo),val:lo+lo_/bins*(hi-lo),bins};
}

// DOM overlay helpers
function setEl(id,txt,x,y,cls,alpha,fs){
  let e=document.getElementById(id);
  if(!e){e=document.createElement('div');e.id=id;ov.appendChild(e);}
  e.className=cls; e.innerHTML=txt; e.style.position='absolute';
  e.style.left=x+'px'; e.style.top=y+'px'; if(fs)e.style.fontSize=fs+'px';
  e.style.opacity=alpha; e.style.display=alpha<=.01?'none':'block';
}
function clearOv(keepIds){[...ov.children].forEach(c=>{if(!keepIds.includes(c.id))c.style.display='none';});}

function drawProfileScene(s,lt,alpha){
  const grow=Math.min(1, lt/1.4);
  for(let i=0;i<n(s);i++){const ap=ss(i*0.05, i*0.05+0.4, lt); if(ap>0) candle(s,i,eOut(ap),alpha*ap);}
  const pf=computeProfile(s,26);
  const aPf=eOut(ss(1.2,2.2,lt)); if(aPf>0){
    const RX=1000, maxLen=300, bh=(CY1-CY0)/pf.bins;
    for(let b=0;b<pf.bins;b++){
      const p=s.lo+(b+0.5)/pf.bins*(s.hi-s.lo); const y=pyv(s,p);
      const len=pf.arr[b]/pf.max*maxLen*aPf; const isPoc=Math.abs(p-pf.pocP)<(s.hi-s.lo)/pf.bins;
      ctx.globalAlpha=alpha*(isPoc?.55:.28); ctx.fillStyle=isPoc?'#E9C46A':'#2ECC9A';
      rr(RX-len,y-bh/2+1,len,bh-2,3); ctx.fill(); ctx.globalAlpha=1;
    }
    // VAH/VAL/POC lines
    hline(pyv(s,pf.vah),'rgba(159,180,188,.7)',2,[9,7],CX0,1000);
    hline(pyv(s,pf.val),'rgba(159,180,188,.7)',2,[9,7],CX0,1000);
    hline(pyv(s,pf.pocP),'rgba(233,196,106,.9)',2.5,[2,0],CX0,1000);
  }
  // labels
  const la=eOut(ss(1.6,2.4,lt))*alpha;
  const pf2=pf;
  setEl('pPOC','POC', 250, pyv(s,pf2.pocP), 'tag gold', la, 28);
  setEl('pVAH','VAH', 150, pyv(s,pf2.vah)-4, 'tag grey', la, 26);
  setEl('pVAL','VAL', 150, pyv(s,pf2.val)+4, 'tag grey', la, 26);
  setEl('pVA','منطقة القيمة', 980, pyv(s,pf2.pocP)+130, 'lab', la, 30);
  clearOv(['pPOC','pVAH','pVAL','pVA']);
}

function drawStructureScene(s,lt,alpha){
  for(let i=0;i<n(s);i++){const ap=ss(i*0.06, i*0.06+0.4, lt); if(ap>0) candle(s,i,eOut(ap),alpha*ap);}
  const keep=[];
  const aSw=eOut(ss(1.4,2.4,lt))*alpha;
  s.swings.forEach((sw,k)=>{
    const x=cxi(s,sw.i), y=pyv(s,sw.p); const above=sw.t==='HH';
    ctx.globalAlpha=aSw; ctx.fillStyle=above?'#2ECC9A':'#E9C46A';
    ctx.beginPath();ctx.arc(x,y,7,0,7); ctx.fill(); ctx.globalAlpha=1;
    const id='sw'+k; setEl(id, sw.t, x, y+(above?-46:46), 'tag '+(above?'teal':'gold'), aSw, 26); keep.push(id);
  });
  // BOS line + break
  const aBos=eOut(ss(2.8,3.8,lt))*alpha;
  if(aBos>0){
    hline(pyv(s,s.bos.p),'rgba(225,90,90,.9)',2.5,[10,7],cxi(s,5),cxi(s,n(s)-1));
    const bx=cxi(s,s.bos.breakI);
    setEl('bos','كسر الهيكل · BOS', bx+70, pyv(s,s.bos.p)+70, 'tag red', aBos, 28); keep.push('bos');
    // down arrow at break
    ctx.globalAlpha=aBos;ctx.strokeStyle='#E15A5A';ctx.lineWidth=4;
    const ay=pyv(s,s.bos.p);
    ctx.beginPath();ctx.moveTo(bx,ay+6);ctx.lineTo(bx,ay+52);ctx.stroke();
    ctx.beginPath();ctx.moveTo(bx-12,ay+38);ctx.lineTo(bx,ay+56);ctx.lineTo(bx+12,ay+38);ctx.stroke();ctx.globalAlpha=1;
  }
  clearOv(keep);
}

function drawBalanceScene(s,lt,alpha){
  for(let i=0;i<n(s);i++){const ap=ss(i*0.06, i*0.06+0.4, lt); if(ap>0) candle(s,i,eOut(ap),alpha*ap);}
  const keep=[];
  // balance box
  const aBal=eOut(ss(1.4,2.3,lt))*alpha;
  if(aBal>0){
    const [pl,ph,i0,i1]=s.balance; const x=cxi(s,i0)-cwv(s); const w=cxi(s,i1)+cwv(s)-x;
    const y=pyv(s,ph),h=pyv(s,pl)-y;
    ctx.globalAlpha=aBal*.9; ctx.fillStyle='rgba(159,180,188,.10)'; rr(x,y,w,h,8);ctx.fill();
    ctx.strokeStyle='rgba(159,180,188,.6)';ctx.lineWidth=2;ctx.setLineDash([8,6]);rr(x,y,w,h,8);ctx.stroke();ctx.setLineDash([]);ctx.globalAlpha=1;
    setEl('bal','توازن · Balance', x+w/2, y-40, 'tag grey', aBal, 28); keep.push('bal');
  }
  // imbalance / FVG box
  const aImb=eOut(ss(2.8,3.7,lt))*alpha;
  if(aImb>0){
    const [pl,ph,i0,i1]=s.imbalance; const x=cxi(s,i0)-cwv(s)*0.3; const w=cxi(s,i1)+cwv(s)-x;
    const y=pyv(s,ph),h=pyv(s,pl)-y;
    ctx.globalAlpha=aImb*.95; ctx.fillStyle='rgba(233,196,106,.16)'; rr(x,y,w*aImb,h,8);ctx.fill();
    ctx.strokeStyle='rgba(233,196,106,.8)';ctx.lineWidth=2;rr(x,y,w*aImb,h,8);ctx.stroke();ctx.globalAlpha=1;
    setEl('imb','عدم توازن · FVG', x+w*0.5, pyv(s,ph)+h+50, 'tag gold', aImb, 28); keep.push('imb');
    // up arrow
    ctx.globalAlpha=aImb;ctx.strokeStyle='#2ECC9A';ctx.lineWidth=4;
    const ax=cxi(s,s.dispI)-4, y0=pyv(s,s.imbalance[0])+30, y1=y0-70*aImb;
    ctx.beginPath();ctx.moveTo(ax,y0);ctx.lineTo(ax,y1);ctx.stroke();
    ctx.beginPath();ctx.moveTo(ax-12,y1+16);ctx.lineTo(ax,y1);ctx.lineTo(ax+12,y1+16);ctx.stroke();ctx.globalAlpha=1;
  }
  clearOv(keep);
}

function drawHookScene(s,lt,alpha){
  // real gold candles, revealed left-to-right
  for(let i=0;i<n(s);i++){const ap=ss(i*0.03, i*0.03+0.45, lt); if(ap>0) candle(s,i,eOut(ap),alpha*ap*0.97);}
  clearOv([]);
}

function drawCTA(lt,a){
  const items=['البروفايل اليومي والأسبوعي','الماركت ستركتشر','التوازن وعدم التوازن'];
  const keep=[];
  const ah=eOut(ss(0.2,0.8,lt))*a;
  setEl('rH','الخلاصة', 540, 640, 'lab', ah, 40); keep.push('rH');
  items.forEach((it,k)=>{
    const av=eOut(ss(0.5+k*0.28, 1.1+k*0.28, lt))*a;
    const e=document.getElementById('r'+k)||(()=>{const d=document.createElement('div');d.id='r'+k;ov.appendChild(d);return d;})();
    e.className='tag teal'; e.innerHTML=it; e.style.position='absolute';
    e.style.left='540px'; e.style.top=(740+k*100)+'px'; e.style.transform='translate(-50%,-50%)';
    e.style.fontSize='34px'; e.style.padding='16px 34px'; e.style.borderRadius='16px';
    e.style.opacity=av; e.style.display=av<=.01?'none':'block';
    keep.push('r'+k);
  });
  clearOv(keep);
}

function render(t){
  t=clamp(t,0,TOTAL);
  document.querySelector('#prog>i').style.width=(t/TOTAL*100)+'%';
  ctx.clearRect(0,0,W,H);
  // draw scenes with crossfade
  SCENES.forEach(s=>{
    const fin=ss(s.start,s.start+0.45,t), fout=ss(s.end-0.4,s.end,t);
    const a=fin*(1-fout); if(a<=0.01) return;
    const lt=t-s.start;
    if(s.key==='hook') drawHookScene(s,lt,a);
    else if(s.key==='profile') drawProfileScene(s,lt,a);
    else if(s.key==='structure') drawStructureScene(s,lt,a);
    else if(s.key==='balance') drawBalanceScene(s,lt,a);
    else if(s.key==='cta'){ drawCTA(lt,a); }
  });
  // step chip
  const cur=SCENES.find(s=>t>=s.start&&t<s.end)||SCENES[SCENES.length-1];
  if(cur.title){
    const idx=SCENES.filter(x=>x.title).indexOf(cur)+1;
    const a=ss(cur.start+0.2,cur.start+0.8,t)*(1-ss(cur.end-0.5,cur.end,t));
    stepEl.style.opacity=a;
    stepEl.querySelector('.num').textContent=idx;
    stepEl.querySelector('.ttl').textContent=cur.title;
  } else stepEl.style.opacity=0;
  // brand top fade for cta
  document.getElementById('brandtop').style.opacity=1;
  // hook text
  let hb=HOOKS[0],hi=0; for(let i=0;i<HOOKS.length;i++){if(t>=HOOKS[i].t){hb=HOOKS[i];hi=i;}}
  const nx=HOOKS[hi+1]; const inAt=hb.t,outAt=nx?nx.t:TOTAL;
  const fin=ss(inAt,inAt+0.4,t),fout=nx?ss(outAt-0.35,outAt,t):0;
  if(hook.dataset.i!=String(hi)){hook.dataset.i=String(hi);hook.innerHTML=hb.html;}
  const ap=fin*(1-fout); hook.style.opacity=ap;
  hook.style.transform=`translateY(${(1-eOut(fin))*36}px)`;
}

let _t0=null,_live=true;
function loop(ts){if(_live){if(_t0==null)_t0=ts;render(((ts-_t0)/1000)%TOTAL);}requestAnimationFrame(loop);}
window.__setT=t=>{_live=false;render(t);};
window.__meta=()=>({fps:FPS,duration:TOTAL});
document.fonts.ready.then(()=>{render(0);requestAnimationFrame(loop);});
</script>
