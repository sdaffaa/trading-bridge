/* ===================== CONFIG ===================== */
const FPS=30;
const CX0=110, CX1=858, CY0=470, CY1=1150;   // chart box (right gutter for axis/profile)
const AXIS_X=1002;

/* Candles below are REAL COMEX Gold (GC=F, 1H, ~XAUUSD) pulled from a live feed. */
const SCENES=[
  { key:'hook', dur:4.6, lo:4001.1, hi:4100.1,

    swings:[{i:2,p:4130.6,t:'HL'},{i:6,p:4192.4,t:'HH'}],
    bos:{p:4130.6, breakI:12} },
  { key:'balance', dur:6.6, title:'التوازن وعدم التوازن', lo:4184.4, hi:4341.6,
    candles:[[4212.1,4231.2,4203.0,4206.7],[4207.4,4229.5,4197.5,4224.9],[4224.9,4256.8,4221.0,4232.4],[4232.3,4254.1,4228.6,4236.5],[4236.5,4247.1,4234.0,4241.8],[4242.2,4256.2,4234.9,4236.2],[4236.2,4240.8,4223.2,4231.9],[4231.6,4240.6,4230.7,4238.8],[4325.6,4327.0,4300.0,4305.8],[4305.6,4315.4,4301.3,4314.3],[4314.3,4328.5,4312.7,4313.1]],
    dispI:8, balance:[4197.5,4256.8,0,7], imbalance:[4240.6,4301.3,7,9] },
  { key:'cta', dur:3.0 }
];

const HOOKS=[
  {t:0.0, html:"إذا تبي <em>حركة السوق</em><br>تصير واضحة"},
  {t:2.5, html:"تحتاج <em>ثلاث أدوات</em> فقط"},

  {t:11.6,html:"حين يُكسر الهيكل<br><em>يتغيّر الاتجاه</em>"},

/* ================================================= */

const cv=document.getElementById('chart'), ctx=cv.getContext('2d');
const ov=document.getElementById('ov'), hook=document.getElementById('hook');
const stepEl=document.getElementById('step');
const W=1080,H=1920;
const BULL='#3F9E85', BEAR='#B0524C', GOLD='#C9A24B';
const TOTAL=SCENES.reduce((a,s)=>a+s.dur,0);
let acc=0; SCENES.forEach(s=>{s.start=acc; acc+=s.dur; s.end=acc;});

const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const ss=(a,b,x)=>{x=clamp((x-a)/(b-a),0,1);return x*x*(3-2*x);};
const lerp=(a,b,x)=>a+(b-a)*x;
const eOut=x=>1-Math.pow(1-clamp(x,0,1),3);

function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
const n=s=>s.candles.length;
const cxi=(s,i)=>{const st=(CX1-CX0)/(n(s)-1);return CX0+i*st;};
const cwv=s=>Math.min(30,(CX1-CX0)/(n(s)-1)*0.5);
const pyv=(s,p)=>CY0+(s.hi-p)/(s.hi-s.lo)*(CY1-CY0);

function candle(s,i,alpha){
  const [o,h,l,c]=s.candles[i]; const up=c>=o; const col=up?BULL:BEAR;
  const x=cxi(s,i); const yO=pyv(s,o),yC=pyv(s,c),yH=pyv(s,h),yL=pyv(s,l);
  const bt=Math.min(yO,yC),bb=Math.max(yO,yC);
  ctx.globalAlpha=alpha; ctx.strokeStyle=col; ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(x,yH);ctx.lineTo(x,yL);ctx.stroke();
  ctx.fillStyle=col; const w=cwv(s); rr(x-w/2,bt,w,Math.max(2,bb-bt),2); ctx.fill();
  ctx.globalAlpha=1;
}
function hline(y,col,lw,dash,x0,x1){ctx.save();ctx.strokeStyle=col;ctx.lineWidth=lw;if(dash)ctx.setLineDash(dash);ctx.beginPath();ctx.moveTo(x0,y);ctx.lineTo(x1,y);ctx.stroke();ctx.restore();}

// ---- terminal chrome: header, grid, price axis ----
function drawChrome(s,alpha,axis){
  ctx.save();
  // header
  ctx.globalAlpha=alpha*0.92; ctx.textAlign='left'; ctx.textBaseline='alphabetic';
  ctx.fillStyle='#D6DBDF'; ctx.font='700 34px Tajawal';
  ctx.fillText('XAU / USD', CX0, CY0-34);
  ctx.fillStyle='#6E7A84'; ctx.font='500 22px Tajawal';
  ctx.fillText('1H · COMEX GOLD', CX0, CY0-8);
  // last price (scene close)
  const last=s.candles[n(s)-1][3];
  ctx.textAlign='right'; ctx.fillStyle=GOLD; ctx.font='700 30px Tajawal';
  ctx.fillText(last.toFixed(1), AXIS_X, CY0-22);
  // grid + axis labels
  const levels=5;
  ctx.textAlign='left'; ctx.font='500 21px Tajawal';
  for(let k=0;k<levels;k++){
    const p=s.lo+k/(levels-1)*(s.hi-s.lo); const y=pyv(s,p);
    ctx.globalAlpha=alpha*0.05; hline(y,'#C6D0DA',1,null,CX0,axis?AXIS_X-84:990);
    if(axis){ctx.globalAlpha=alpha*0.5; ctx.fillStyle='#6E7A84'; ctx.fillText(p.toFixed(1), AXIS_X-74, y+7);}
  }
  ctx.globalAlpha=1; ctx.restore();
}

function computeProfile(s,bins){
  const arr=new Array(bins).fill(0); const {lo,hi}=s;
  for(const [o,h,l,c] of s.candles){
    const b0=Math.floor((l-lo)/(hi-lo)*bins), b1=Math.ceil((h-lo)/(hi-lo)*bins);
    for(let b=Math.max(0,b0);b<Math.min(bins,b1);b++) arr[b]+=(Math.abs(c-o)+0.5);
  }
  const max=Math.max(...arr); let pocB=arr.indexOf(max);
  const total=arr.reduce((a,v)=>a+v,0); let lo_=pocB,hi_=pocB,accv=arr[pocB];
  while(accv<total*0.7 && (lo_>0||hi_<bins-1)){
    const dn=lo_>0?arr[lo_-1]:-1, upv=hi_<bins-1?arr[hi_+1]:-1;
    if(upv>=dn){hi_++;accv+=arr[hi_];}else{lo_--;accv+=arr[lo_];}
  }
  const binP=b=>lo+(b+0.5)/bins*(hi-lo);
  return {arr,max,pocP:binP(pocB),vah:lo+(hi_+1)/bins*(hi-lo),val:lo+lo_/bins*(hi-lo),bins};
}

function setEl(id,txt,x,y,cls,alpha,fs){
  let e=document.getElementById(id);
  if(!e){e=document.createElement('div');e.id=id;ov.appendChild(e);}
  e.className=cls; e.innerHTML=txt; e.style.position='absolute';
  e.style.left=x+'px'; e.style.top=y+'px'; if(fs)e.style.fontSize=fs+'px';
  e.style.opacity=alpha; e.style.display=alpha<=.01?'none':'block';
}
function clearOv(keepIds){[...ov.children].forEach(c=>{if(!keepIds.includes(c.id))c.style.display='none';});}

function reveal(s,lt,step,dur){for(let i=0;i<n(s);i++){const ap=ss(i*step, i*step+dur, lt); if(ap>0) candle(s,i,eOut(ap));}}

function drawHookScene(s,lt,alpha){
  drawChrome(s,alpha,true);
  ctx.globalAlpha=alpha; reveal(s,lt,0.045,0.5); ctx.globalAlpha=1;
  clearOv([]);
}

function drawProfileScene(s,lt,alpha){
  drawChrome(s,alpha,false);
  ctx.globalAlpha=alpha; reveal(s,lt,0.05,0.45); ctx.globalAlpha=1;
  const pf=computeProfile(s,26);
  const aPf=eOut(ss(1.4,2.6,lt));
  if(aPf>0){
    const RX=1000, maxLen=250, bh=(CY1-CY0)/pf.bins;
    for(let b=0;b<pf.bins;b++){
      const p=s.lo+(b+0.5)/pf.bins*(s.hi-s.lo); const y=pyv(s,p);
      const len=pf.arr[b]/pf.max*maxLen*aPf;
      const inVA=p<=pf.vah&&p>=pf.val; const isPoc=Math.abs(p-pf.pocP)<(s.hi-s.lo)/pf.bins;
      ctx.globalAlpha=alpha*(isPoc?.6:inVA?.34:.16);
      ctx.fillStyle=isPoc?GOLD:(inVA?'#9C8A57':'#5A6a72');
      rr(RX-len,y-bh/2+1,len,Math.max(1,bh-2),2); ctx.fill(); ctx.globalAlpha=1;
    }
    hline(pyv(s,pf.vah),'rgba(150,165,175,.55)',1.5,[8,7],CX0,1000);
    hline(pyv(s,pf.val),'rgba(150,165,175,.55)',1.5,[8,7],CX0,1000);
    hline(pyv(s,pf.pocP),'rgba(201,162,75,.9)',2,null,CX0,1000);
  }
  const la=eOut(ss(1.8,2.8,lt))*alpha;
  setEl('pPOC','POC', 250, pyv(s,pf.pocP), 'tag gold', la, 24);
  setEl('pVAH','VAH', 168, pyv(s,pf.vah)-2, 'tag neu', la, 22);
  setEl('pVAL','VAL', 168, pyv(s,pf.val)+2, 'tag neu', la, 22);
  setEl('pVA','منطقة القيمة', 250, pyv(s,pf.pocP)+90, 'lab', la*.9, 26);
  clearOv(['pPOC','pVAH','pVAL','pVA']);
}

function drawStructureScene(s,lt,alpha){
  drawChrome(s,alpha,true);
  ctx.globalAlpha=alpha; reveal(s,lt,0.06,0.45); ctx.globalAlpha=1;
  const keep=[];
  const aSw=eOut(ss(1.6,2.6,lt))*alpha;
  s.swings.forEach((sw,k)=>{
    const x=cxi(s,sw.i), y=pyv(s,sw.p); const above=sw.t==='HH';
    ctx.globalAlpha=aSw; ctx.fillStyle=above?BULL:GOLD;
    ctx.beginPath();ctx.arc(x,y,5,0,7); ctx.fill(); ctx.globalAlpha=1;
    const id='sw'+k; setEl(id, sw.t, x, y+(above?-40:40), 'tag '+(above?'up':'gold'), aSw, 23); keep.push(id);
  });
  const aBos=eOut(ss(3.0,4.0,lt))*alpha;
  if(aBos>0){
    hline(pyv(s,s.bos.p),'rgba(176,82,76,.85)',1.5,[9,7],cxi(s,4),AXIS_X-84);
    const bx=cxi(s,s.bos.breakI);
    setEl('bos','BOS · كسر الهيكل', bx+40, pyv(s,s.bos.p)+64, 'tag dn', aBos, 24); keep.push('bos');
    ctx.globalAlpha=aBos;ctx.strokeStyle=BEAR;ctx.lineWidth=3;
    const ay=pyv(s,s.bos.p);
    ctx.beginPath();ctx.moveTo(bx,ay+4);ctx.lineTo(bx,ay+46);ctx.stroke();
    ctx.beginPath();ctx.moveTo(bx-10,ay+34);ctx.lineTo(bx,ay+50);ctx.lineTo(bx+10,ay+34);ctx.stroke();ctx.globalAlpha=1;
  }
  clearOv(keep);
}

function drawBalanceScene(s,lt,alpha){
  drawChrome(s,alpha,true);
  ctx.globalAlpha=alpha; reveal(s,lt,0.06,0.45); ctx.globalAlpha=1;
  const keep=[];
  const aBal=eOut(ss(1.6,2.5,lt))*alpha;
  if(aBal>0){
    const [pl,ph,i0,i1]=s.balance; const x=cxi(s,i0)-cwv(s); const w=cxi(s,i1)+cwv(s)-x;
    const y=pyv(s,ph),h=pyv(s,pl)-y;
    ctx.globalAlpha=aBal*.55; ctx.fillStyle='rgba(150,165,175,.07)'; rr(x,y,w,h,3);ctx.fill();
    ctx.strokeStyle='rgba(150,165,175,.5)';ctx.lineWidth=1.5;ctx.setLineDash([7,6]);rr(x,y,w,h,3);ctx.stroke();ctx.setLineDash([]);ctx.globalAlpha=1;
    setEl('bal','BALANCE · توازن', x+w/2, y-32, 'tag neu', aBal, 24); keep.push('bal');
  }
  const aImb=eOut(ss(3.0,3.9,lt))*alpha;
  if(aImb>0){
    const [pl,ph,i0,i1]=s.imbalance; const x=cxi(s,i0)-cwv(s)*0.3; const w=cxi(s,i1)+cwv(s)-x;
    const y=pyv(s,ph),h=pyv(s,pl)-y;
    ctx.globalAlpha=aImb*.85; ctx.fillStyle='rgba(201,162,75,.12)'; rr(x,y,w*aImb,h,3);ctx.fill();
    ctx.strokeStyle='rgba(201,162,75,.75)';ctx.lineWidth=1.5;rr(x,y,w*aImb,h,3);ctx.stroke();ctx.globalAlpha=1;
    setEl('imb','FVG · عدم توازن', x+w*0.5, pyv(s,ph)+h+42, 'tag gold', aImb, 24); keep.push('imb');
    ctx.globalAlpha=aImb;ctx.strokeStyle=GOLD;ctx.lineWidth=3;
    const ax=cxi(s,s.dispI)-4, y0=pyv(s,s.imbalance[0])+26, y1=y0-64*aImb;
    ctx.beginPath();ctx.moveTo(ax,y0);ctx.lineTo(ax,y1);ctx.stroke();
    ctx.beginPath();ctx.moveTo(ax-10,y1+14);ctx.lineTo(ax,y1);ctx.lineTo(ax+10,y1+14);ctx.stroke();ctx.globalAlpha=1;
  }
  clearOv(keep);
}

function drawCTA(lt,a){
  const items=['البروفايل اليومي والأسبوعي','الماركت ستركتشر','التوازن وعدم التوازن'];
  const keep=[];
  const ah=eOut(ss(0.2,0.9,lt))*a;
  setEl('rH','الخلاصة', 540, 636, 'lab', ah, 30); keep.push('rH');
  // thin rule under header
  ctx.globalAlpha=ah*0.8; ctx.strokeStyle='rgba(201,162,75,.5)';ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(486,664);ctx.lineTo(594,664);ctx.stroke();ctx.globalAlpha=1;
  items.forEach((it,k)=>{
    const av=eOut(ss(0.6+k*0.3, 1.2+k*0.3, lt))*a;
    const id='r'+k; let e=document.getElementById(id)||(()=>{const d=document.createElement('div');d.id=id;ov.appendChild(d);return d;})();
    e.className=''; e.style.position='absolute'; e.style.left='540px'; e.style.top=(732+k*86)+'px';
    e.style.transform='translate(-50%,-50%)'; e.style.direction='rtl'; e.style.whiteSpace='nowrap';
    e.style.fontFamily="'Tajawal'"; e.style.fontWeight='600'; e.style.fontSize='34px'; e.style.color='#E1E5E8';
    e.innerHTML="<span style='color:#C9A24B;font-weight:700;margin-left:14px;direction:ltr;display:inline-block'>0"+(k+1)+"</span>"+it;
    e.style.opacity=av; e.style.display=av<=.01?'none':'block'; keep.push(id);
  });
  clearOv(keep);
}

function render(t){
  t=clamp(t,0,TOTAL);
  document.querySelector('#prog>i').style.width=(t/TOTAL*100)+'%';
  ctx.clearRect(0,0,W,H);
  SCENES.forEach(s=>{
    const fin=ss(s.start,s.start+0.55,t), fout=ss(s.end-0.5,s.end,t);
    const a=fin*(1-fout); if(a<=0.01) return;
    const lt=t-s.start;
    if(s.key==='hook') drawHookScene(s,lt,a);
    else if(s.key==='profile') drawProfileScene(s,lt,a);
    else if(s.key==='structure') drawStructureScene(s,lt,a);
    else if(s.key==='balance') drawBalanceScene(s,lt,a);
    else if(s.key==='cta') drawCTA(lt,a);
  });
  // section index
  const cur=SCENES.find(s=>t>=s.start&&t<s.end)||SCENES[SCENES.length-1];
  if(cur.title){
    const idx=SCENES.filter(x=>x.title).indexOf(cur)+1;
    const a=ss(cur.start+0.3,cur.start+1.0,t)*(1-ss(cur.end-0.6,cur.end,t));
    stepEl.style.opacity=a;
    stepEl.querySelector('.n').textContent='0'+idx;
    stepEl.querySelector('.ttl').textContent=cur.title;
  } else stepEl.style.opacity=0;
  // hook
  let hb=HOOKS[0],hi=0; for(let i=0;i<HOOKS.length;i++){if(t>=HOOKS[i].t){hb=HOOKS[i];hi=i;}}
  const nx=HOOKS[hi+1]; const inAt=hb.t,outAt=nx?nx.t:TOTAL;
  const fin=ss(inAt,inAt+0.5,t),fout=nx?ss(outAt-0.45,outAt,t):0;
  if(hook.dataset.i!=String(hi)){hook.dataset.i=String(hi);hook.innerHTML=hb.html;}
  const ap=fin*(1-fout); hook.style.opacity=ap;
  hook.parentElement.style.opacity=1;
  document.getElementById('hookmark').style.opacity=ap*0.9;
  hook.style.transform=`translateY(${(1-eOut(fin))*18}px)`;
}

let _t0=null,_live=true;
function loop(ts){if(_live){if(_t0==null)_t0=ts;render(((ts-_t0)/1000)%TOTAL);}requestAnimationFrame(loop);}
window.__setT=t=>{_live=false;render(t);};
window.__meta=()=>({fps:FPS,duration:TOTAL});
document.fonts.ready.then(()=>{render(0);requestAnimationFrame(loop);});
</script>
