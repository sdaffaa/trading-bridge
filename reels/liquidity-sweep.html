<meta charset="utf-8">
<title>Liquidity State — Liquidity Sweep</title>
<style>
  @font-face{font-family:'Tajawal';src:url('fonts/Tajawal-Medium.ttf');font-weight:500}
  @font-face{font-family:'Tajawal';src:url('fonts/Tajawal-Bold.ttf');font-weight:700}
  @font-face{font-family:'Tajawal';src:url('fonts/Tajawal-ExtraBold.ttf');font-weight:800}
  @font-face{font-family:'Tajawal';src:url('fonts/Tajawal-Black.ttf');font-weight:900}
  html,body{margin:0;padding:0;background:#07141A;overflow:hidden}
  #stage{position:relative;width:1080px;height:1920px;overflow:hidden;font-family:'Tajawal',sans-serif;
    background:radial-gradient(130% 90% at 50% 34%, #12262E 0%, #0E1E24 46%, #081318 100%)}
  canvas#c{position:absolute;inset:0;will-change:filter}
  /* --- overlay Arabic callouts (DOM so RTL shapes natively) --- */
  .lbl{position:absolute;direction:rtl;opacity:0;pointer-events:none;will-change:transform,opacity}
  #hook{left:60px;right:60px;top:250px;text-align:center;font-weight:900;font-size:96px;color:#EDF2F1;
    line-height:1.1;text-shadow:0 0 40px rgba(233,196,106,.45),0 6px 30px rgba(0,0,0,.8)}
  #hook em{font-style:normal;color:#E9C46A}
  #sub{left:60px;right:60px;top:470px;text-align:center;font-weight:700;font-size:46px;
    color:rgba(210,224,224,.92);letter-spacing:1px}
  /* pill callouts anchored on chart */
  .pill{display:inline-flex;align-items:center;gap:14px;padding:16px 30px;border-radius:20px;
    font-weight:800;font-size:44px;backdrop-filter:blur(2px);white-space:nowrap;
    box-shadow:0 10px 40px rgba(0,0,0,.5)}
  #pRest{left:0;right:0;top:1300px;text-align:center}
  #pRest .pill{background:rgba(18,38,46,.82);border:2px solid rgba(233,196,106,.55);color:#F0E4C4}
  #pSweep{left:0;right:0;top:980px;text-align:center}
  #pSweep .pill{background:rgba(58,22,24,.78);border:2px solid rgba(225,90,90,.75);color:#FFD9D9}
  #pRev{left:0;right:0;top:600px;text-align:center}
  #pRev .pill{background:rgba(16,44,38,.8);border:2px solid rgba(46,204,154,.8);color:#C8FFEC}
  #take{left:50px;right:50px;bottom:250px;text-align:center;direction:rtl;font-weight:900;font-size:70px;
    color:#fff;line-height:1.18;text-shadow:0 0 26px rgba(46,204,154,.4),0 6px 26px rgba(0,0,0,.8)}
  #take b{color:#E9C46A}
  #wm{position:absolute;left:60px;bottom:120px;display:flex;align-items:center;gap:14px;opacity:0}
  #wm .g{width:40px;height:40px}
  #wm .t{font-weight:700;letter-spacing:2px;font-size:30px;color:rgba(220,228,228,.92)}
</style>
<div id="stage">
  <canvas id="c" width="1080" height="1920"></canvas>
  <div class="lbl" id="hook"></div>
  <div class="lbl" id="sub"></div>
  <div class="lbl" id="pRest"><span class="pill">◆ سيولة مستريحة</span></div>
  <div class="lbl" id="pSweep"><span class="pill">↓ كنس السيولة</span></div>
  <div class="lbl" id="pRev"><span class="pill">↑ انعكاس</span></div>
  <div class="lbl" id="take"></div>
  <div id="wm">
    <svg class="g" viewBox="0 0 100 100"><g fill="none" stroke="#d7c79a" stroke-width="3" stroke-linejoin="round"><polygon points="50,6 88,28 88,72 50,94 12,72 12,28"/><path d="M12,28 L50,43 L88,28"/><path d="M12,72 L50,43 L88,72"/><path d="M50,43 L50,94"/></g></svg>
    <div class="t" dir="ltr">@liquidity.state</div>
  </div>
</div>
<script>
const FPS=30,W=1080,H=1920,TOTAL=16.8;
// ---- REAL gold (XAUUSD) hourly candles: a validated sell-side liquidity sweep ----
const C=[[4084.4,4087.4,4083.3,4085.2],[4085.5,4107.5,4081.1,4101.6],[4102.3,4128.4,4100.8,4126.0],
[4126.4,4135.3,4123.1,4134.7],[4134.8,4146.0,4133.6,4135.5],[4135.1,4135.6,4129.4,4131.8],
[4131.6,4138.6,4127.5,4135.5],[4135.4,4140.0,4117.8,4121.0],[4120.8,4127.4,4113.3,4114.6],
[4115.0,4124.4,4114.8,4122.3],[4122.6,4126.6,4117.5,4118.8],[4119.2,4126.1,4119.2,4121.2],
[4121.8,4127.9,4117.2,4127.4],[4127.5,4139.5,4110.4,4117.0],[4117.1,4161.5,4117.0,4160.0],
[4159.8,4168.8,4148.6,4153.4],[4153.5,4171.4,4153.4,4164.1],[4164.4,4164.5,4150.1,4152.8],
[4152.8,4153.6,4143.8,4148.1],[4147.9,4148.4,4137.5,4141.8],[4141.4,4142.5,4133.9,4136.4],
[4136.4,4142.8,4133.2,4135.0],[4126.0,4133.0,4074.6,4124.7],[4125.1,4137.1,4118.9,4135.8]];
const N=C.length, SWEEP=22, CONFIRM=23;
const LEVEL=4111.0;                 // equal-lows support (resting liquidity level)
const SWEEP_LOW=4074.6;

// ---- geometry ----
const c=document.getElementById('c'), g=c.getContext('2d');
const CX0=90,CX1=1000,CY0=560,CY1=1440;
const slotW=(CX1-CX0)/N, bodyW=Math.min(34,slotW*0.60);
const xi=i=>CX0+i*slotW+slotW/2;
let LO=4074.6,HI=4171.4; const PAD=(HI-LO)*0.10; LO-=PAD; HI+=PAD;
const py=p=>CY0+(HI-p)/(HI-LO)*(CY1-CY0);

const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const ss=(a,b,x)=>{x=clamp((x-a)/(b-a),0,1);return x*x*(3-2*x);};
const lerp=(a,b,x)=>a+(b-a)*x;
const eOut=x=>1-Math.pow(1-clamp(x,0,1),3);
function rr(x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();}

// deterministic rng
let _s=20240; const rnd=()=>{_s=(_s*1664525+1013904223)&0x7fffffff;return _s/0x7fffffff;};
// ambient dust
const DUST=[]; for(let i=0;i<54;i++)DUST.push([rnd()*W,rnd()*H,0.5+rnd()*1.8,rnd()*6.28,(rnd()-.5)*6,(rnd()-.5)*5]);
// resting-liquidity markers: a cluster of small orders sitting just under the level
const MK=[]; for(let i=0;i<16;i++){const col=i%2;MK.push([lerp(xi(7),xi(21),(i>>1)/7)+ (col?9:-9), py(LEVEL)+18+ (i%4)*13, 0.7+rnd()*0.3]);}

// per-candle appear time + grow duration
const APP=[0.7,1.0,1.35,1.7,2.05,2.4,2.75,3.1, 3.5,3.9,4.3,4.75,5.25,5.8, 6.45, 6.9,7.25,7.6,7.95,8.3,8.65,9.0, 9.7, 11.5];
const DUR=i=> i===SWEEP?1.15 : i===CONFIRM?0.7 : (i===14?0.6:0.42);

// ---------- candle ----------
function candle(i,t){
  const ap=eOut(ss(APP[i],APP[i]+DUR(i),t)); if(ap<=0.001) return;
  const [o,h,l,cl]=C[i];
  const curC=lerp(o,cl,ap), curH=lerp(o,Math.max(o,h),ap), curL=lerp(o,Math.min(o,l),ap);
  const up=curC>=o; const bull='#2ECC9A', bear='#E15A5A'; const col=up?bull:bear;
  const x=xi(i); const yO=py(o), yC=py(curC); const top=Math.min(yO,yC), bot=Math.max(yO,yC);
  const bh=Math.max(2,bot-top);
  // motion-echo trail on the sweep candle (faint ghost of the plunging wick)
  if(i===SWEEP&&ap<0.98){
    const gh=0.20*(1-ap);
    g.save();g.globalAlpha=gh;g.strokeStyle=bear;g.lineWidth=3;
    g.beginPath();g.moveTo(x-6,py(o));g.lineTo(x-6,py(curL));g.stroke();g.restore();
  }
  // wick
  g.strokeStyle=col;g.lineWidth=Math.max(2,bodyW*0.10);
  g.beginPath();g.moveTo(x,py(curH));g.lineTo(x,py(curL));g.stroke();
  // body: 3D gradient + gloss (brand gradient, fixed colors)
  const gr=g.createLinearGradient(x-bodyW/2,top,x+bodyW/2,bot);
  if(up){gr.addColorStop(0,'#37E4AE');gr.addColorStop(1,'#1F9E77');}
  else {gr.addColorStop(0,'#F0736F');gr.addColorStop(1,'#B83E3E');}
  g.save();
  g.shadowColor=up?'rgba(46,204,154,.55)':'rgba(225,90,90,.55)';
  g.shadowBlur = (i===SWEEP)?26:14;
  g.fillStyle=gr; rr(x-bodyW/2,top,bodyW,bh,4); g.fill();
  g.restore();
  g.globalAlpha=.5;g.fillStyle='rgba(255,255,255,.25)';rr(x-bodyW/2+3,top+2,bodyW*0.34,bh-4,3);g.fill();g.globalAlpha=1;
}

// ---------- price axis ----------
function axis(){
  g.font="500 24px Tajawal"; g.textAlign="left"; g.textBaseline="middle";
  const ticks=[4080,4100,4120,4140,4160];
  g.strokeStyle='rgba(210,224,224,.08)';g.lineWidth=1;
  ticks.forEach(p=>{const y=py(p);g.beginPath();g.moveTo(CX0,y);g.lineTo(CX1,y);g.stroke();
    g.fillStyle='rgba(190,206,206,.55)';g.fillText(String(p),CX1+14,y);});
}

// ---------- background dust ----------
function dust(t){
  for(const d of DUST){const x=((d[0]+d[4]*t)%W+W)%W, y=((d[1]+d[5]*t)%H+H)%H;
    const a=0.10+0.08*Math.sin(t*0.8+d[3]);
    g.fillStyle='rgba(150,200,195,'+a+')';g.beginPath();g.arc(x,y,d[2],0,6.28);g.fill();}
}

// ---------- render ----------
function render(t){
  t=clamp(t,0,TOTAL);
  g.clearRect(0,0,W,H);
  dust(t);

  // depth-of-field focus pull: chart softens during the tense rollover, snaps sharp as the wick pierces
  const blur = 1.4*ss(6.3,7.1,t)*(1-ss(9.9,10.5,t));
  c.style.filter = blur>0.02 ? `blur(${blur.toFixed(2)}px)` : 'none';

  // ---- continuous single-shot camera (no cuts) ----
  const drift = 1 + 0.035*ss(0,TOTAL,t);                        // slow perpetual push-in
  const sweepPush = 0.12*ss(9.0,10.6,t)*(1-ss(12.8,14.0,t));    // dive into the sweep, then release
  const zoom = drift + sweepPush;
  const focusX = lerp(W/2, xi(SWEEP), ss(9.0,10.5,t)*(1-0.5*ss(12.8,14.2,t)));
  const focusY = lerp((CY0+CY1)/2, py(4092), sweepPush/0.12*0.55);
  const bobX = Math.sin(t*0.5)*5, bobY = Math.cos(t*0.42)*4;    // subtle handheld life
  g.save();
  g.translate(W/2,(CY0+CY1)/2); g.scale(zoom,zoom);
  g.translate(-focusX+bobX,-focusY+bobY);

  axis();

  // liquidity zone band across the equal lows (shimmer)
  const zA=ss(3.2,4.2,t)*(1-ss(13.6,14.4,t));
  if(zA>0){const yb=py(LEVEL+6), hh=py(LEVEL-16)-yb;
    const shim=0.12+0.05*Math.sin(t*2.2);
    g.fillStyle='rgba(233,196,106,'+(0.10*zA)+')';g.fillRect(CX0,yb,CX1-CX0,hh);
    // level line auto-draws left->right with a moving light head
    const draw=eOut(ss(3.6,5.0,t)); const xEnd=lerp(CX0,CX1,draw);
    g.setLineDash([12,9]);g.lineWidth=2.5;g.strokeStyle='rgba(233,196,106,'+(0.7*zA)+')';
    g.beginPath();g.moveTo(CX0,py(LEVEL));g.lineTo(xEnd,py(LEVEL));g.stroke();g.setLineDash([]);
    if(draw<1){g.fillStyle='rgba(255,240,200,'+(0.9*zA)+')';g.beginPath();g.arc(xEnd,py(LEVEL),5,0,6.28);g.fill();
      g.shadowColor='rgba(233,196,106,.9)';g.shadowBlur=18;g.fill();g.shadowBlur=0;}
    void shim;
  }

  // resting-liquidity markers (get consumed as the wick pierces through them)
  const mkIn=ss(4.4,5.4,t);
  const consume=ss(10.0,10.75,t);          // swept into the wick tip
  if(mkIn>0){
    const tipX=xi(SWEEP), tipY=py(SWEEP_LOW);
    for(let k=0;k<MK.length;k++){const m=MK[k];
      const px=lerp(m[0],tipX,consume), pyy=lerp(m[1],tipY,consume);
      const flash=consume>0&&consume<0.6?1:0;
      const a=mkIn*m[2]*(1-consume);
      g.fillStyle=flash?'rgba(255,255,255,'+(a)+')':'rgba(233,196,106,'+(0.85*a)+')';
      g.fillRect(px-7,pyy-1.5,14,3);
    }
  }

  // candles
  for(let i=0;i<N;i++) candle(i,t);

  // sweep impact: shockwave rings + a quick vignette pulse from the wick tip
  const imp=ss(10.5,11.5,t);
  if(imp>0&&imp<1){
    const tipX=xi(SWEEP), tipY=py(SWEEP_LOW);
    for(let r=0;r<2;r++){const p=clamp(imp-r*0.18,0,1); if(p<=0)continue;
      g.strokeStyle='rgba(225,90,90,'+(0.5*(1-p))+')';g.lineWidth=4*(1-p)+1;
      g.beginPath();g.arc(tipX,tipY,lerp(6,360,eOut(p)),0,6.28);g.stroke();}
  }
  g.restore();

  // vignette pulse (screen space, brief) at impact
  const vig=Math.sin(clamp((t-10.5)/0.55,0,1)*Math.PI);
  if(vig>0){const rg=g.createRadialGradient(W/2,H*0.55,300,W/2,H*0.55,1100);
    rg.addColorStop(0,'rgba(0,0,0,0)');rg.addColorStop(1,'rgba(90,10,12,'+(0.28*vig)+')');
    g.fillStyle=rg;g.fillRect(0,0,W,H);}

  drawOverlays(t);
}

// ---------- DOM overlay driver ----------
const $=id=>document.getElementById(id);
function set(el,o,ty,sc){el.style.opacity=o;el.style.transform=`translateY(${ty||0}px) scale(${sc||1})`;}
function drawOverlays(t){
  // hook (0 - 2.0)
  const hk=ss(0.15,0.6,t)*(1-ss(1.7,2.1,t));
  $('hook').innerHTML='وين تختبئ <em>السيولة؟</em>';
  set($('hook'),hk, lerp(24,0,ss(0.15,0.7,t)), lerp(1.06,1,ss(0.15,0.7,t)));
  const hs=ss(0.5,0.9,t)*(1-ss(1.7,2.1,t));
  $('sub').textContent='الإعداد اللي يفوت أغلب المتداولين';
  set($('sub'),hs,0,1);
  // resting-liquidity pill (4.6 - 8.7)
  const pr=ss(4.7,5.2,t)*(1-ss(8.4,8.9,t));
  set($('pRest'),pr, lerp(16,0,ss(4.7,5.2,t)),1);
  // sweep pill (10.0 - 12.7)
  const psw=ss(10.05,10.5,t)*(1-ss(12.4,12.9,t));
  const shake=psw>0?Math.sin(t*26)*3*ss(10.5,10.8,t)*(1-ss(11.0,11.4,t)):0;
  set($('pSweep'),psw, lerp(-14,0,ss(10.05,10.6,t)) + shake,1);
  // reversal pill (12.0 - 14.4)
  const pv=ss(12.0,12.5,t)*(1-ss(14.2,14.7,t));
  set($('pRev'),pv, lerp(14,0,ss(12.0,12.5,t)),1);
  // takeaway (14.2 - end)
  const tk=ss(14.3,14.9,t);
  $('take').innerHTML='يكنسون <b>السيولة</b>… ثم ينعكس السعر';
  set($('take'),tk, lerp(20,0,tk),1);
  // watermark
  $('wm').style.opacity=ss(1.8,2.6,t)*0.95;
}

let _t0=null,_live=true;
function loop(ts){if(_live){if(_t0==null)_t0=ts;render(((ts-_t0)/1000)%TOTAL);}requestAnimationFrame(loop);}
window.__setT=t=>{_live=false;render(t);};
window.__meta=()=>({fps:FPS,duration:TOTAL});
render(0); requestAnimationFrame(loop);
</script>
