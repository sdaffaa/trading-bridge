<meta charset="utf-8">
<title>Liquidity State — Liquidity Sweep</title>
<style>
  @font-face{font-family:'Tajawal';src:url('fonts/Tajawal-Medium.ttf');font-weight:500}
  @font-face{font-family:'Tajawal';src:url('fonts/Tajawal-Bold.ttf');font-weight:700}
  @font-face{font-family:'Tajawal';src:url('fonts/Tajawal-ExtraBold.ttf');font-weight:800}
  @font-face{font-family:'Tajawal';src:url('fonts/Tajawal-Black.ttf');font-weight:900}
  html,body{margin:0;padding:0;background:#07141A;overflow:hidden}
  #stage{position:relative;width:1080px;height:1920px;overflow:hidden;font-family:'Tajawal',sans-serif;
    background:radial-gradient(130% 90% at 50% 34%, #12262E 0%, #0E1E24 46%, #081318 100%)}
  canvas#c{position:absolute;inset:0;will-change:filter}
  .lbl{position:absolute;direction:rtl;opacity:0;pointer-events:none;will-change:transform,opacity}
  #hook{left:60px;right:60px;top:250px;text-align:center;font-weight:900;font-size:100px;color:#EDF2F1;
    line-height:1.1;text-shadow:0 0 40px rgba(233,196,106,.45),0 6px 30px rgba(0,0,0,.8)}
  #hook em{font-style:normal;color:#E9C46A}
  #sub{left:60px;right:60px;top:480px;text-align:center;font-weight:700;font-size:46px;
    color:rgba(210,224,224,.92);letter-spacing:1px}
  /* tasteful brand definition cutaway */
  #defcard{position:absolute;inset:0;opacity:0;display:flex;flex-direction:column;justify-content:center;
    align-items:center;background:radial-gradient(130% 90% at 50% 40%, #12262E, #081318);
    direction:rtl;pointer-events:none;padding:0 80px}
  #defcard .term{font-weight:900;font-size:118px;color:#0E1E24;background:#E9C46A;padding:4px 34px;border-radius:12px;
    line-height:1.14;box-shadow:0 14px 50px rgba(233,196,106,.28)}
  #defcard .def{margin-top:50px;font-weight:800;font-size:56px;color:#EDF2F1;text-align:center;line-height:1.4}
  #defcard .en{margin-top:30px;font-weight:700;font-size:32px;letter-spacing:4px;color:rgba(233,196,106,.9)}
  /* narrative pills */
  .pill{display:inline-flex;align-items:center;gap:14px;padding:16px 30px;border-radius:20px;
    font-weight:800;font-size:44px;white-space:nowrap;box-shadow:0 10px 40px rgba(0,0,0,.5)}
  #pRest{left:0;right:0;top:1300px;text-align:center}
  #pRest .pill{background:rgba(18,38,46,.85);border:2px solid rgba(233,196,106,.55);color:#F0E4C4}
  #pSweep{left:0;right:0;top:960px;text-align:center}
  #pSweep .pill{background:rgba(58,22,24,.82);border:2px solid rgba(225,90,90,.8);color:#FFD9D9}
  #pRev{left:0;right:0;top:600px;text-align:center}
  #pRev .pill{background:rgba(16,44,38,.85);border:2px solid rgba(46,204,154,.85);color:#C8FFEC}
  #tgt{left:0;right:0;top:430px;text-align:center;font-weight:800;font-size:42px;color:#F0E4C4}
  #take{left:50px;right:50px;bottom:250px;text-align:center;direction:rtl;font-weight:900;font-size:70px;
    color:#fff;line-height:1.18;text-shadow:0 0 26px rgba(46,204,154,.4),0 6px 26px rgba(0,0,0,.8)}
  #take b{color:#E9C46A}
  #wm{position:absolute;left:60px;bottom:120px;display:flex;align-items:center;gap:14px;opacity:0}
  #wm .g{width:40px;height:40px}
  #wm .t{font-weight:700;letter-spacing:2px;font-size:30px;color:rgba(220,228,228,.92)}
</style>
<div id="stage">
  <canvas id="c" width="1080" height="1920"></canvas>
  <div class="lbl" id="hook"></div>
  <div class="lbl" id="sub"></div>
  <div id="defcard">
    <div class="term">السيولة</div>
    <div class="def">تجمُّع أوامر وقف الخسارة<br>تحت القيعان</div>
    <div class="en">SELL-SIDE LIQUIDITY</div>
  </div>
  <div class="lbl" id="pRest"><span class="pill">◆ سيولة مستريحة</span></div>
  <div class="lbl" id="pSweep"><span class="pill">↓ كنس السيولة</span></div>
  <div class="lbl" id="pRev"><span class="pill">↑ انعكاس من الطلب</span></div>
  <div class="lbl" id="tgt">الهدف ← السيولة الشرائية بالأعلى</div>
  <div class="lbl" id="take"></div>
  <div id="wm">
    <svg class="g" viewBox="0 0 100 100"><g fill="none" stroke="#d7c79a" stroke-width="3" stroke-linejoin="round"><polygon points="50,6 88,28 88,72 50,94 12,72 12,28"/><path d="M12,28 L50,43 L88,28"/><path d="M12,72 L50,43 L88,72"/><path d="M50,43 L50,94"/></g></svg>
    <div class="t" dir="ltr">@liquidity.state</div>
  </div>
</div>
<script>
const FPS=30,W=1080,H=1920,TOTAL=19.6;
// ---- REAL gold (XAUUSD) hourly candles: a validated sell-side liquidity sweep ----
const C=[[4084.4,4087.4,4083.3,4085.2],[4085.5,4107.5,4081.1,4101.6],[4102.3,4128.4,4100.8,4126.0],
[4126.4,4135.3,4123.1,4134.7],[4134.8,4146.0,4133.6,4135.5],[4135.1,4135.6,4129.4,4131.8],
[4131.6,4138.6,4127.5,4135.5],[4135.4,4140.0,4117.8,4121.0],[4120.8,4127.4,4113.3,4114.6],
[4115.0,4124.4,4114.8,4122.3],[4122.6,4126.6,4117.5,4118.8],[4119.2,4126.1,4119.2,4121.2],
[4121.8,4127.9,4117.2,4127.4],[4127.5,4139.5,4110.4,4117.0],[4117.1,4161.5,4117.0,4160.0],
[4159.8,4168.8,4148.6,4153.4],[4153.5,4171.4,4153.4,4164.1],[4164.4,4164.5,4150.1,4152.8],
[4152.8,4153.6,4143.8,4148.1],[4147.9,4148.4,4137.5,4141.8],[4141.4,4142.5,4133.9,4135.0],
[4136.4,4142.8,4133.2,4135.0],[4126.0,4133.0,4074.6,4124.7],[4125.1,4137.1,4118.9,4135.8]];
const N=C.length, SWEEP=22, CONFIRM=23;
const SSL=4111.0;                   // equal-lows support = sell-side liquidity
const BSL=4169.0;                   // equal-highs = buy-side liquidity (upside objective)
const SWEEP_LOW=4074.6;
const OB_HI=4100.0, OB_LO=4076.0;   // demand / order block the sweep reverses from

// ---- geometry ----
const c=document.getElementById('c'), g=c.getContext('2d');
const CX0=110,CX1=930,CY0=560,CY1=1440;
const slotW=(CX1-CX0)/N, bodyW=Math.min(26,slotW*0.62);
const xi=i=>CX0+i*slotW+slotW/2;
let LO=4074.6,HI=4171.4; const PAD=(HI-LO)*0.10; LO-=PAD; HI+=PAD;
const py=p=>CY0+(HI-p)/(HI-LO)*(CY1-CY0);

const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const ss=(a,b,x)=>{x=clamp((x-a)/(b-a),0,1);return x*x*(3-2*x);};
const lerp=(a,b,x)=>a+(b-a)*x;
const eOut=x=>1-Math.pow(1-clamp(x,0,1),3);
const eIn=x=>{x=clamp(x,0,1);return x*x*x;};
const eBack=x=>{x=clamp(x,0,1);const s=1.9;return 1+(s+1)*Math.pow(x-1,3)+s*Math.pow(x-1,2);};
function rr(x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();}

let _s=20240; const rnd=()=>{_s=(_s*1664525+1013904223)&0x7fffffff;return _s/0x7fffffff;};
const DUST=[]; for(let i=0;i<48;i++)DUST.push([rnd()*W,rnd()*H,0.5+rnd()*1.6,rnd()*6.28,(rnd()-.5)*6,(rnd()-.5)*5]);
const MK=[]; for(let i=0;i<18;i++){const cc=i%2;MK.push([lerp(xi(7),xi(21),(i>>1)/8)+(cc?10:-10), py(SSL)+16+(i%5)*11, 0.7+rnd()*0.3, rnd()*6.28]);}
const SPARK=[]; for(let i=0;i<28;i++)SPARK.push([rnd()*6.28, 70+rnd()*210, 2+rnd()*3.5]);

// per-candle appear time + grow duration (chart begins after the definition cutaway)
const APP=[3.0,3.2,3.45,3.7,3.95,4.2,4.45,4.7, 5.0,5.35,5.7,6.15,6.6,7.1, 7.6, 8.0,8.35,8.7,9.05,9.4,9.75,10.1, 10.7, 12.6];
const DUR=i=> i===SWEEP?1.2 : i===CONFIRM?0.7 : (i===14?0.55:0.4);

// ---------- flat, TradingView-style candle ----------
function candle(i,t){
  const ap=eOut(ss(APP[i],APP[i]+DUR(i),t)); if(ap<=0.001) return;
  const [o,h,l,cl]=C[i];
  const curC=lerp(o,cl,ap), curH=lerp(o,h,ap), curL=lerp(o,l,ap);
  const up=curC>=o; const col=up?'#2ECC9A':'#E15A5A';
  const x=Math.round(xi(i)); const top=Math.min(py(o),py(curC)), bot=Math.max(py(o),py(curC));
  const bh=Math.max(1.5,bot-top);
  g.strokeStyle=col; g.lineWidth=2.4;                       // crisp centered wick
  g.beginPath(); g.moveTo(x,py(curH)); g.lineTo(x,py(curL)); g.stroke();
  g.fillStyle=col; g.fillRect(Math.round(x-bodyW/2), top, bodyW, bh);   // flat solid body
}

// ---------- markup: LIVE, cinematic SMC analysis ----------
function tag(x,y,text,fill,stroke,glow,anchor,a,pop){
  g.save(); g.globalAlpha=a;
  const sc=lerp(0.55,1,eBack(pop==null?1:pop));
  g.translate(x,y); g.scale(sc,sc); g.translate(-x,-y);
  g.font="800 26px Tajawal, sans-serif";
  const w=g.measureText(text).width+34, hh=44; const bx=anchor==='r'?x-w:x;
  g.shadowColor=glow; g.shadowBlur=18;
  rr(bx,y-hh/2,w,hh,11); g.fillStyle=fill; g.fill();
  g.shadowBlur=0; g.lineWidth=2; g.strokeStyle=stroke; g.stroke();
  g.fillStyle='#EDF2F1'; g.textAlign='left'; g.textBaseline='middle'; g.fillText(text,bx+17,y+1);
  g.restore();
}
// glowing, flowing-dash level line with a traveling light head
function glowLine(price,color,glow,a,t,drawA,intensity){
  if(a<=0)return; const draw=eOut(drawA), xEnd=lerp(CX0,CX1+70,draw), y=py(price);
  const pulse=0.65+0.35*Math.sin(t*(2.2+2.6*(intensity||0)));
  g.save(); g.globalAlpha=a;
  g.setLineDash([16,11]); g.lineDashOffset=-t*36;
  g.strokeStyle=color; g.lineWidth=2.6+1.2*(intensity||0);
  g.shadowColor=glow; g.shadowBlur=(14+16*(intensity||0))*pulse;
  g.beginPath(); g.moveTo(CX0,y); g.lineTo(xEnd,y); g.stroke();
  g.setLineDash([]); g.shadowBlur=0;
  if(draw<1){g.fillStyle='#fff'; g.shadowColor=glow; g.shadowBlur=26;
    g.beginPath(); g.arc(xEnd,y,5.5,0,6.28); g.fill();}
  g.restore();
}

function axis(){
  g.font="500 24px Tajawal"; g.textAlign="left"; g.textBaseline="middle";
  [4080,4100,4120,4140,4160].forEach(p=>{const y=py(p);
    g.strokeStyle='rgba(210,224,224,.06)';g.lineWidth=1;g.beginPath();g.moveTo(CX0,y);g.lineTo(CX1+70,y);g.stroke();
    g.fillStyle='rgba(190,206,206,.5)';g.fillText(String(p),CX1+82,y);});
}
function dust(t){for(const d of DUST){const x=((d[0]+d[4]*t)%W+W)%W,y=((d[1]+d[5]*t)%H+H)%H;
  g.fillStyle='rgba(150,200,195,'+(0.08+0.06*Math.sin(t*0.8+d[3]))+')';g.beginPath();g.arc(x,y,d[2],0,6.28);g.fill();}}

// ---------- render ----------
function render(t){
  t=clamp(t,0,TOTAL); g.clearRect(0,0,W,H); dust(t);

  const blur = 1.3*ss(7.6,8.3,t)*(1-ss(10.7,11.4,t));   // focus pull → snaps sharp as the wick pierces
  c.style.filter = blur>0.02 ? `blur(${blur.toFixed(2)}px)` : 'none';

  // continuous single-shot camera (no cuts) + impact shake
  const drift = 1 + 0.03*ss(3,TOTAL,t);
  const sweepPush = 0.12*ss(9.8,11.5,t)*(1-ss(14.4,15.6,t));
  const zoom = drift + sweepPush;
  const focusX = lerp(W/2, xi(SWEEP), ss(9.8,11.4,t)*(1-0.5*ss(14.4,15.8,t)));
  const focusY = lerp((CY0+CY1)/2, py(4092), sweepPush/0.12*0.55);
  const shake = 13*Math.max(0,Math.sin(clamp((t-11.15)/0.55,0,1)*Math.PI));
  g.save(); g.translate(W/2 + shake*Math.sin(t*88), (CY0+CY1)/2 + shake*Math.cos(t*80));
  g.scale(zoom,zoom);
  g.translate(-focusX+Math.sin(t*0.5)*5, -focusY+Math.cos(t*0.42)*4);

  axis();

  const tension = ss(9.0,11.0,t)*(1-ss(11.5,12.2,t));   // SSL "charges" as price closes in, discharges on the sweep
  const tipX=xi(SWEEP), tipY=py(SWEEP_LOW);

  // --- BSL (buy-side liquidity = upside objective) ---
  const bslA=ss(4.4,5.2,t)*(1-ss(18.6,19.4,t));
  const bslTgt=ss(14.8,15.6,t)*(1-ss(18.6,19.4,t));      // ignites once it becomes the target
  if(bslA>0){ glowLine(BSL,'rgba(240,214,140,.98)','#E9C46A',bslA,t,ss(4.4,5.2,t), 0.22+0.78*bslTgt);
    tag(CX0+6,py(BSL)-28,'BSL','rgba(18,38,46,.92)','rgba(233,196,106,.85)','#E9C46A','l',bslA, ss(4.5,5.0,t)); }

  // --- SSL (sell-side liquidity that gets swept) ---
  const sslZ=ss(4.6,5.4,t)*(1-ss(15.2,16.0,t));
  if(sslZ>0){
    const yb=py(SSL+6),hh=py(SSL-16)-yb;
    g.fillStyle='rgba(225,90,90,'+((0.06+0.12*tension)*sslZ)+')'; g.fillRect(CX0,yb,CX1+70-CX0,hh);
    glowLine(SSL,'rgba(242,112,112,.98)','#E15A5A',sslZ,t,ss(4.6,5.4,t), tension);
    tag(CX0+6,py(SSL)+30,'SSL','rgba(48,20,22,.94)','rgba(225,90,90,.9)','#E15A5A','l',sslZ, ss(4.7,5.2,t));
  }

  // --- resting liquidity: glowing orbs that get sucked into the wick ---
  const mkIn=ss(5.2,6.2,t), consume=ss(10.7,11.5,t), ci=eIn(consume);
  if(mkIn>0){
    for(const m of MK){
      const fx=m[0]+Math.sin(t*1.6+m[3])*3, fy=m[1]+Math.cos(t*1.3+m[3])*3;
      const px=lerp(fx,tipX,ci), pyy=lerp(fy,tipY,ci);
      const a=mkIn*m[2]*(1-consume*0.92); if(a<=0) continue;
      g.save(); g.globalAlpha=a;
      if(consume>0&&consume<1){const cb=eIn(clamp(consume-0.09,0,1));
        g.strokeStyle='rgba(233,196,106,'+(0.75*a)+')'; g.lineWidth=2.4; g.shadowColor='#E9C46A'; g.shadowBlur=10;
        g.beginPath(); g.moveTo(lerp(fx,tipX,cb),lerp(fy,tipY,cb)); g.lineTo(px,pyy); g.stroke();}
      g.fillStyle=consume>0?'#FFF3D6':'#E9C46A'; g.shadowColor='#E9C46A'; g.shadowBlur=consume>0?18:9;
      g.beginPath(); g.arc(px,pyy,3.2,0,6.28); g.fill(); g.restore();
    }
  }

  // --- Demand / Order Block: gradient + scan sweep + pulsing glow border ---
  const obA=ss(12.4,13.2,t)*(1-ss(18.6,19.4,t));
  if(obA>0){const yb=py(OB_HI),hh=py(OB_LO)-yb, xw=CX1+70-CX0;
    const grd=g.createLinearGradient(0,yb,0,yb+hh);
    grd.addColorStop(0,'rgba(46,204,154,'+(0.05*obA)+')');grd.addColorStop(.5,'rgba(46,204,154,'+(0.28*obA)+')');grd.addColorStop(1,'rgba(46,204,154,'+(0.05*obA)+')');
    g.fillStyle=grd; g.fillRect(CX0,yb,xw,hh);
    const scn=(t*0.32)%1, sx=CX0+scn*xw;
    const sg=g.createLinearGradient(sx-90,0,sx+90,0);
    sg.addColorStop(0,'rgba(150,255,225,0)');sg.addColorStop(.5,'rgba(150,255,225,'+(0.18*obA)+')');sg.addColorStop(1,'rgba(150,255,225,0)');
    g.fillStyle=sg; g.fillRect(CX0,yb,xw,hh);
    g.save(); g.globalAlpha=obA; g.strokeStyle='rgba(46,204,154,'+(0.55+0.45*Math.sin(t*4))+')'; g.lineWidth=2.5;
    g.shadowColor='#2ECC9A'; g.shadowBlur=14+9*Math.sin(t*4); g.strokeRect(CX0,yb,xw,hh); g.restore();
    tag(CX1+64,yb+hh/2,'OB','rgba(16,44,38,.95)','rgba(46,204,154,.9)','#2ECC9A','r',obA, ss(12.4,12.9,t));
  }

  // candles
  for(let i=0;i<N;i++) candle(i,t);

  // hot glowing wick on the sweep candle at the pierce
  const hot=ss(10.4,11.3,t)*(1-ss(11.9,12.6,t));
  if(hot>0){const [o,,l]=C[SWEEP]; g.save();g.globalAlpha=hot;
    g.strokeStyle='#FF8A6A'; g.lineWidth=4; g.shadowColor='#E15A5A'; g.shadowBlur=26;
    g.beginPath();g.moveTo(tipX,py(o));g.lineTo(tipX,py(l));g.stroke();g.restore();}

  // sweep impact: shockwave rings + spark burst + white flash
  const imp=ss(11.15,12.2,t);
  if(imp>0&&imp<1){g.save();
    for(let r=0;r<3;r++){const p=clamp(imp-r*0.14,0,1);if(p<=0)continue;
      g.strokeStyle='rgba(242,112,112,'+(0.55*(1-p))+')';g.lineWidth=5*(1-p)+1;g.shadowColor='#E15A5A';g.shadowBlur=14*(1-p);
      g.beginPath();g.arc(tipX,tipY,lerp(6,380,eOut(p)),0,6.28);g.stroke();}
    g.restore();}
  const burst=ss(11.2,11.95,t);
  if(burst>0&&burst<1){g.save();g.shadowColor='#E15A5A';g.shadowBlur=12;
    for(const s of SPARK){const d=lerp(0,s[1],eOut(burst));
      g.globalAlpha=(1-burst)*0.95;g.fillStyle='#FFCFC6';
      g.beginPath();g.arc(tipX+Math.cos(s[0])*d,tipY+Math.sin(s[0])*d,s[2]*(1-burst*0.5),0,6.28);g.fill();}
    g.restore();}
  const flash=Math.sin(clamp((t-11.15)/0.34,0,1)*Math.PI);
  if(flash>0){const rg=g.createRadialGradient(tipX,tipY,0,tipX,tipY,240);
    rg.addColorStop(0,'rgba(255,238,236,'+(0.55*flash)+')');rg.addColorStop(1,'rgba(255,238,236,0)');
    g.fillStyle=rg;g.beginPath();g.arc(tipX,tipY,240,0,6.28);g.fill();}

  // upside projection arrow toward BSL (flowing, glowing)
  const prj=ss(15.2,16.2,t)*(1-ss(18.4,19.2,t));
  if(prj>0){const x=xi(CONFIRM)+slotW*0.9, y0=py(C[CONFIRM][3]), y1=py(BSL), yt=lerp(y0,y1,eOut(prj));
    g.save();g.globalAlpha=prj;g.setLineDash([12,10]);g.lineDashOffset=-t*40;
    g.strokeStyle='rgba(233,196,106,.96)';g.lineWidth=3.4;g.shadowColor='#E9C46A';g.shadowBlur=16;
    g.beginPath();g.moveTo(x,y0);g.lineTo(x,yt);g.stroke();g.setLineDash([]);
    const ps=1+0.15*Math.sin(t*8);g.fillStyle='rgba(255,236,190,.98)';
    g.beginPath();g.moveTo(x,yt-3);g.lineTo(x-10*ps,yt+16);g.lineTo(x+10*ps,yt+16);g.closePath();g.fill();g.restore();}

  g.restore();

  // vignette pulse (screen space) at impact
  const vig=Math.sin(clamp((t-11.4)/0.55,0,1)*Math.PI);
  if(vig>0){const rg=g.createRadialGradient(W/2,H*0.55,300,W/2,H*0.55,1100);
    rg.addColorStop(0,'rgba(0,0,0,0)');rg.addColorStop(1,'rgba(90,10,12,'+(0.26*vig)+')');
    g.fillStyle=rg;g.fillRect(0,0,W,H);}

  drawOverlays(t);
}

const $=id=>document.getElementById(id);
function set(el,o,ty,sc){el.style.opacity=o;el.style.transform=`translateY(${ty||0}px) scale(${sc||1})`;}
function drawOverlays(t){
  const hk=ss(0.15,0.6,t)*(1-ss(1.5,1.9,t));
  $('hook').innerHTML='وين تختبئ <em>السيولة؟</em>'; set($('hook'),hk,lerp(24,0,ss(0.15,0.7,t)),lerp(1.06,1,ss(0.15,0.7,t)));
  $('sub').textContent='الإعداد اللي يفوت أغلب المتداولين'; set($('sub'),ss(0.5,0.9,t)*(1-ss(1.5,1.9,t)),0,1);
  // tasteful definition cutaway (1.7 - 2.9)
