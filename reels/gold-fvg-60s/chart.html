<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="brand/fonts.css">
<style>
html,body{margin:0;background:#F5EEE5}
canvas{display:block;width:540px;height:960px}
</style></head>
<body><canvas id="c"></canvas>
<img id="bg" src="brand/bg-05-bull-bear.jpg" style="display:none">
<img id="logo" src="brand/liquidity-state-logo.png" style="display:none">
<img id="prof" src="brand/fahad-profile-circle.png" style="display:none">
<script>
// liquidity.state palette (liquidity-visual-identity) — no colours outside it
const P = {
  shine: '#FCF9F3', ivory: '#F5EEE5', marble: '#E4DED8', marble2: '#DDDCD9', sky: '#CFD6D7',
  silver1: '#BFC0BC', silver2: '#A7A6A2', silver3: '#908F88', silver4: '#777771',
  water1: '#A9D0D1', water2: '#5EA8A9', water3: '#3F8182', water4: '#2B6567', water5: '#1D4D4F', ink: '#133538',
  glow1: '#6FD3D2', glow2: '#33B7B7', teal: '#189EA0', glow4: '#177F82',
  gold1: '#DFC4A9', gold2: '#D3AE89', gold: '#BF9367', copper: '#855E38',
  stone1: '#164245', petrol: '#11282A', stone3: '#0C1414'
};
const rgba = (hex, a) => { const n = parseInt(hex.slice(1), 16); return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`; };
const W = 540, H = 960, DPR = 2, FPS = 60, BEAT = 30;        // 120 bpm reel tempo
const C = { bull: P.teal, bear: P.gold, grid: rgba(P.silver3, 0.16), text: P.silver4 };
const UI = "'Thmanyah Sans', sans-serif", AR = "'Thmanyah Display', sans-serif";

// layout (CSS px, x2 = output px). nothing important below y=768 (bottom 20%).
const CARD = { x: 10, y: 204, w: 520, h: 532, r: 20 };
const TOOL_H = 30, TAXIS_H = 24, SCALE_W = 56;
const PANE = { x: CARD.x, y: CARD.y + TOOL_H, w: CARD.w - SCALE_W, h: CARD.h - TOOL_H - TAXIS_H };
const SCALE_X = PANE.x + PANE.w, TAXIS_Y = PANE.y + PANE.h;
const SLOTS = 15, RIGHT_OFFSET = 2, SLOT = PANE.w / SLOTS, BODY = SLOT * 0.76;   // body ≈ 46 output px
const LEGEND_H = 44;                      // legend strip at the pane top kept free of candles
const PLOT = { y: PANE.y + LEGEND_H, h: PANE.h - LEGEND_H - 8 };

// motion-bible curves
const bez = (x1, y1, x2, y2) => t => {
  if (t <= 0) return 0; if (t >= 1) return 1;
  let u = t; for (let i = 0; i < 8; i++) {
    const x = 3 * x1 * u * (1 - u) ** 2 + 3 * x2 * u * u * (1 - u) + u ** 3 - t;
    const dx = 3 * x1 * (1 - u) ** 2 + 6 * (x2 - x1) * u * (1 - u) + 3 * (1 - x2) * u * u;
    if (Math.abs(dx) < 1e-6) break; u -= x / dx; u = Math.min(1, Math.max(0, u));
  }
  return 3 * y1 * u * (1 - u) ** 2 + 3 * y2 * u * u * (1 - u) + u ** 3;
};
const LS_OUT = bez(0.16, 1, 0.3, 1), LS_SNAP = bez(0.87, 0, 0.13, 1), LS_IN = bez(0.7, 0, 0.84, 0),
  LS_OVER = bez(0.34, 1.56, 0.64, 1), LS_COUNT = bez(0.22, 1, 0.36, 1);
const LS_SPRING = t => { if (t <= 0) return 0; if (t >= 1) return 1; return 1 - Math.exp(-6 * t) * Math.cos(9 * t); };
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const prog = (f, a, d) => clamp((f - a) / d, 0, 1);

const cv = document.getElementById('c'); cv.width = W * DPR; cv.height = H * DPR;
const ctx = cv.getContext('2d');
const img = id => document.getElementById(id);

let D, bars, N, tr, ix, S, T, EV;

// ---------- intrabar path: bull o->l->h->c, bear o->h->l->c ----------
function pathOf(b) {
  const pts = b.c >= b.o ? [b.o, b.l, b.h, b.c] : [b.o, b.h, b.l, b.c];
  const seg = [0, 1, 2].map(i => Math.abs(pts[i + 1] - pts[i])); const tot = seg.reduce((a, x) => a + x, 0) || 1;
  return {
    at(p) {
      let dist = p * tot, price = pts[0], hi = pts[0], lo = pts[0];
      for (let i = 0; i < 3; i++) {
        const take = Math.min(dist, seg[i]), end = pts[i] + Math.sign(pts[i + 1] - pts[i]) * take;
        hi = Math.max(hi, pts[i], end); lo = Math.min(lo, pts[i], end); price = end; dist -= take; if (dist <= 0) break;
      }
      return { o: b.o, h: hi, l: lo, c: price };
    },
    cross(level) {           // first fraction of the bar path that touches level
      let acc = 0;
      for (let i = 0; i < 3; i++) {
        const a = pts[i], z = pts[i + 1];
        if ((level - a) * (level - z) <= 0 && a !== z) return (acc + Math.abs(level - a)) / tot;
        acc += seg[i];
      }
      return 1;
    }
  };
}

// ---------- timeline ----------
function init(data) {
  D = data; bars = D.bars.map(b => ({ t: b[0], o: b[1], h: b[2], l: b[3], c: b[4] })); N = bars.length; tr = D.trade;
  const times = bars.map(b => b.t); ix = t => { const i = times.indexOf(t); if (i < 0) throw Error('time ' + t); return i; };
  const A = D.analysis, long = tr.side === 'long';
  const sweepI = ix(A.sweep.time), bosI = ix(A.bos.time), fvgC1 = ix(A.fvg.c1), fvgC3 = ix(A.fvg.c3),
    entryI = ix(tr.entryTime), tpI = ix(tr.tpTime), liqI = ix(A.sweep.levelTime), bosLvlI = ix(A.bos.levelTime);
  const ctxN = Math.max(liqI + 2, sweepI - 2);
  S = {}; EV = {}; let f = 0;
  const snap = () => { f = Math.ceil(f / BEAT) * BEAT; };
  // 1) reveal: context candles one by one, last 3 at double duration (reveal / draw5)
  for (let i = 0; i < ctxN; i++) { const d = i >= ctxN - 3 ? 8 : 4; S[i] = [f, d]; f += d; }
  snap(); EV.liq = f; f += 90;                         // liquidity level marked (markup)
  const base = D.motion?.barFrames || 22;
  const replay = (from, to, slowLast = 0) => { for (let i = from; i <= to; i++) { const d = i > to - slowLast ? base * 2 : base; S[i] = [f, d]; f += d; } };
  // 2) to the sweep — sweep candle completes on a beat, then punch
  replay(ctxN, sweepI - 1); snap(); S[sweepI] = [f, base * 2]; f += base * 2; snap();
  EV.sweep = f; f += 42 + 48;                           // punch 6+16+20, then read
  EV.bosLine = f; f += 60;                              // structure level that must break
  replay(sweepI + 1, bosI - 1); snap(); S[bosI] = [f, base * 2]; f += base * 2; snap();
  EV.bos = f; f += 42 + 48;
  if (fvgC3 > bosI) { replay(bosI + 1, fvgC3); snap(); }
  EV.fvg = f; f += 120;                                 // FVG box drawn + explained
  EV.pos = f; f += 40 + 110;                            // position tool (hero) as the limit plan
  replay(Math.max(bosI, fvgC3) + 1, entryI - 1);
  const ep = pathOf(bars[entryI]).cross(tr.entry);
  S[entryI] = [f, base * 2]; EV.fill = f + ep * base * 2; f += base * 2;
  EV.ride = f;
  replay(entryI + 1, tpI - 1, 3);
  const tp = pathOf(bars[tpI]).cross(tr.target), dTp = base * 3;
  const hit = Math.ceil((f + tp * dTp) / BEAT) * BEAT; S[tpI] = [hit - tp * dTp, dTp]; EV.tp = hit;
  f = hit + 42 + 60; snap();
  EV.result = f; f += 300;
  EV.outro = f; f += 210;
  for (let i = tpI + 1; i < N; i++) S[i] = [Infinity, 1];
  T = { total: f, ctxN, sweepI, bosI, fvgC1, fvgC3, entryI, tpI, liqI, bosLvlI, long, ...EV };
  return T;
}

// ---------- state at frame f ----------
function visibleBars(f) {
  const out = [];
  for (let i = 0; i < N; i++) {
    const [s, d] = S[i]; if (f < s) break;
    const p = clamp((f - s) / d, 0, 1);
    out.push({ i, ...(p >= 1 ? bars[i] : pathOf(bars[i]).at(p)), p, grow: LS_OUT(clamp((f - s) / 8, 0, 1)) });
  }
  return out;
}
// camera: continuous left index following the newest bar (time flows left→right)
function camLeft(f, vis) {
  const last = vis.length ? vis[vis.length - 1] : { i: 0, p: 0 };
  const lead = last.i + (last.p ?? 1);
  return Math.max(0, lead - (SLOTS - RIGHT_OFFSET));
}
let L0, yLo, yHi;
const xOf = i => PANE.x + (i - L0 + 0.5) * SLOT;
const yOf = p => PLOT.y + (yHi - p) / (yHi - yLo) * PLOT.h;
function range(f, vis) {
  const inView = vis.filter(b => b.i >= Math.floor(L0) - 1 && b.i <= L0 + SLOTS);
  let lo = Math.min(...inView.map(b => b.l)), hi = Math.max(...inView.map(b => b.h));
  const k = LS_OUT(prog(f, T.pos, 40));                    // the plan's levels join the fit with the tool
  if (k > 0) { lo = Math.min(lo, lo + (Math.min(tr.stop, tr.target) - lo) * k); hi = Math.max(hi, hi + (Math.max(tr.stop, tr.target) - hi) * k); }
  if (f >= T.liq) { const lv = D.analysis.sweep.level; lo = Math.min(lo, lv); hi = Math.max(hi, lv); }
  const span = hi - lo; return [lo - span * 0.06, hi + span * 0.06];
}
// smoothed range: average a short window of past frames (auto-fit eases ~250ms like TradingView)
function smoothRange(f) {
  let a = 0, b = 0, n = 0;
  for (let k = 0; k <= 14; k += 2) { const g = Math.max(0, f - k); const v = visibleBars(g); L0 = camLeft(g, v); const [x, y] = range(g, v); a += x; b += y; n++; }
  return [a / n, b / n];
}

// ---------- drawing helpers ----------
function txt(s, x, y, { font = `500 11px ${UI}`, color = C.text, align = 'left', base = 'middle', dir = 'ltr', alpha = 1 } = {}) {
  ctx.save(); ctx.globalAlpha *= alpha; ctx.font = font; ctx.fillStyle = color; ctx.textAlign = align; ctx.textBaseline = base; ctx.direction = dir;
  ctx.fillText(s, x, y); ctx.restore();
}
function measure(s, font) { ctx.save(); ctx.font = font; const w = ctx.measureText(s).width; ctx.restore(); return w; }
function rr(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }
function pill(s, y, bg) {
  ctx.save(); ctx.fillStyle = bg; ctx.fillRect(SCALE_X + 1, y - 9, SCALE_W - 2, 18);
  ctx.font = `700 11px ${UI}`; ctx.fillStyle = P.shine; ctx.textBaseline = 'middle'; ctx.fillText(s, SCALE_X + 5, y + 0.5); ctx.restore();
}

// text placement: words never touch a candle — 12 output px (6 css) clearance from candles, boxes and other words
let OBST = [];
const hitRect = (a, b, m) => a.x < b.x + b.w + m && a.x + a.w + m > b.x && a.y < b.y + b.h + m && a.y + a.h + m > b.y;
function place(s, font, cands, { dir = 'ltr' } = {}) {
  const w = measure(s, font), h = parseFloat(font.match(/(\d+)px/)[1]) * 1.15;
  for (const [cx, cy, al] of cands) {
    const x = al === 'left' ? cx : al === 'right' ? cx - w : cx - w / 2;
    const r = { x, y: cy - h / 2, w, h };
    if (r.x < PANE.x + 4 || r.x + r.w > PANE.x + PANE.w - 4 || r.y < PLOT.y || r.y + r.h > PANE.y + PANE.h - 2) continue;
    if (OBST.some(o => hitRect(r, o, 6))) continue;
    OBST.push(r); return { x: r.x, y: cy, w, h, ok: true };
  }
  return null;
}
function wordAt(pl, s, font, color, alpha, drop = 0) {
  if (!pl) return;
  txt(s, pl.x, pl.y - drop, { font, color, alpha });
}

// ---------- scene pieces ----------
const CAPS = () => [
  [0, ...D.captions.hook],
  [T.liq, ...D.captions.liq],
  [T.sweep, ...D.captions.sweep],
  [T.bosLine, ...D.captions.bosLine],
  [T.bos, ...D.captions.bos],
  [T.fvg, ...D.captions.fvg],
  [T.pos, ...D.captions.pos],
  [T.ride, ...D.captions.ride],
  [T.tp, ...D.captions.tp],
  [T.result, ...D.captions.result],
  [T.outro, ...D.captions.outro]
];

function drawBackground() {
  const bg = img('bg'), s = H / bg.naturalHeight, w = bg.naturalWidth * s;
  ctx.drawImage(bg, (W - w) / 2, 0, w, H);
  const g = ctx.createLinearGradient(0, 0, 0, 210);
  g.addColorStop(0, rgba(P.ivory, 0.9)); g.addColorStop(1, rgba(P.ivory, 0.45));
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, 210);
}
function drawGlassCard() {
  const bg = img('bg'), s = H / bg.naturalHeight, w = bg.naturalWidth * s;
  ctx.save(); ctx.shadowColor = rgba(P.silver3, 0.3); ctx.shadowBlur = 22; ctx.shadowOffsetY = 8;
  rr(CARD.x, CARD.y, CARD.w, CARD.h, CARD.r); ctx.fillStyle = rgba(P.ivory, 0.92); ctx.fill(); ctx.restore();
  ctx.save(); rr(CARD.x, CARD.y, CARD.w, CARD.h, CARD.r); ctx.clip();
  ctx.filter = 'blur(6px)'; ctx.drawImage(bg, (W - w) / 2, 0, w, H); ctx.filter = 'none';
  ctx.fillStyle = rgba(P.ivory, 0.9); ctx.fillRect(CARD.x, CARD.y, CARD.w, CARD.h); ctx.restore();
  ctx.save(); ctx.strokeStyle = rgba(P.shine, 0.95); ctx.lineWidth = 1.5;
  rr(CARD.x + .75, CARD.y + .75, CARD.w - 1.5, CARD.h - 1.5, CARD.r); ctx.stroke(); ctx.restore();
}

function caption(f) {
  const cs = CAPS(); let cur = 0; cs.forEach((c, i) => { if (f >= c[0]) cur = i; });
  const [start, l1, l2] = cs[cur], next = cs[cur + 1]?.[0] ?? Infinity;
  const inA = LS_OUT(prog(f, start, 14)), outA = 1 - LS_IN(prog(f, next - 9, 9));   // exit = 2/3 of entry
  const lg = img('logo'), lh = 24, lw = lg.naturalWidth / lg.naturalHeight * lh;
  ctx.drawImage(lg, (W - lw) / 2, 18, lw, lh);
  const steps = cs.length;
  for (let i = 0; i < steps; i++) { ctx.fillStyle = i <= cur ? P.water5 : P.silver1; ctx.fillRect(W / 2 - steps * 11 + i * 22 + 2, 52, 18, 3); }
  const isResult = start === T.result, isTp = start === T.tp;
  ctx.save(); ctx.globalAlpha = inA * outA;
  // Arabic reveals from the right (reading direction)
  const reveal = (s, y, font, color, delay) => {
    const a = LS_OUT(prog(f, start + delay, 16)); const w = measure(s, font) + 20;
    ctx.save(); ctx.beginPath(); ctx.rect(W / 2 + w / 2 - w * a, y - 30, w * a, 60); ctx.clip();
    txt(s, W / 2, y + (1 - a) * 6, { font, color, align: 'center', dir: 'rtl' }); ctx.restore();
  };
  if (isResult) {
    // result: the R multiple lands with a hard punch (punch / cam14)
    const R = Math.abs(tr.target - tr.entry) / Math.abs(tr.entry - tr.stop);
    const pz = punchScale(f, T.result + 12, 1.4);
    reveal(l1, 96, `900 30px ${AR}`, P.ink, 0);
    ctx.save(); ctx.translate(W / 2, 156); ctx.scale(pz, pz);
    txt(`+${R.toFixed(0)}R`, 0, 0, { font: `900 50px ${UI}`, color: P.copper, align: 'center', alpha: LS_OUT(prog(f, T.result + 12, 6)) });
    ctx.restore();
  } else {
    const l1y = l2 ? 98 : 120;
    reveal(l1, l1y, `900 30px ${AR}`, P.ink, 0);
    if (l2) reveal(l2, 148, `900 23px ${AR}`, isTp ? P.copper : P.water5, 6);
  }
  ctx.restore();
}

// punch: 6 in (LS-Out) + 16 hold + 20 back (LS-Spring), always on a beat
function punchScale(f, at, peak) {
  if (f < at || f > at + 42) return 1;
  const k = f - at;
  if (k < 6) return 1 + (peak - 1) * LS_OUT(k / 6);
  if (k < 22) return peak;
  return peak - (peak - 1) * LS_SPRING((k - 22) / 20);
}

function render(f) {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.fillStyle = P.ivory; ctx.fillRect(0, 0, W, H);
  drawBackground();

  const vis = visibleBars(f);
  [yLo, yHi] = smoothRange(f);
  L0 = camLeft(f, vis);
  const last = vis[vis.length - 1];

  // punches on the chart: sweep, BOS, TP (centre = the real candle)
  let pz = 1, pcx = W / 2, pcy = H / 2;
  for (const [at, i, peak, price] of [[T.sweep, T.sweepI, 1.2, T.long ? bars[T.sweepI].l : bars[T.sweepI].h],
                                      [T.bos, T.bosI, 1.2, bars[T.bosI].c], [T.tp, T.tpI, 1.4, tr.target]]) {
    const s = punchScale(f, at, peak); if (s !== 1) { pz = s; pcx = xOf(i); pcy = yOf(price); }
  }
  ctx.save();
  ctx.beginPath(); ctx.rect(0, CARD.y - 4, W, CARD.h + 8); ctx.clip();
  ctx.translate(pcx, pcy); ctx.scale(pz, pz); ctx.translate(-pcx, -pcy);
  const chartA = LS_OUT(prog(f, 0, 18));
  ctx.globalAlpha = chartA;
  drawGlassCard();

  // toolbar
  const tY = CARD.y + TOOL_H / 2 + 1;
  txt(D.symbol, CARD.x + 16, tY, { font: `700 13px ${UI}`, color: P.ink });
  txt(`${D.timeframe}m`, CARD.x + 16 + measure(D.symbol, `700 13px ${UI}`) + 8, tY, { font: `500 13px ${UI}`, color: P.ink });
  txt('Replay', CARD.x + 120, tY, { font: `700 13px ${UI}`, color: P.water5 });
  ctx.fillStyle = P.silver1; ctx.fillRect(CARD.x + 110, CARD.y + 9, 1, 13);
  txt(D.date + '  ·  UTC+3', CARD.x + CARD.w - 16, tY, { font: `500 11px ${UI}`, color: P.silver4, align: 'right' });
  ctx.fillStyle = P.silver1; ctx.fillRect(CARD.x, CARD.y + TOOL_H - 1, CARD.w, 1);

  // grid + price scale
  const span = yHi - yLo; let step = 50; for (const s of [0.5, 1, 2, 2.5, 5, 10, 20, 25]) if (span / s <= 9) { step = s; break; }
  ctx.save(); ctx.beginPath(); ctx.rect(PANE.x, PANE.y, CARD.w, PANE.h); ctx.clip();
  for (let p = Math.ceil(yLo / step) * step; p <= yHi; p += step) {
    const y = Math.round(yOf(p) * 2) / 2;
    if (y < PLOT.y - 4) continue;
    ctx.fillStyle = C.grid; ctx.fillRect(PANE.x, y - 0.25, PANE.w, 0.5);
    txt(p.toFixed(2), SCALE_X + 6, y, { font: `500 10.5px ${UI}` });
  }
  ctx.restore();
  ctx.save(); ctx.beginPath(); ctx.rect(PANE.x, TAXIS_Y, PANE.w, TAXIS_H); ctx.clip();
  bars.forEach((b, i) => {
    const mm = +b.t.slice(3), hh = +b.t.slice(0, 2);
    if (mm === 0 && hh % 1 === 0) {
      const x = xOf(i); if (x < PANE.x - 20 || x > PANE.x + PANE.w + 20) return;
      txt(b.t, x, TAXIS_Y + TAXIS_H / 2, { font: `500 10.5px ${UI}`, align: 'center' });
    }
  });
  ctx.restore();
  ctx.fillStyle = P.silver1; ctx.fillRect(SCALE_X, PANE.y, 1, PANE.h + TAXIS_H); ctx.fillRect(CARD.x, TAXIS_Y, CARD.w, 1);

  // pane content (clipped)
  ctx.save(); ctx.beginPath(); ctx.rect(PANE.x, PANE.y, PANE.w, PANE.h); ctx.clip();
  OBST = [];
  // candle rectangles are obstacles for every word
  for (const b of vis) {
    const x = xOf(b.i); if (x < PANE.x - SLOT || x > PANE.x + PANE.w + SLOT) continue;
    OBST.push({ x: x - BODY / 2, y: yOf(b.h), w: BODY, h: Math.max(1, yOf(b.l) - yOf(b.h)) });
  }
  // legend strip is reserved
  OBST.push({ x: PANE.x, y: PANE.y, w: PANE.w, h: LEGEND_H - 6 });
  const words = [];
  const A = D.analysis;

  // swept liquidity level: horizontal ray from the real swing (TradingView Horizontal Ray)
  const liqA = LS_OUT(prog(f, T.liq, 24));
  if (liqA > 0) {
    const y = Math.round(yOf(A.sweep.level) * 2) / 2, x0 = xOf(T.liqI);
    const x1 = x0 + (PANE.x + PANE.w - x0) * liqA;
    ctx.save(); ctx.strokeStyle = P.gold; ctx.lineWidth = 1.25; ctx.setLineDash([5, 3]);
    ctx.beginPath(); ctx.moveTo(x0, y); ctx.lineTo(x1, y); ctx.stroke(); ctx.restore();
    const above = !T.long;            // sell-side liquidity sits under lows, buy-side over highs
    const s = T.long ? 'Sell-side Liquidity' : 'Buy-side Liquidity';
    words.push([s, `700 11px ${UI}`, P.copper, prog(f, T.liq + 8, 16),
      [[x0 + 4, y + (above ? -12 : 12), 'left'], [x0 + 4, y + (above ? 12 : -12), 'left'], [PANE.x + PANE.w - 6, y + (above ? -12 : 12), 'right'], [PANE.x + PANE.w - 6, y + (above ? 12 : -12), 'right']]]);
  }
  // structure level that breaks (BOS)
  const bosA = LS_OUT(prog(f, T.bosLine, 24));
  if (bosA > 0) {
    const y = Math.round(yOf(A.bos.level) * 2) / 2, x0 = xOf(T.bosLvlI);
    const endX = f >= T.bos ? xOf(T.bosI) : PANE.x + PANE.w;
    const x1 = x0 + (endX - x0) * bosA;
    ctx.fillStyle = P.water5; ctx.fillRect(x0, y - 0.6, x1 - x0, 1.2);
    if (f >= T.bos) {
      const a = LS_OUT(prog(f, T.bos, 12)), mid = (x0 + xOf(T.bosI)) / 2;
      const up = T.long;
      words.push(['BOS', `900 13px ${UI}`, P.water5, a,
        [[mid, y + (up ? -11 : 11), 'center'], [mid, y + (up ? 11 : -11), 'center'], [xOf(T.bosI) + SLOT, y, 'left'], [x0 - 4, y, 'right']]]);
    }
  }
  // sweep marker word
  if (f >= T.sweep) {
    const b = bars[T.sweepI], x = xOf(T.sweepI), py = T.long ? yOf(b.l) : yOf(b.h);
    words.push(['Sweep', `900 12px ${UI}`, P.copper, LS_OUT(prog(f, T.sweep + 6, 12)),
      [[x, py + (T.long ? 14 : -14), 'center'], [x, py + (T.long ? 28 : -28), 'center'], [x + SLOT * 0.8, py, 'left'], [x - SLOT * 0.8, py, 'right']]]);
  }
  // FVG: TradingView rectangle from candle 1, extended right; draws left→right, overshoot 4% then settles
  const fA = prog(f, T.fvg, 24);
  if (fA > 0) {
    const x0 = xOf(T.fvgC1) - SLOT / 2, xEnd = PANE.x + PANE.w;
    const k = LS_OVER(fA), x1 = x0 + (xEnd - x0) * Math.min(k, 1.04);
    const y0 = yOf(A.fvg.top), y1 = yOf(A.fvg.bottom);
    ctx.fillStyle = rgba(P.water2, 0.2); ctx.fillRect(x0, y0, x1 - x0, y1 - y0);
    ctx.strokeStyle = P.water2; ctx.lineWidth = 1.5; ctx.strokeRect(x0, y0, x1 - x0, y1 - y0);
    OBST.push({ x: x0, y: y0, w: x1 - x0, h: y1 - y0 });
    words.push(['FVG', `900 13px ${UI}`, P.water5, LS_OUT(prog(f, T.fvg + 8, 16)),
      [[xOf(T.fvgC3) + SLOT * 0.7, (y0 + y1) / 2, 'left'], [xOf(T.fvgC3) + SLOT * 1.7, (y0 + y1) / 2, 'left'],
       [x0 + 6, y0 - 11, 'left'], [x0 + 6, y1 + 11, 'left'], [xOf(T.fvgC3) + SLOT * 0.7, y0 - 11, 'left'], [xOf(T.fvgC3) + SLOT * 0.7, y1 + 11, 'left']]]);
  }
  // position tool: stop zone first (bronze), target grows after +8f at double length, R counts
  const posA = f - T.pos;
  if (posA > 0) {
    const x0 = xOf(T.entryI) - SLOT / 2 - SLOT * 2, xR = PANE.x + PANE.w;   // placed like a limit plan, two bars before the fill
    const ye = yOf(tr.entry), ys0 = yOf(tr.stop), yt0 = yOf(tr.target);
    const sk = LS_OUT(prog(f, T.pos, 14)), tk = LS_OUT(prog(f, T.pos + 22, 28));
    const ys = ye + (ys0 - ye) * sk, yt = ye + (yt0 - ye) * tk;
    const hit = f >= T.tp, pulse = hit ? Math.sin(Math.PI * prog(f, T.tp, 24)) : 0;
    ctx.fillStyle = rgba(P.gold, 0.2); ctx.fillRect(x0, Math.min(ye, ys), xR - x0, Math.abs(ys - ye));
    ctx.fillStyle = rgba(P.teal, 0.2 + 0.15 * pulse); ctx.fillRect(x0, Math.min(ye, yt), xR - x0, Math.abs(yt - ye));
    ctx.fillStyle = P.gold; ctx.fillRect(x0, ys - 0.5, xR - x0, 1);
    ctx.fillStyle = P.teal; ctx.fillRect(x0, yt - 0.5, xR - x0, 1);
    ctx.fillStyle = P.silver3; ctx.fillRect(x0, ye - 0.5, xR - x0, 1);
    const R = Math.abs(tr.target - tr.entry) / Math.abs(tr.entry - tr.stop);
    const rNow = R * LS_COUNT(prog(f, T.pos + 22, 40));
    const fmt = v => v.toFixed(2);
    const tPts = Math.abs(tr.target - tr.entry), sPts = Math.abs(tr.entry - tr.stop);
    const la = prog(f, T.pos + 10, 16);
    const st = f >= T.tp ? `Closed P&L: ${fmt(tPts)}` : f >= T.fill ? `Open P&L: ${fmt((last.c - tr.entry) * (T.long ? 1 : -1))}` : 'Limit order';
    const tgtLbl = `Target: ${fmt(tPts)} (${(100 * tPts / tr.entry).toFixed(2)}%)`;
    const stpLbl = `Stop: ${fmt(sPts)} (${(100 * sPts / tr.entry).toFixed(2)}%)`;
    const rrLbl = `R/R ${rNow >= R - 0.005 ? R.toFixed(0) : rNow.toFixed(2)}  ·  ${st}`;
    const far = (y, dir) => y + dir * 11;
    const tdir = yt < ye ? -1 : 1, sdir = ys > ye ? 1 : -1;
    words.push([tgtLbl, `700 10.5px ${UI}`, P.water5, la, [[xR - 6, far(yt, tdir), 'right'], [xR - 6, far(yt, -tdir), 'right'], [x0 + 6, far(yt, -tdir), 'left'], [x0 + 6, far(yt, tdir), 'left']]]);
    words.push([stpLbl, `700 10.5px ${UI}`, P.copper, la, [[xR - 6, far(ys, sdir), 'right'], [xR - 6, far(ys, -sdir), 'right'], [x0 + 6, far(ys, sdir), 'left'], [x0 + 6, far(ys, -sdir), 'left']]]);
    const midT = (ye + yt) / 2;
    words.push([rrLbl, `700 10.5px ${UI}`, hit ? P.water5 : P.ink, la, [[xR - 6, midT, 'right'], [xR - 6, far(ye, tdir), 'right'], [xR - 6, far(ye, -tdir) , 'right'], [x0 + 6, far(ye, tdir), 'left'], [(x0 + xR) / 2, midT, 'center'], [xR - 6, (midT + yt) / 2, 'right']]]);
    if (f >= T.fill) {
      const ex = xOf(T.entryI), a = LS_OUT(prog(f, T.fill, 10));
      ctx.save(); ctx.globalAlpha *= a; ctx.fillStyle = P.ink;
      const ty = ye; ctx.beginPath();
      if (T.long) { ctx.moveTo(ex - BODY / 2 - 9, ty); ctx.lineTo(ex - BODY / 2 - 3, ty - 4); ctx.lineTo(ex - BODY / 2 - 3, ty + 4); }
      else { ctx.moveTo(ex - BODY / 2 - 9, ty); ctx.lineTo(ex - BODY / 2 - 3, ty - 4); ctx.lineTo(ex - BODY / 2 - 3, ty + 4); }
      ctx.closePath(); ctx.fill(); ctx.restore();
    }
  }
  if (f >= T.tp) words.push(['TP', `900 13px ${UI}`, P.water5, LS_OUT(prog(f, T.tp, 10)),
    [[xOf(T.tpI) - SLOT * 0.8, yOf(tr.target) + (T.long ? 12 : -12), 'right'], [xOf(T.tpI) + SLOT * 0.8, yOf(tr.target) + (T.long ? 12 : -12), 'left'], [xOf(T.tpI) - SLOT, yOf(tr.target) - (T.long ? 12 : -12), 'right']]]);

  // candles — TradingView geometry: sharp solid body, 1 output-px wick dead centre, doji = thin line
  for (const b of vis) {
    const x = xOf(b.i); if (x < PANE.x - SLOT || x > PANE.x + PANE.w + SLOT) continue;
    const ctxCandle = b.i < T.liqI;           // context candles: real colours at 35%
    const col = b.c >= b.o ? C.bull : C.bear;
    ctx.save(); ctx.globalAlpha *= ctxCandle ? 0.35 : 1; ctx.fillStyle = col;
    // grow from the open (vertical scale 0→1 over 8f)
    const g = b.grow, yo = yOf(b.o), Y = p => yo + (yOf(p) - yo) * g;
    const yh = Y(b.h), yl = Y(b.l);
    ctx.fillRect(x - 0.5, yh, 1, Math.max(0.5, yl - yh));
    const yt = Y(Math.max(b.o, b.c)), yb = Y(Math.min(b.o, b.c));
    ctx.fillRect(x - BODY / 2, yt, BODY, Math.max(0.5, yb - yt));
    ctx.restore();
  }

  // words (placed after every obstacle is known; dropped from above 6px and settled)
  for (const [s, font, color, a, cands] of words) {
    if (a <= 0) continue;
    const pl = place(s, font, cands);
    if (!pl) { console.log('NO-SPACE ' + s + ' @' + f); continue; }
    wordAt(pl, s, font, color, a, (1 - LS_OUT(a)) * 6);
  }

  // last price line
  if (last) {
    const lc = last.c >= last.o ? C.bull : C.bear, y = Math.round(yOf(last.c) * 2) / 2;
    ctx.strokeStyle = lc; ctx.lineWidth = 0.75; ctx.setLineDash([2, 2]);
    ctx.beginPath(); ctx.moveTo(PANE.x, y); ctx.lineTo(PANE.x + PANE.w, y); ctx.stroke(); ctx.setLineDash([]);
  }
  ctx.restore();

  // scale pills
  if (posA > 0) {
    ctx.save(); ctx.globalAlpha *= prog(f, T.pos + 8, 14);
    pill(tr.target.toFixed(2), yOf(tr.target), P.teal); pill(tr.stop.toFixed(2), yOf(tr.stop), P.gold); pill(tr.entry.toFixed(2), yOf(tr.entry), P.silver4);
    ctx.restore();
  }
  if (last) pill(last.c.toFixed(2), yOf(last.c), last.c >= last.o ? P.teal : P.gold);

  // legend (OHLC of the newest bar)
  if (last) {
    const lg = PANE.y + 14, oc = last.c >= last.o ? P.water4 : P.copper;
    txt(D.legend, PANE.x + 10, lg, { font: `700 12px ${UI}`, color: P.ink });
    let lx = PANE.x + 10; const ly = lg + 17;
    for (const [k, v] of [['O', last.o], ['H', last.h], ['L', last.l], ['C', last.c]]) {
      txt(k, lx, ly, { font: `500 11px ${UI}`, color: P.ink }); lx += 10;
      txt(v.toFixed(2), lx, ly, { font: `500 11px ${UI}`, color: oc }); lx += 58;
    }
  }
  ctx.restore();   // punch transform + clip

  caption(f);

  // footer (above the bottom 20%): profile capsule + handle, and the disclaimer
  const fy = 744;
  ctx.save(); ctx.fillStyle = rgba(P.ivory, 0.9); rr(14, fy, 160, 30, 15); ctx.fill(); ctx.restore();
  ctx.save(); ctx.beginPath(); ctx.arc(30, fy + 15, 11.5, 0, Math.PI * 2); ctx.clip();
  ctx.drawImage(img('prof'), 18.5, fy + 3.5, 23, 23); ctx.restore();
  ctx.strokeStyle = P.water5; ctx.lineWidth = 1.2; ctx.beginPath(); ctx.arc(30, fy + 15, 11.5, 0, Math.PI * 2); ctx.stroke();
  txt('@liquidity.state', 48, fy + 16, { font: `700 12px ${UI}`, color: P.ink });
  ctx.save(); ctx.fillStyle = rgba(P.ivory, 0.9); rr(W - 170, fy, 156, 30, 15); ctx.fill(); ctx.restore();
  txt('المحتوى تعليمي وليس توصية', W - 92, fy + 16, { font: `500 11px ${UI}`, color: P.silver4, align: 'center', dir: 'rtl' });
}

window.setup = async (data) => {
  await Promise.all(['bg', 'logo', 'prof'].map(id => img(id).decode()));
  await Promise.all(["900 12px 'Thmanyah Display'", "900 12px 'Thmanyah Sans'", "700 12px 'Thmanyah Sans'", "500 12px 'Thmanyah Sans'"]
    .map(f => document.fonts.load(f, 'عربي 0123')));
  return init(data);
};
window.sched = () => Object.values(S).filter(v => isFinite(v[0]));
window.frame = (f, type = 'image/png') => { render(f); return cv.toDataURL(type, 0.95); };
// geometry probe for the validator: candle sizes in OUTPUT px for the bars on screen
window.probe = (f) => {
  render(f);
  const vis = visibleBars(f).filter(b => b.p >= 1);
  const onScreen = vis.filter(b => { const x = xOf(b.i); return x > PANE.x && x < PANE.x + PANE.w; });
  return { L0, yLo, yHi, bodyPx: BODY * DPR, slotPx: SLOT * DPR, n: onScreen.length,
    lens: onScreen.map(b => (yOf(b.l) - yOf(b.h)) * DPR) };
};
