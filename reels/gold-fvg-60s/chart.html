<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="brand/fonts.css">
<style>
html,body{margin:0;background:#F5EEE5}
canvas{display:block;width:540px;height:960px}
</style></head>
<body><canvas id="c"></canvas>
<img id="bg" src="brand/bg-05-bull-bear.jpg" style="display:none">
<img id="logo" src="brand/liquidity-state-logo.png" style="display:none">
<img id="prof" src="brand/fahad-profile-circle.png" style="display:none">
<script>
// liquidity.state palette (liquidity-visual-identity) — no colours outside it
const P = {
  shine: '#FCF9F3', ivory: '#F5EEE5', marble: '#E4DED8', marble2: '#DDDCD9', sky: '#CFD6D7',
  silver1: '#BFC0BC', silver2: '#A7A6A2', silver3: '#908F88', silver4: '#777771',
  water1: '#A9D0D1', water2: '#5EA8A9', water3: '#3F8182', water4: '#2B6567', water5: '#1D4D4F', ink: '#133538',
  glow1: '#6FD3D2', glow2: '#33B7B7', teal: '#189EA0', glow4: '#177F82',
  gold1: '#DFC4A9', gold2: '#D3AE89', gold: '#BF9367', copper: '#855E38',
  stone1: '#164245', petrol: '#11282A', stone3: '#0C1414'
};
const rgba = (hex, a) => { const n = parseInt(hex.slice(1), 16); return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`; };
const W = 540, H = 960, DPR = 2, FPS = 60, BEAT = 30;        // 120 bpm reel tempo
const C = { bull: P.teal, bear: P.gold, grid: rgba(P.silver3, 0.16), text: P.silver4 };
const UI = "'Thmanyah Sans', sans-serif", AR = "'Thmanyah Display', sans-serif";

// layout (CSS px, x2 = output px). nothing important below y=768 (bottom 20%).
const CARD = { x: 10, y: 204, w: 520, h: 532, r: 20 };
const TOOL_H = 30, TAXIS_H = 24, SCALE_W = 56;
const PANE = { x: CARD.x, y: CARD.y + TOOL_H, w: CARD.w - SCALE_W, h: CARD.h - TOOL_H - TAXIS_H };
const SCALE_X = PANE.x + PANE.w, TAXIS_Y = PANE.y + PANE.h;
const SLOTS = 15, RIGHT_OFFSET = 2, SLOT = PANE.w / SLOTS, BODY = SLOT * 0.76;   // body ≈ 46 output px
const LEGEND_H = 44;                      // legend strip at the pane top kept free of candles
const PLOT = { y: PANE.y + LEGEND_H, h: PANE.h - LEGEND_H - 8 };

// motion-bible curves
const bez = (x1, y1, x2, y2) => t => {
  if (t <= 0) return 0; if (t >= 1) return 1;
  let u = t; for (let i = 0; i < 8; i++) {
    const x = 3 * x1 * u * (1 - u) ** 2 + 3 * x2 * u * u * (1 - u) + u ** 3 - t;
    const dx = 3 * x1 * (1 - u) ** 2 + 6 * (x2 - x1) * u * (1 - u) + 3 * (1 - x2) * u * u;
    if (Math.abs(dx) < 1e-6) break; u -= x / dx; u = Math.min(1, Math.max(0, u));
  }
  return 3 * y1 * u * (1 - u) ** 2 + 3 * y2 * u * u * (1 - u) + u ** 3;
};
const LS_OUT = bez(0.16, 1, 0.3, 1), LS_SNAP = bez(0.87, 0, 0.13, 1), LS_IN = bez(0.7, 0, 0.84, 0),
  LS_OVER = bez(0.34, 1.56, 0.64, 1), LS_COUNT = bez(0.22, 1, 0.36, 1);
const LS_SPRING = t => { if (t <= 0) return 0; if (t >= 1) return 1; return 1 - Math.exp(-6 * t) * Math.cos(9 * t); };
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const prog = (f, a, d) => clamp((f - a) / d, 0, 1);

const cv = document.getElementById('c'); cv.width = W * DPR; cv.height = H * DPR;
let ctx = cv.getContext('2d');
const img = id => document.getElementById(id);

let D, bars, N, tr, ix, S, T, EV;

// ---------- intrabar path: bull o->l->h->c, bear o->h->l->c ----------
function pathOf(b) {
  const pts = b.c >= b.o ? [b.o, b.l, b.h, b.c] : [b.o, b.h, b.l, b.c];
  const seg = [0, 1, 2].map(i => Math.abs(pts[i + 1] - pts[i])); const tot = seg.reduce((a, x) => a + x, 0) || 1;
  return {
    at(p) {
      let dist = p * tot, price = pts[0], hi = pts[0], lo = pts[0];
      for (let i = 0; i < 3; i++) {
        const take = Math.min(dist, seg[i]), end = pts[i] + Math.sign(pts[i + 1] - pts[i]) * take;
        hi = Math.max(hi, pts[i], end); lo = Math.min(lo, pts[i], end); price = end; dist -= take; if (dist <= 0) break;
      }
      return { o: b.o, h: hi, l: lo, c: price };
    },
    cross(level) {           // first fraction of the bar path that touches level
      let acc = 0;
      for (let i = 0; i < 3; i++) {
        const a = pts[i], z = pts[i + 1];
        if ((level - a) * (level - z) <= 0 && a !== z) return (acc + Math.abs(level - a)) / tot;
        acc += seg[i];
      }
      return 1;
    }
  };
}

// ---------- timeline ----------
function init(data) {
  D = data; bars = D.bars.map(b => ({ t: b[0], o: b[1], h: b[2], l: b[3], c: b[4] })); N = bars.length; tr = D.trade;
  const times = bars.map(b => b.t); ix = t => { const i = times.indexOf(t); if (i < 0) throw Error('time ' + t); return i; };
  const A = D.analysis, long = tr.side === 'long';
  const sweepI = ix(A.sweep.time), bosI = ix(A.bos.time), fvgC1 = ix(A.fvg.c1), fvgC3 = ix(A.fvg.c3),
    entryI = ix(tr.entryTime), tpI = ix(tr.tpTime), liqI = ix(A.sweep.levelTime), bosLvlI = ix(A.bos.levelTime);
  const ctxN = Math.max(liqI + 2, sweepI - 2);
  S = {}; EV = {}; let f = 0;
  const snap = () => { f = Math.ceil(f / BEAT) * BEAT; };
  // 1) reveal: context candles one by one, last 3 at double duration (reveal / draw5)
  for (let i = 0; i < ctxN; i++) { const d = i >= ctxN - 3 ? 8 : 4; S[i] = [f, d]; f += d; }
  snap(); EV.liq = f; f += 90;                         // liquidity level marked (markup)
  const base = D.motion?.barFrames || 22;
  const replay = (from, to, slowLast = 0) => { for (let i = from; i <= to; i++) { const d = i > to - slowLast ? base * 2 : base; S[i] = [f, d]; f += d; } };
  // 2) to the sweep — sweep candle completes on a beat, then punch
  replay(ctxN, sweepI - 1); snap(); S[sweepI] = [f, base * 2]; f += base * 2; snap();
  EV.sweep = f; f += 42 + 48;                           // punch 6+16+20, then read
  EV.bosLine = f; f += 60;                              // structure level that must break
  replay(sweepI + 1, bosI - 1); snap(); S[bosI] = [f, base * 2]; f += base * 2; snap();
  EV.bos = f; f += 42 + 18; snap();
  if (fvgC3 > bosI) { replay(bosI + 1, fvgC3); snap(); }
  EV.split = f; f += 12 + 30;                           // BOS line glows 12f, frame splits open from it (splitopen / mask9)
  EV.fvg = EV.split + 18; f += 90;                      // FVG box drawn in the new shot
  EV.pos = f; f += 40 + 110;                            // position tool (hero) as the limit plan
  replay(Math.max(bosI, fvgC3) + 1, entryI - 1);
  const ep = pathOf(bars[entryI]).cross(tr.entry);
  S[entryI] = [f, base * 2]; EV.fill = f + ep * base * 2; f += base * 2;
  EV.ride = f;
  replay(entryI + 1, tpI - 1, 3);
  const tp = pathOf(bars[tpI]).cross(tr.target), dTp = base * 3;
  const hit = Math.ceil((f + tp * dTp) / BEAT) * BEAT; S[tpI] = [hit - tp * dTp, dTp]; EV.tp = hit;
  f = hit + 42 + 60; snap();
  EV.dip = f; f += 28;                                  // dip to petrol with a question in the dark (dip / flash5)
  EV.result = EV.dip + 18; f = EV.result + 290;
  EV.outro = f; f += 210;
  for (let i = tpI + 1; i < N; i++) S[i] = [Infinity, 1];
  T = { total: f, ctxN, sweepI, bosI, fvgC1, fvgC3, entryI, tpI, liqI, bosLvlI, long, ...EV };
  return T;
}


// ---------- state at frame f ----------
function visibleBars(f) {
  const out = [];
  for (let i = 0; i < N; i++) {
    const [s, d] = S[i]; if (f < s) break;
    const p = clamp((f - s) / d, 0, 1);
    out.push({ i, ...(p >= 1 ? bars[i] : pathOf(bars[i]).at(p)), p, grow: LS_OUT(clamp((f - s) / 8, 0, 1)) });
  }
  return out;
}
// replay pan: continuous left index following the newest bar (time flows left→right)
function camLeft(f, vis) {
  const last = vis.length ? vis[vis.length - 1] : { i: 0, p: 0 };
  return Math.max(0, last.i + (last.p ?? 1) - (SLOTS - RIGHT_OFFSET));
}
let L0, yLo, yHi, VIS, LAST;
const xOf = i => PANE.x + (i - L0 + 0.5) * SLOT;
const yOf = p => PLOT.y + (yHi - p) / (yHi - yLo) * PLOT.h;
function range(f, vis) {
  const inView = vis.filter(b => b.i >= Math.floor(L0) - 1 && b.i <= L0 + SLOTS);
  let lo = Math.min(...inView.map(b => b.l)), hi = Math.max(...inView.map(b => b.h));
  const k = LS_OUT(prog(f, T.pos, 40));
  if (k > 0) { lo = Math.min(lo, lo + (Math.min(tr.stop, tr.target) - lo) * k); hi = Math.max(hi, hi + (Math.max(tr.stop, tr.target) - hi) * k); }
  if (f >= T.liq && f < T.pos) { const lv = D.analysis.sweep.level; lo = Math.min(lo, lv); hi = Math.max(hi, lv); }
  const span = hi - lo; return [lo - span * 0.08, hi + span * 0.08];
}
function smoothRange(f) {        // TradingView-like auto-fit easing (~250ms)
  let a = 0, b = 0, n = 0;
  for (let k = 0; k <= 14; k += 2) { const g = Math.max(0, f - k); const v = visibleBars(g); L0 = camLeft(g, v); const [x, y] = range(g, v); a += x; b += y; n++; }
  return [a / n, b / n];
}
function state(f) { VIS = visibleBars(f); [yLo, yHi] = smoothRange(f); L0 = camLeft(f, VIS); LAST = VIS[VIS.length - 1]; }

// ---------- drawing helpers ----------
function txt(s, x, y, { font = `500 11px ${UI}`, color = C.text, align = 'left', base = 'middle', dir = 'ltr', alpha = 1 } = {}) {
  ctx.save(); ctx.globalAlpha *= alpha; ctx.font = font; ctx.fillStyle = color; ctx.textAlign = align; ctx.textBaseline = base; ctx.direction = dir;
  ctx.fillText(s, x, y); ctx.restore();
}
function measure(s, font) { ctx.save(); ctx.font = font; const w = ctx.measureText(s).width; ctx.restore(); return w; }
function rr(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }
function pill(s, y, bg) {
  ctx.save(); ctx.fillStyle = bg; ctx.fillRect(SCALE_X + 1, y - 9, SCALE_W - 2, 18);
  ctx.font = `700 11px ${UI}`; ctx.fillStyle = P.shine; ctx.textBaseline = 'middle'; ctx.fillText(s, SCALE_X + 5, y + 0.5); ctx.restore();
}
// TradingView drawing-tool text: one colour, regular weight, no frame, no halo
const MK = '#000000', MKF = `400 12px 'TV Trebuchet','TV Segoe', sans-serif`;
let OBST = [];
const hitRect = (a, b, m) => a.x < b.x + b.w + m && a.x + a.w + m > b.x && a.y < b.y + b.h + m && a.y + a.h + m > b.y;
const CLEAR = 6;                               // 12 output px from candles, boxes and other words
function freeRect(r) {
  if (r.x < PANE.x + 4 || r.x + r.w > PANE.x + PANE.w - 4 || r.y < PLOT.y - 4 || r.y + r.h > PANE.y + PANE.h - 2) return false;
  return !OBST.some(o => hitRect(r, o, CLEAR));
}
// horizontal segment with its word inline (the line breaks around the word), word slides along the line to a free spot
function segWord(x0, x1, y, word, a, { dash = false, lw = 1.1, at = [0.5, 0.62, 0.38, 0.75, 0.25, 0.86, 0.14] } = {}) {
  if (a <= 0) return;
  const w = measure(word, MKF), h = 13;
  let gap = null;
  for (const t of at) {
    const cx = x0 + (x1 - x0) * t, r = { x: cx - w / 2, y: y - h / 2, w, h };
    if (cx - w / 2 - 5 < x0 || cx + w / 2 + 5 > x1) continue;
    if (freeRect(r)) { gap = r; break; }
  }
  ctx.save(); ctx.globalAlpha *= a; ctx.strokeStyle = MK; ctx.lineWidth = lw; if (dash) ctx.setLineDash([4, 3]);
  ctx.beginPath();
  if (gap) { ctx.moveTo(x0, y); ctx.lineTo(gap.x - 5, y); ctx.moveTo(gap.x + gap.w + 5, y); ctx.lineTo(x1, y); }
  else { ctx.moveTo(x0, y); ctx.lineTo(x1, y); }
  ctx.stroke(); ctx.restore();
  if (gap) { OBST.push(gap); txt(word, gap.x + gap.w / 2, y + 0.5, { font: MKF, color: MK, align: 'center', alpha: a }); }
  else console.log('NO-SPACE ' + word);
}
function word(s, cands, a, drop = 0) {
  if (a <= 0) return;
  const w = measure(s, MKF), h = 13;
  for (const [cx, cy, al] of cands) {
    const x = al === 'left' ? cx : al === 'right' ? cx - w : cx - w / 2, r = { x, y: cy - h / 2, w, h };
    if (!freeRect(r)) continue;
    OBST.push(r); txt(s, x, cy - drop, { font: MKF, color: MK, alpha: a }); return true;
  }
  console.log('NO-SPACE ' + s); return false;
}

// ---------- camera (push / pull / punch from the motion bible), always on real chart points ----------
const ANCHOR = [W / 2, CARD.y + CARD.h * 0.52];
function focusPts() {
  const A = D.analysis, midY = yOf((yLo + yHi) / 2), lx = LAST ? xOf(LAST.i) : W / 2;
  return {
    liq: [xOf(T.liqI) + SLOT * 4, yOf(A.sweep.level)],
    last: [lx - SLOT * 2.5, (midY + (LAST ? yOf(LAST.c) : midY)) / 2],
    bos: [(xOf(T.bosLvlI) + xOf(T.bosI)) / 2, yOf(A.bos.level)],
    fvg: [xOf(T.fvgC3) + SLOT * 2, yOf((A.fvg.top + A.fvg.bottom) / 2)],
    tool: [xOf(T.entryI) + SLOT, yOf((tr.stop + tr.target) / 2)],
    center: [PANE.x + PANE.w / 2, PLOT.y + PLOT.h / 2]
  };
}
const camKeys = () => [
  [0, 0, 1.12, 'liq'],                 // opening framed on the liquidity
  [T.liq, 90, 1.22, 'liq'],            // calm push-in on $$$ (push)
  [T.liq + 90, 45, 1.14, 'last'],      // follow price into the sweep
  [T.sweep + 42, 60, 1.0, 'bos'],      // pull-out reveals the structure level (pull)
  [T.bos + 42, 24, 1.0, 'last'],
  [T.split, 0, 1.32, 'fvg'],           // cut hidden by the split-open: new shot pushed on the FVG
  [T.pos, 40, 1.0, 'tool'],            // pull-out reveals the target liquidity
  [T.ride, 90, 1.12, 'last'],          // slow push riding with price toward the target
  [T.tp + 42, 40, 1.0, 'center'],
  [T.result, 0, 1.0, 'center'],
  [T.outro, 210, 1.07, 'center']       // slow push for the closing question
];
function camRaw(f) {
  const K = camKeys(), Pt = focusPts(); let k = 0; K.forEach((x, i) => { if (f >= x[0]) k = i; });
  const cur = K[k], prev = K[Math.max(0, k - 1)], t = cur[1] ? LS_OUT(prog(f, cur[0], cur[1])) : 1;
  const a = Pt[prev[3]], b = Pt[cur[3]];
  return { z: prev[2] + (cur[2] - prev[2]) * t, fx: a[0] + (b[0] - a[0]) * t, fy: a[1] + (b[1] - a[1]) * t };
}
function camera(f) {            // temporal smoothing (heavy-camera feel), never across a cut
  const cut = Math.max(0, ...camKeys().filter(k => k[1] === 0 && k[0] <= f).map(k => k[0]));
  let z = 0, x = 0, y = 0, n = 0;
  for (let j = 0; j <= 12; j += 2) { const g = f - j; if (g < cut) break; state(g); const c = camRaw(g); z += c.z; x += c.fx; y += c.fy; n++; }
  state(f); return { z: z / n, fx: x / n, fy: y / n };
}
// punch: 6 in (LS-Out) + 16 hold + 20 back (LS-Spring), always on a beat
function punchScale(f, at, peak) {
  if (f < at || f > at + 42) return 1;
  const k = f - at;
  if (k < 6) return 1 + (peak - 1) * LS_OUT(k / 6);
  if (k < 22) return peak;
  return peak - (peak - 1) * LS_SPRING((k - 22) / 20);
}
function punchNow(f) {
  for (const [at, i, peak, price] of [[T.sweep, T.sweepI, 1.2, T.long ? bars[T.sweepI].l : bars[T.sweepI].h],
                                      [T.bos, T.bosI, 1.2, bars[T.bosI].c], [T.tp, T.tpI, 1.4, tr.target]]) {
    const p = punchScale(f, at, peak); if (p !== 1) return { p, wx: xOf(i), wy: yOf(price), at };
  }
  return { p: 1 };
}
function camM(cam) { return clamp((cam.z - 1) / 0.3, 0, 1) * 0.7; }
function applyCam(cam, pun) {
  const m = camM(cam);
  ctx.translate(cam.fx + (ANCHOR[0] - cam.fx) * m, cam.fy + (ANCHOR[1] - cam.fy) * m); ctx.scale(cam.z, cam.z); ctx.translate(-cam.fx, -cam.fy);
  if (pun.p !== 1) { ctx.translate(pun.wx, pun.wy); ctx.scale(pun.p, pun.p); ctx.translate(-pun.wx, -pun.wy); }
}
function toScreen(cam, pun, x, y) {
  if (pun.p !== 1) { x = pun.wx + (x - pun.wx) * pun.p; y = pun.wy + (y - pun.wy) * pun.p; }
  const m = camM(cam);
  return [cam.fx + (ANCHOR[0] - cam.fx) * m + (x - cam.fx) * cam.z, cam.fy + (ANCHOR[1] - cam.fy) * m + (y - cam.fy) * cam.z];
}

// ---------- layers ----------
const mk = () => { const c = document.createElement('canvas'); c.width = W * DPR; c.height = H * DPR; return c; };
const LAYER = mk(), OLD = mk(), ACC = mk(), FR = mk();
let oldKey = null;
const GRAIN = (() => {
  const c = document.createElement('canvas'); c.width = c.height = 256; const g = c.getContext('2d'), d = g.createImageData(256, 256);
  let s = 7; const rnd = () => (s = (s * 16807) % 2147483647) / 2147483647;
  for (let i = 0; i < d.data.length; i += 4) { const v = 120 + rnd() * 135; d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = 255; }
  g.putImageData(d, 0, 0); return c;
})();

// background: approved image with parallax + depth blur, cinematic key light (window, top-right) and a backlight pool behind the focal point
function drawBG(f, cam, pun) {
  const bg = img('bg'), s = H / bg.naturalHeight * 1.14 * (1 + (cam.z - 1) * 0.22), w = bg.naturalWidth * s, h = bg.naturalHeight * s;
  const px = (ANCHOR[0] - cam.fx) * 0.1 * cam.z, py = (ANCHOR[1] - cam.fy) * 0.1 * cam.z;
  ctx.save(); ctx.filter = 'blur(2.5px)'; ctx.drawImage(bg, (W - w) / 2 + px, (H - h) / 2 + py, w, h); ctx.restore();
  ctx.fillStyle = rgba(P.petrol, 0.12); ctx.fillRect(0, 0, W, H);                    // cool shadow grade
  const g = ctx.createRadialGradient(W * 0.84, H * 0.04, 8, W * 0.84, H * 0.04, H * 0.8);
  g.addColorStop(0, rgba(P.shine, 0.6)); g.addColorStop(0.45, rgba(P.shine, 0.14)); g.addColorStop(1, rgba(P.shine, 0));
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  const [sx, sy] = toScreen(cam, pun, cam.fx, cam.fy);
  const b = ctx.createRadialGradient(sx, sy, 4, sx, sy, 300);
  b.addColorStop(0, rgba(P.shine, 0.5)); b.addColorStop(1, rgba(P.shine, 0));
  ctx.fillStyle = b; ctx.fillRect(0, 0, W, H);
}

function drawGlassCard(cam) {
  const bg = img('bg'), s = H / bg.naturalHeight, w = bg.naturalWidth * s;
  ctx.save(); ctx.shadowColor = rgba(P.stone3, 0.28); ctx.shadowBlur = 34; ctx.shadowOffsetX = -10; ctx.shadowOffsetY = 16;   // shadow cast away from the key light
  rr(CARD.x, CARD.y, CARD.w, CARD.h, CARD.r); ctx.fillStyle = rgba(P.ivory, 0.94); ctx.fill(); ctx.restore();
  ctx.save(); rr(CARD.x, CARD.y, CARD.w, CARD.h, CARD.r); ctx.clip();
  ctx.filter = 'blur(6px)'; ctx.drawImage(bg, (W - w) / 2, 0, w, H); ctx.filter = 'none';
  ctx.fillStyle = rgba(P.ivory, 0.9); ctx.fillRect(CARD.x, CARD.y, CARD.w, CARD.h);
  // light falloff across the glass surface (never on the candles): bright toward the key light and the focal point
  const lg = ctx.createLinearGradient(CARD.x + CARD.w, CARD.y, CARD.x, CARD.y + CARD.h);
  lg.addColorStop(0, rgba(P.shine, 0.55)); lg.addColorStop(0.55, rgba(P.shine, 0)); lg.addColorStop(1, rgba(P.silver2, 0.14));
  ctx.fillStyle = lg; ctx.fillRect(CARD.x, CARD.y, CARD.w, CARD.h);
  const pg = ctx.createRadialGradient(cam.fx, cam.fy, 4, cam.fx, cam.fy, 220);
  pg.addColorStop(0, rgba(P.shine, 0.45)); pg.addColorStop(1, rgba(P.shine, 0));
  ctx.fillStyle = pg; ctx.fillRect(CARD.x, CARD.y, CARD.w, CARD.h);
  ctx.restore();
  ctx.save(); ctx.strokeStyle = rgba(P.shine, 0.95); ctx.lineWidth = 1.2;
  rr(CARD.x + .6, CARD.y + .6, CARD.w - 1.2, CARD.h - 1.2, CARD.r); ctx.stroke(); ctx.restore();
}

// the TradingView chart itself, in world coordinates (camera applied by the caller)
function drawChart(f, cam) {
  const vis = VIS, last = LAST, A = D.analysis;
  drawGlassCard(cam);
  const tY = CARD.y + TOOL_H / 2 + 1;
  txt(D.symbol, CARD.x + 16, tY, { font: `700 13px ${UI}`, color: P.ink });
  txt(`${D.timeframe}`, CARD.x + 16 + measure(D.symbol, `700 13px ${UI}`) + 8, tY, { font: `500 13px ${UI}`, color: P.ink });
  ctx.fillStyle = P.silver1; ctx.fillRect(CARD.x + 104, CARD.y + 9, 1, 13);
  txt('Replay', CARD.x + 114, tY, { font: `700 13px ${UI}`, color: P.water5 });
  txt(D.date + '  ·  UTC+3', CARD.x + CARD.w - 16, tY, { font: `500 11px ${UI}`, color: P.silver4, align: 'right' });
  ctx.fillStyle = P.silver1; ctx.fillRect(CARD.x, CARD.y + TOOL_H - 1, CARD.w, 1);

  // grid + price scale (step from {1,2,2.5,5}×10ⁿ with ≥23 css px between labels)
  const span = yHi - yLo; let step = 50;
  for (const s of [0.1, 0.2, 0.25, 0.5, 1, 2, 2.5, 5, 10, 20, 25]) if (s / span * PLOT.h >= 23) { step = s; break; }
  ctx.save(); ctx.beginPath(); ctx.rect(PANE.x, PANE.y, CARD.w, PANE.h); ctx.clip();
  for (let p = Math.ceil(yLo / step) * step; p <= yHi; p += step) {
    const y = yOf(p); if (y < PLOT.y - 4) continue;
    ctx.fillStyle = C.grid; ctx.fillRect(PANE.x, y - 0.25, PANE.w, 0.5);
    txt(p.toFixed(2), SCALE_X + 6, y, { font: `500 10.5px ${UI}` });
  }
  ctx.restore();
  ctx.save(); ctx.beginPath(); ctx.rect(PANE.x, PANE.y, PANE.w, PANE.h + TAXIS_H); ctx.clip();
  bars.forEach((b, i) => {
    if (+b.t.slice(3) !== 0) return;
    const x = xOf(i); if (x < PANE.x - 20 || x > PANE.x + PANE.w + 20) return;
    ctx.fillStyle = rgba(P.silver3, 0.08); ctx.fillRect(x - 0.25, PANE.y, 0.5, PANE.h);
    txt(b.t, x, TAXIS_Y + TAXIS_H / 2, { font: `500 10.5px ${UI}`, align: 'center' });
  });
  ctx.restore();
  ctx.fillStyle = P.silver1; ctx.fillRect(SCALE_X, PANE.y, 1, PANE.h + TAXIS_H); ctx.fillRect(CARD.x, TAXIS_Y, CARD.w, 1);

  ctx.save(); ctx.beginPath(); ctx.rect(PANE.x, PANE.y, PANE.w, PANE.h); ctx.clip();
  OBST = [];
  const candleRects = [];
  for (const b of vis) {
    const x = xOf(b.i); if (x < PANE.x - SLOT || x > PANE.x + PANE.w + SLOT) continue;
    candleRects.push({ x: x - BODY / 2, y: yOf(b.h), w: BODY, h: Math.max(1, yOf(b.l) - yOf(b.h)) });
  }
  OBST.push(...candleRects, { x: PANE.x, y: PANE.y, w: PANE.w, h: LEGEND_H - 6 });
  const fade = (from) => 1 - 0.55 * LS_OUT(prog(f, from, 20));      // older markup steps step back

  // zones first (TradingView tools sit under the candles)
  const fA = prog(f, T.fvg, 24);
  let fvgR = null;
  if (fA > 0) {   // FVG: Rectangle tool from the third candle, extended right; overshoot 4% then settle
    const x0 = xOf(T.fvgC3) + BODY / 2 + 3, xEnd = PANE.x + PANE.w, k = Math.min(LS_OVER(fA), 1.04);
    const y0 = yOf(A.fvg.top), y1 = yOf(A.fvg.bottom), x1 = x0 + (xEnd - x0) * k;
    ctx.fillStyle = rgba(P.gold1, 0.42); ctx.fillRect(x0, y0, x1 - x0, y1 - y0);
    ctx.strokeStyle = P.gold; ctx.lineWidth = 1; ctx.strokeRect(x0 + .5, y0 + .5, x1 - x0 - 1, y1 - y0 - 1);
    fvgR = { x0, y0, x1, y1 };
  }
  const posA = f - T.pos;
  if (posA > 0) {   // Long/Short Position tool: stop first (gold), target grows after +8f at double length
    const x0 = xOf(T.entryI) - SLOT * 2.5, xR = PANE.x + PANE.w;
    const ye = yOf(tr.entry), ys0 = yOf(tr.stop), yt0 = yOf(tr.target);
    const ys = ye + (ys0 - ye) * LS_OUT(prog(f, T.pos, 14)), yt = ye + (yt0 - ye) * LS_OUT(prog(f, T.pos + 22, 28));
    const pulse = f >= T.tp ? Math.sin(Math.PI * prog(f, T.tp, 24)) : 0;
    ctx.fillStyle = rgba(P.gold, 0.2); ctx.fillRect(x0, Math.min(ye, ys), xR - x0, Math.abs(ys - ye));
    ctx.fillStyle = rgba(P.teal, 0.2 + 0.15 * pulse); ctx.fillRect(x0, Math.min(ye, yt), xR - x0, Math.abs(yt - ye));
    ctx.fillStyle = P.gold; ctx.fillRect(x0, ys - 0.5, xR - x0, 1);
    ctx.fillStyle = P.teal; ctx.fillRect(x0, yt - 0.5, xR - x0, 1);
    ctx.fillStyle = P.silver3; ctx.fillRect(x0, ye - 0.5, xR - x0, 1);
  }

  // candles — TradingView geometry: sharp solid body, 1 output-px wick dead centre, doji = thin line
  for (const b of vis) {
    const x = xOf(b.i); if (x < PANE.x - SLOT || x > PANE.x + PANE.w + SLOT) continue;
    ctx.save(); ctx.globalAlpha *= b.i < T.liqI ? 0.35 : 1; ctx.fillStyle = b.c >= b.o ? C.bull : C.bear;
    const yo = yOf(b.o), Y = p => yo + (yOf(p) - yo) * b.grow;
    const yh = Y(b.h), yl = Y(b.l), yt = Y(Math.max(b.o, b.c)), yb = Y(Math.min(b.o, b.c));
    ctx.fillRect(x - 0.25, yh, 0.5, Math.max(0.5, yl - yh));
    ctx.fillRect(x - BODY / 2, yt, BODY, Math.max(0.5, yb - yt));
    ctx.restore();
  }

  // lines + inline words (one markup element per step; the line starts at the wick tip and stops at the breaking candle)
  const liqA = LS_OUT(prog(f, T.liq, 24));
  if (liqA > 0) {
    const y = yOf(A.sweep.level), x0 = xOf(T.liqI) + 2;
    const end = f >= S[T.sweepI][0] ? xOf(T.sweepI) - BODY / 2 - 3 : PANE.x + PANE.w - 2;
    segWord(x0, x0 + (end - x0) * liqA, y, '$$$', liqA * fade(T.split), { dash: true });
  }
  const bosA = LS_OUT(prog(f, T.bosLine, 24));
  if (bosA > 0) {
    const y = yOf(A.bos.level), x0 = xOf(T.bosLvlI) + 2;
    const end = f >= S[T.bosI][0] ? xOf(T.bosI) - BODY / 2 - 3 : PANE.x + PANE.w - 2;
    const glow = prog(f, T.split, 12) * (f < T.split + 12 ? 1 : 0);
    segWord(x0, x0 + (end - x0) * bosA, y, f >= T.bos ? 'BOS' : '', bosA * fade(T.pos), { lw: 1.1 + glow });
  }
  if (fvgR) {
    const a = LS_OUT(prog(f, T.fvg + 8, 16)) * fade(T.ride), { x0, y0, x1, y1 } = fvgR, cy = (y0 + y1) / 2;
    const inside = y1 - y0 > 16 ? [[x0 + 10, cy, 'left'], [x0 + (x1 - x0) * 0.4, cy, 'left'], [x0 + (x1 - x0) * 0.62, cy, 'left']] : [];
    OBST.push({ x: x0, y: y0, w: x1 - x0, h: y1 - y0 });
    // a word inside the box is allowed only where the box is free of candles
    word('FVG', [...inside.filter(([x, y]) => !candleRects.some(r => hitRect({ x, y: y - 7, w: 26, h: 13 }, r, CLEAR))).map(([x, y]) => [x, y, 'left']),
      [x0 + 6, y0 - 11, 'left'], [x0 + 6, y1 + 11, 'left'], [x0 + 60, y0 - 11, 'left'], [x0 + 60, y1 + 11, 'left']].filter(c => {
        const r = { x: c[0], y: c[1] - 7, w: measure('FVG', MKF), h: 13 };
        return c[1] < y0 || c[1] > y1 || !OBST.slice(0, -1).some(o => hitRect(r, o, CLEAR));
      }), a, (1 - a) * 6);
  }

  // last price line
  if (last) {
    const y = yOf(last.c); ctx.strokeStyle = last.c >= last.o ? C.bull : C.bear; ctx.lineWidth = 0.6; ctx.setLineDash([2, 2]);
    ctx.beginPath(); ctx.moveTo(PANE.x, y); ctx.lineTo(PANE.x + PANE.w, y); ctx.stroke(); ctx.setLineDash([]);
  }
  ctx.restore();

  if (posA > 0) {
    ctx.save(); ctx.globalAlpha *= prog(f, T.pos + 8, 14);
    pill(tr.target.toFixed(2), yOf(tr.target), P.teal); pill(tr.stop.toFixed(2), yOf(tr.stop), P.gold); pill(tr.entry.toFixed(2), yOf(tr.entry), P.silver4);
    ctx.restore();
  }
  if (last) pill(last.c.toFixed(2), yOf(last.c), last.c >= last.o ? P.teal : P.gold);
  if (last) {   // legend: symbol line + OHLC of the newest bar
    const lg = PANE.y + 14, oc = last.c >= last.o ? P.water4 : P.copper;
    txt(D.legend, PANE.x + 10, lg, { font: `700 12px ${UI}`, color: P.ink });
    let lx = PANE.x + 10; const ly = lg + 17;
    for (const [k, v] of [['O', last.o], ['H', last.h], ['L', last.l], ['C', last.c]]) {
      txt(k, lx, ly, { font: `500 11px ${UI}`, color: P.ink }); lx += 10;
      txt(v.toFixed(2), lx, ly, { font: `500 11px ${UI}`, color: oc }); lx += 58;
    }
  }
}

function chartLayer(target, f, cam, pun) {
  const g = target.getContext('2d'); g.setTransform(1, 0, 0, 1, 0, 0); g.clearRect(0, 0, target.width, target.height);
  ctx = g; ctx.setTransform(DPR, 0, 0, DPR, 0, 0); ctx.save(); applyCam(cam, pun); drawChart(f, cam); ctx.restore();
}

// ---------- HUD (not under the camera) ----------
const CAPS = () => [
  [0, ...D.captions.hook], [T.liq, ...D.captions.liq], [T.sweep, ...D.captions.sweep], [T.bosLine, ...D.captions.bosLine],
  [T.bos, ...D.captions.bos], [T.split + 12, ...D.captions.fvg], [T.pos, ...D.captions.pos], [T.ride, ...D.captions.ride],
  [T.tp, ...D.captions.tp], [T.result, ...D.captions.result], [T.outro, ...D.captions.outro]
];
function hud(f) {
  const veil = ctx.createLinearGradient(0, 0, 0, 236);
  veil.addColorStop(0, rgba(P.ivory, 0.96)); veil.addColorStop(0.72, rgba(P.ivory, 0.82)); veil.addColorStop(1, rgba(P.ivory, 0));
  ctx.fillStyle = veil; ctx.fillRect(0, 0, W, 236);
  const cs = CAPS(); let cur = 0; cs.forEach((c, i) => { if (f >= c[0]) cur = i; });
  const [start, l1, l2] = cs[cur], next = cs[cur + 1]?.[0] ?? Infinity;
  const lg = img('logo'), lh = 24, lw = lg.naturalWidth / lg.naturalHeight * lh;
  ctx.drawImage(lg, (W - lw) / 2, 18, lw, lh);
  if (f >= T.outro + 40) {   // single light sweep over the logo at the close (sweep)
    const k = LS_SNAP(prog(f, T.outro + 40, 32));
    ctx.save(); ctx.beginPath(); ctx.rect((W - lw) / 2, 18, lw, lh); ctx.clip();
    const sx = (W - lw) / 2 - lw * 0.3 + (lw * 1.6) * k;
    ctx.translate(sx, 30); ctx.rotate(18 * Math.PI / 180); ctx.fillStyle = rgba(P.shine, 0.6); ctx.fillRect(-lw * 0.09, -40, lw * 0.18, 80); ctx.restore();
  }
  const steps = cs.length;
  for (let i = 0; i < steps; i++) { ctx.fillStyle = i <= cur ? P.water5 : P.silver1; ctx.fillRect(W / 2 - steps * 11 + i * 22 + 2, 52, 18, 3); }
  const inA = LS_OUT(prog(f, start, 14)), outA = 1 - LS_IN(prog(f, next - 9, 9));
  ctx.save(); ctx.globalAlpha = inA * outA;
  const reveal = (s, y, font, color, delay) => {      // Arabic opens from the right
    const a = LS_OUT(prog(f, start + delay, 16)); const w = measure(s, font) + 24;
    ctx.save(); ctx.beginPath(); ctx.rect(W / 2 + w / 2 - w * a, y - 32, w * a, 64); ctx.clip();
    txt(s, W / 2, y + (1 - a) * 6, { font, color, align: 'center', dir: 'rtl' }); ctx.restore();
  };
  if (start === T.result) {
    const R = Math.abs(tr.target - tr.entry) / Math.abs(tr.entry - tr.stop), pz = punchScale(f, T.result + 12, 1.4);
    reveal(l1, 98, `900 30px ${AR}`, P.ink, 0);
    ctx.save(); ctx.translate(W / 2, 160); ctx.scale(pz, pz);
    txt(`+${R.toFixed(0)}R`, 0, 0, { font: `900 50px ${UI}`, color: P.copper, align: 'center', alpha: LS_OUT(prog(f, T.result + 12, 6)) });
    ctx.restore();
    if (l2) reveal(l2, 206, `700 15px ${UI}`, P.water5, 20);
  } else {
    reveal(l1, l2 ? 98 : 122, `900 30px ${AR}`, P.ink, 0);
    if (l2) reveal(l2, 150, `900 23px ${AR}`, start === T.tp ? P.copper : P.water5, 6);
  }
  ctx.restore();
  const fy = 744;   // footer, above the bottom 20%
  ctx.save(); ctx.fillStyle = rgba(P.ivory, 0.92); rr(14, fy, 160, 30, 15); ctx.fill(); ctx.restore();
  ctx.save(); ctx.beginPath(); ctx.arc(30, fy + 15, 11.5, 0, Math.PI * 2); ctx.clip(); ctx.drawImage(img('prof'), 18.5, fy + 3.5, 23, 23); ctx.restore();
  ctx.strokeStyle = P.water5; ctx.lineWidth = 1.2; ctx.beginPath(); ctx.arc(30, fy + 15, 11.5, 0, Math.PI * 2); ctx.stroke();
  txt('@liquidity.state', 48, fy + 16, { font: `700 12px ${UI}`, color: P.ink });
  ctx.save(); ctx.fillStyle = rgba(P.ivory, 0.92); rr(W - 170, fy, 156, 30, 15); ctx.fill(); ctx.restore();
  txt('المحتوى تعليمي وليس توصية', W - 92, fy + 16, { font: `500 11px ${UI}`, color: P.silver4, align: 'center', dir: 'rtl' });
}

// ink reveal (spec3): blob 1 opens on the liquidity, blob 2 (70%) on the live price 8f later; organic 3–5px edge
function blobPath(cx, cy, R, seed) {
  ctx.beginPath();
  for (let k = 0; k <= 96; k++) {
    const th = k / 96 * Math.PI * 2;
    const r = R + 2.2 * Math.sin(7 * th + seed) + 1.6 * Math.sin(13 * th + seed * 2.3) + R * 0.03 * Math.sin(3 * th + seed * 0.7);
    const x = cx + Math.cos(th) * r, y = cy + Math.sin(th) * r; k ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
  }
  ctx.closePath();
}

// ---------- compose one frame ----------
function compose(target, f) {
  state(f); const cam = camera(f), pun = punchNow(f);
  ctx = target.getContext('2d'); ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.fillStyle = P.ivory; ctx.fillRect(0, 0, W, H);
  drawBG(f, cam, pun);
  const liqPt = toScreen(cam, pun, xOf(T.liqI) + SLOT * 4, yOf(D.analysis.sweep.level));
  const pricePt = LAST ? toScreen(cam, pun, SCALE_X + 20, yOf(LAST.c)) : [W / 2, H / 2];
  chartLayer(LAYER, f, cam, pun);
  ctx = target.getContext('2d');
  if (f < 56) {
    const R1 = LS_OUT(prog(f, 0, 48)) * 0.9 * Math.hypot(W, H), R2 = LS_OUT(prog(f, 8, 48)) * 0.63 * Math.hypot(W, H);
    ctx.save(); ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    const path = new Path2D();
    blobPath(...liqPt, Math.max(0.1, R1), 1.3); path.addPath(new Path2D()); ctx.save(); ctx.clip();
    ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.drawImage(LAYER, 0, 0); ctx.restore();
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0); blobPath(...pricePt, Math.max(0.1, R2), 4.1); ctx.save(); ctx.clip();
    ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.drawImage(LAYER, 0, 0); ctx.restore();
    ctx.restore();
  } else if (f >= T.split && f < T.split + 42) {
    // split-open (mask9) from the real BOS level: the line flashes gold 12f, then the old shot parts and the new one is behind it
    const key = 'split';
    if (oldKey !== key) {
      const g = T.split - 1; state(g); const c0 = camera(g); chartLayer(OLD, g, c0, { p: 1 });
      OLD.lineY = toScreen(c0, { p: 1 }, 0, yOf(D.analysis.bos.level))[1]; oldKey = key;
      state(f); chartLayer(LAYER, f, cam, pun); ctx = target.getContext('2d');
    }
    const ly = OLD.lineY * DPR, k = f - T.split;
    if (k < 12) {
      ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.drawImage(OLD, 0, 0);
      ctx.fillStyle = rgba(P.gold1, Math.sin(Math.PI * k / 12) * 0.9); ctx.fillRect(0, ly - 2, W * DPR, 4);
    } else {
      const d = LS_SNAP((k - 12) / 30) * H * 0.62 * DPR;
      ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.drawImage(LAYER, 0, 0);
      const half = (y0, h, dy) => {
        for (let s = 0; s < 3; s++) {   // motion blur on the halves only
          ctx.globalAlpha = s === 0 ? 1 : 0.25; const o = dy - Math.sign(dy) * s * 6 * DPR * (1 - (k - 12) / 30);
          ctx.drawImage(OLD, 0, y0, W * DPR, h, 0, y0 + o, W * DPR, h);
        }
        ctx.globalAlpha = 1;
        const e = dy < 0 ? y0 + h + dy : y0 + dy, sh = ctx.createLinearGradient(0, e - (dy < 0 ? 24 : -24), 0, e);
        sh.addColorStop(0, rgba(P.stone3, 0)); sh.addColorStop(1, rgba(P.stone3, 0.18));
        ctx.fillStyle = sh; ctx.fillRect(0, Math.min(e, e - (dy < 0 ? 24 : -24)), W * DPR, 24);
      };
      half(0, ly, -d); half(ly, H * DPR - ly, d);
    }
  } else {
    ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.drawImage(LAYER, 0, 0);
  }
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  // vignette in petrol, breathes +15% with pushes and punches
  const push = clamp((cam.z * pun.p - 1) / 0.4, 0, 1), v = 0.22 + 0.15 * push;
  const vg = ctx.createRadialGradient(ANCHOR[0], ANCHOR[1], H * 0.3, ANCHOR[0], ANCHOR[1], H * 0.78);
  vg.addColorStop(0, rgba(P.petrol, 0)); vg.addColorStop(1, rgba(P.petrol, v));
  ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
  if (pun.p !== 1 && f - pun.at < 1.5) { ctx.fillStyle = rgba(P.shine, 0.05); ctx.fillRect(0, 0, W, H); }   // +5% lift on the first punch frame
  hud(f);
  // dip to petrol with the question in the dark (never an empty dark)
  if (f >= T.dip && f < T.dip + 28) {
    const k = f - T.dip, a = k < 10 ? LS_IN(k / 10) : k < 18 ? 1 : 1 - LS_OUT((k - 18) / 10);
    ctx.fillStyle = rgba(P.petrol, a); ctx.fillRect(0, 0, W, H);
    ctx.save(); ctx.globalAlpha = a * 0.07; ctx.globalCompositeOperation = 'overlay';
    const o = (f * 37) % 256; for (let y = -o; y < H; y += 128) for (let x = -o; x < W; x += 128) ctx.drawImage(GRAIN, x, y, 128, 128);
    ctx.restore();
    txt(D.captions.dip, W / 2, H * 0.42, { font: `900 34px ${AR}`, color: P.ivory, align: 'center', dir: 'rtl', alpha: a });
  }
}

// motion blur: shutter 180° (half the frame), 5 samples, only when the image moves faster than 20 output px per frame
function screenSpeed(f) {
  if (f < 1) return 0;
  state(f - 1); const c0 = camera(f - 1), p0 = punchNow(f - 1); const a0 = toScreen(c0, p0, CARD.x, CARD.y), b0 = toScreen(c0, p0, CARD.x + CARD.w, CARD.y + CARD.h);
  state(f); const c1 = camera(f), p1 = punchNow(f); const a1 = toScreen(c1, p1, CARD.x, CARD.y), b1 = toScreen(c1, p1, CARD.x + CARD.w, CARD.y + CARD.h);
  return Math.max(Math.hypot(a1[0] - a0[0], a1[1] - a0[1]), Math.hypot(b1[0] - b0[0], b1[1] - b0[1])) * DPR;
}
function render(f) {
  const out = cv.getContext('2d');
  if (screenSpeed(f) > 20) {
    const a = ACC.getContext('2d'); a.setTransform(1, 0, 0, 1, 0, 0); a.globalAlpha = 1;
    for (let s = 0; s < 5; s++) {
      compose(FR, f - 0.5 + 0.5 * s / 4);
      a.globalAlpha = 1 / (s + 1); a.drawImage(FR, 0, 0);
    }
    a.globalAlpha = 1; out.setTransform(1, 0, 0, 1, 0, 0); out.drawImage(ACC, 0, 0);
  } else { compose(FR, f); out.setTransform(1, 0, 0, 1, 0, 0); out.drawImage(FR, 0, 0); }
}

window.setup = async (data) => {
  await Promise.all(['bg', 'logo', 'prof'].map(id => img(id).decode()));
  await Promise.all(["900 12px 'Thmanyah Display'", "900 12px 'Thmanyah Sans'", "700 12px 'Thmanyah Sans'", "500 12px 'Thmanyah Sans'", "400 12px 'TV Trebuchet'", "400 12px 'TV Segoe'"]
    .map(f => document.fonts.load(f, 'عربي 0123 $BOS')));
  return init(data);
};
window.sched = () => Object.values(S).filter(v => isFinite(v[0]));
window.frame = (f, type = 'image/png') => { render(f); return cv.toDataURL(type, 0.95); };
window.probe = (f) => {          // candle sizes in OUTPUT px on screen (camera zoom included)
  state(f); const cam = camera(f), pun = punchNow(f), z = cam.z * pun.p;
  const done = VIS.filter(b => b.p >= 1).filter(b => { const [x] = toScreen(cam, pun, xOf(b.i), 0); return x > 0 && x < W && xOf(b.i) > PANE.x && xOf(b.i) < PANE.x + PANE.w; });
  return { z, bodyPx: BODY * DPR * z, n: done.length, lens: done.map(b => (yOf(b.l) - yOf(b.h)) * DPR * z) };
};
