<!doctype html><html dir="rtl" lang="ar"><head><meta charset="utf-8">
<title>الفوت برنت — الدليل الكامل | Liquidity State</title>
<style>
  @font-face{font-family:'Tajawal';src:url('fonts/Tajawal-Regular.ttf');font-weight:400}
  @font-face{font-family:'Tajawal';src:url('fonts/Tajawal-Medium.ttf');font-weight:500}
  @font-face{font-family:'Tajawal';src:url('fonts/Tajawal-Bold.ttf');font-weight:700}
  @font-face{font-family:'Tajawal';src:url('fonts/Tajawal-ExtraBold.ttf');font-weight:800}
  @font-face{font-family:'Tajawal';src:url('fonts/Tajawal-Black.ttf');font-weight:900}
  @font-face{font-family:'Mono';src:url('fonts/SpaceMono-Regular.ttf');font-weight:400}
  @font-face{font-family:'Mono';src:url('fonts/SpaceMono-Bold.ttf');font-weight:700}
  @font-face{font-family:'Pop';src:url('fonts/Poppins-SemiBold.ttf');font-weight:600}
  :root{
    --paper:#F5F2EB; --ink:#1E2A2E; --sub:#5C696D; --teal:#237067; --teal2:#2ECC9A;
    --gold:#C79A3A; --red:#CE5140; --line:#DED8CA; --card:#FBFAF6;
    --dk0:#0F1A20; --dk1:#0A1319; --panel:#101A22; --grid:#22323C;
    --fpbg:#0E1820; --bidT:#D08A86; --askT:#74C7AC; --buyH:#1C6E52; --sellH:#9B3D34;
  }
  @page{size:1080px 1528px;margin:0}
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{background:#333}
  body{font-family:'Tajawal',sans-serif;color:var(--ink)}
  .page{width:1080px;height:1528px;position:relative;overflow:hidden;background:var(--paper);page-break-after:always}
  .page:last-child{page-break-after:auto}
  .dark{background:radial-gradient(120% 80% at 78% 6%, #16303A 0%, var(--dk0) 45%, var(--dk1) 100%);color:#EAF3F2}
  .lat{font-family:'Pop'} .mono{font-family:'Mono'}

  /* running header/footer on content pages */
  .hd{position:absolute;top:56px;left:80px;right:80px;display:flex;align-items:center;justify-content:space-between;z-index:5}
  .hd .wm{display:flex;align-items:center;gap:12px}
  .hd .wm svg{width:34px;height:34px}
  .hd .wm b{font-family:'Pop';font-weight:600;font-size:19px;letter-spacing:2px;color:#43555A}
  .hd .ch{font-weight:700;font-size:19px;color:var(--teal)}
  .ft{position:absolute;bottom:52px;left:80px;right:80px;display:flex;align-items:center;justify-content:space-between;z-index:5;
    font-family:'Pop';font-size:19px;color:#8A9599}
  .ft .pg b{color:var(--ink)}
  .content{position:absolute;top:150px;left:80px;right:80px;bottom:120px;z-index:4}

  .kick{font-family:'Pop';font-weight:600;font-size:22px;letter-spacing:3px;color:var(--gold);text-transform:uppercase;margin-bottom:14px}
  h1.big{font-weight:900;font-size:86px;line-height:1.08;letter-spacing:-1px}
  h2{font-weight:900;font-size:60px;line-height:1.12;color:var(--ink)}
  h2 .n{color:var(--teal)}
  .rule{width:120px;height:6px;background:var(--teal);border-radius:4px;margin:20px 0 30px}
  p{font-weight:500;font-size:31px;line-height:1.62;color:#33403f;margin:0 0 20px}
  p b{color:var(--teal);font-weight:800}
  .lead{font-weight:700;font-size:35px;line-height:1.55;color:#2b3836}
  ul.clean{list-style:none;margin:6px 0 20px}
  ul.clean li{position:relative;padding-right:40px;font-weight:500;font-size:30px;line-height:1.5;margin-bottom:16px;color:#33403f}
  ul.clean li::before{content:"";position:absolute;right:0;top:14px;width:15px;height:15px;border-radius:50%;background:var(--teal)}
  .note{background:var(--card);border:1.5px solid var(--line);border-right:8px solid var(--teal);border-radius:14px;padding:26px 32px;margin:10px 0 20px}
  .note.warn{border-right-color:var(--red)} .note.gold{border-right-color:var(--gold)}
  .note .t{font-weight:800;font-size:30px;margin-bottom:8px;color:var(--ink)}
  .note.warn .t{color:var(--red)} .note p{font-size:28px;margin:0;color:#3c4948}
  .cap{font-weight:500;font-size:23px;color:var(--sub);text-align:center;margin-top:14px}
  .cap b{color:var(--teal)}

  /* ===== FOOTPRINT PANEL (dark, authentic) ===== */
  .fp{background:var(--fpbg);border:1px solid #223540;border-radius:16px;padding:26px 28px 22px;color:#C7D3D3;
    box-shadow:0 18px 44px rgba(8,16,20,.18)}
  .fp .fh{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;
    font-family:'Pop';font-size:20px;color:#8AA0A6;letter-spacing:1px}
  .fp .fh .sym{color:#DCE8E8;font-weight:600}
  .fpbars{display:flex;gap:60px;justify-content:center;align-items:flex-end;direction:ltr}
  .bar{display:flex;flex-direction:column;align-items:stretch}
  .brow{display:grid;grid-template-columns:104px 150px 104px;column-gap:14px;align-items:center;height:48px;position:relative}
  .bcell{font-family:'Mono';font-weight:700;font-size:26px;height:100%;display:flex;align-items:center;border-radius:6px}
  .bcell.bid{justify-content:flex-end;color:var(--bidT)}
  .bcell.ask{justify-content:flex-start;color:var(--askT)}
  .bprice{font-family:'Mono';font-size:25px;color:#849499;text-align:center}
  .bcell.buyH{background:var(--buyH);color:#EAFBF4;padding-left:12px}
  .bcell.sellH{background:var(--sellH);color:#FDECEA;padding-right:12px}
  .brow.poc{background:rgba(233,196,106,.12);border-radius:6px}
  .brow.poc .bprice{color:var(--gold);font-weight:700}
  .bsum{border-top:1px solid #223540;margin-top:10px;padding-top:14px;display:grid;grid-template-columns:104px 150px 104px;column-gap:14px;font-family:'Mono';font-size:23px}
  .bsum .d{grid-column:1/2;text-align:center;white-space:nowrap} .bsum .v{grid-column:3/4;text-align:center;color:#9AAAB0;white-space:nowrap}
  .barlab{text-align:center;font-family:'Pop';font-size:19px;color:#8AA0A6;margin-top:10px;letter-spacing:1px}
  .tagPOC{position:absolute;left:-104px;top:50%;transform:translateY(-50%);font-family:'Pop';font-weight:600;font-size:16px;color:var(--gold);letter-spacing:1px;white-space:nowrap}

  /* cover candles / gem */
  .glow{position:absolute;border-radius:50%;filter:blur(120px);opacity:.16;pointer-events:none}
  table.idx{width:100%;border-collapse:collapse}
  table.idx td{padding:16px 4px;border-bottom:1px solid var(--line);font-weight:600;font-size:30px;vertical-align:middle}
  table.idx td.num{width:80px;font-family:'Pop';font-weight:600;color:var(--teal);font-size:30px}
  table.idx td.pg{width:70px;text-align:left;font-family:'Pop';color:var(--sub);font-size:26px}

  .kpi{display:flex;gap:22px;margin:8px 0 18px}
  .kpi .k{flex:1;background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:24px;text-align:center}
  .kpi .k .kv{font-family:'Pop';font-weight:600;font-size:44px;color:var(--teal)}
  .kpi .k .kl{font-weight:600;font-size:24px;color:var(--sub);margin-top:6px}
  .steps{counter-reset:s}
  .steps .st{display:flex;gap:22px;align-items:flex-start;margin-bottom:22px}
  .steps .st .b{flex:none;width:60px;height:60px;border-radius:14px;background:var(--teal);color:#fff;display:grid;place-items:center;font-family:'Pop';font-weight:600;font-size:30px}
  .steps .st .tx b{display:block;font-weight:800;font-size:31px;color:var(--ink);margin-bottom:2px}
  .steps .st .tx span{font-weight:500;font-size:27px;color:#43514f;line-height:1.45}
</style></head>
<body>
<!-- pages injected here -->
<div id="root"></div>

<script>
const GEM='<svg viewBox="0 0 100 100"><g fill="none" stroke="#6E7A7C" stroke-width="4" stroke-linejoin="round"><polygon points="50,6 88,28 88,72 50,94 12,72 12,28"/><path d="M12,28 L50,43 L88,28"/><path d="M12,72 L50,43 L88,72"/><path d="M50,43 L50,94"/></g></svg>';
const GEMW='<svg viewBox="0 0 100 100"><g fill="none" stroke="#d7c79a" stroke-width="4" stroke-linejoin="round"><polygon points="50,6 88,28 88,72 50,94 12,72 12,28"/><path d="M12,28 L50,43 L88,28"/><path d="M12,72 L50,43 L88,72"/><path d="M50,43 L50,94"/></g></svg>';

// ---- footprint bar renderer ----
// levels: top->bottom [{p, bid, ask, imb:'buy'|'sell'|null, poc:true?}]
function bar(levels, {delta, vol, label}={}){
  let rows='';
  for(const L of levels){
    const bidC='bcell bid'+(L.imb==='sell'?' sellH':'');
    const askC='bcell ask'+(L.imb==='buy'?' buyH':'');
    const poc=L.poc?' poc':'';
    const tag=L.poc?'<span class="tagPOC">POC ←</span>':'';
    rows+=`<div class="brow${poc}"><div class="${bidC}">${L.bid}</div><div class="bprice">${tag}${L.p}</div><div class="${askC}">${L.ask}</div></div>`;
  }
  const dnum = typeof delta==='number' ? delta : parseFloat(String(delta).replace('+',''));
  const dcol = dnum>=0?'#74C7AC':'#D08A86';
  const dtxt = typeof delta==='number' ? (delta>0?'+':'')+delta : delta;
  return `<div class="bar"><div>${rows}</div><div class="bsum"><div class="d" style="color:${dcol}">Δ ${dtxt}</div><div class="v">Vol ${vol}</div></div>${label?`<div class="barlab">${label}</div>`:''}</div>`;
}
function panel(title, sym, barsHTML){
  return `<div class="fp"><div class="fh"><div>${title}</div><div class="sym">${sym}</div></div><div class="fpbars">${barsHTML}</div></div>`;
}

function legend(items){
  return `<div style="display:flex;flex-wrap:wrap;gap:14px 34px;margin-top:18px;justify-content:center">`+
    items.map(i=>`<div style="display:flex;align-items:center;gap:10px;font-weight:600;font-size:24px;color:#3c4948"><span style="width:22px;height:22px;border-radius:6px;background:${i.c};display:inline-block"></span>${i.t}</div>`).join('')+`</div>`;
}
// CVD/price line chart. price & cvd: arrays of 0..100
function cvdSVG({price, cvd, priceLbl, cvdLbl, marks}){
  const W=920,H=360,pad=46,n=price.length;
  const X=i=>pad+i*(W-2*pad)/(n-1), Y=v=>H-pad-(v/100)*(H-2*pad);
  const pth=a=>a.map((v,i)=>(i?'L':'M')+X(i).toFixed(0)+' '+Y(v).toFixed(0)).join(' ');
  let mk='';
  (marks||[]).forEach(m=>{mk+=`<circle cx="${X(m.i)}" cy="${Y(m.arr==='cvd'?cvd[m.i]:price[m.i])}" r="7" fill="${m.c}"/>`;
    if(m.t) mk+=`<text x="${X(m.i)}" y="${Y(m.arr==='cvd'?cvd[m.i]:price[m.i])-16}" fill="${m.c}" font-family="Pop" font-size="20" text-anchor="middle">${m.t}</text>`;});
  return `<div class="fp"><svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto">
    <line x1="${pad}" y1="${H-pad}" x2="${W-pad}" y2="${H-pad}" stroke="#22323C" stroke-width="1.5"/>
    <path d="${pth(price)}" fill="none" stroke="#8AA0A6" stroke-width="4.5" stroke-linejoin="round"/>
    <path d="${pth(cvd)}" fill="none" stroke="#2ECC9A" stroke-width="4.5" stroke-linejoin="round"/>
    ${mk}
  </svg><div style="display:flex;justify-content:center;gap:44px;font-family:'Pop';font-size:22px;margin-top:8px">
    <span style="color:#9AAAB0">▬ ${priceLbl||'السعر'}</span><span style="color:#2ECC9A">▬ ${cvdLbl||'CVD'}</span></div></div>`;
}

// single-value column renderer for alternate display types
function dcol(levels, mode, {delta,vol,label}={}){
  const rows=levels.map(L=>{
    const b=+L.bid,a=+L.ask,d=a-b,v=a+b,pct=v?Math.round(d/v*100):0;
    let txt='',tc='#C7D3D3',bg='transparent',barW=0,barC='';
    if(mode==='delta'){txt=(d>0?'+':'')+d;tc=d>=0?'#74C7AC':'#D08A86';bg=d>=0?'rgba(28,110,82,.28)':'rgba(155,61,52,.28)';}
    if(mode==='pct'){txt=(d>0?'+':'')+pct+'%';tc=d>=0?'#74C7AC':'#D08A86';bg=d>=0?'rgba(28,110,82,.28)':'rgba(155,61,52,.28)';}
    if(mode==='vol'){txt=v;tc='#DCE8E8';barW=Math.min(1,v/560);barC='rgba(116,199,172,.28)';}
    const barEl=mode==='vol'?`<div style="position:absolute;left:0;top:7px;bottom:7px;width:${(barW*100).toFixed(0)}%;background:${barC};border-radius:5px"></div>`:'';
    return `<div style="display:grid;grid-template-columns:150px 168px;column-gap:16px;align-items:center;height:48px">
      <div class="bprice">${L.p}</div>
      <div style="position:relative;height:100%;display:flex;align-items:center;justify-content:center;border-radius:6px;background:${bg}">${barEl}<span class="mono" style="position:relative;font-weight:700;font-size:26px;color:${tc}">${txt}</span></div></div>`;
  }).join('');
  const s = (delta!=null)?`<div class="bsum" style="grid-template-columns:150px 168px;column-gap:16px"><div class="v" style="grid-column:1/2">${vol?('Vol '+vol):''}</div><div class="d" style="grid-column:2/3;color:${(typeof delta==='number'?delta:parseFloat(String(delta)))>=0?'#74C7AC':'#D08A86'}">Δ ${delta}</div></div>`:'';
  return `<div class="bar" style="direction:ltr">${rows}${s}${label?`<div class="barlab">${label}</div>`:''}</div>`;
}
// mini volume profile (horizontal bars) with POC/HVN/LVN
function profileSVG(levels){
  const W=520,rh=54,pad=8,H=levels.length*rh+2*pad,maxv=Math.max(...levels.map(l=>l.v));
  let rows=levels.map((l,i)=>{const w=(l.v/maxv)*(W-230),y=pad+i*rh;
    const col=(l.tag==='POC'||l.tag==='nPOC')?'#E9C46A':l.tag==='LVN'?'#4B5F68':'#3E8C7E';
    const px=w+22, tx=px+String(l.p).length*15+20;
    return `<rect x="10" y="${y+8}" width="${w}" height="${rh-16}" rx="5" fill="${col}" opacity="${l.tag==='LVN'?0.5:0.9}"/>
      <text x="${px}" y="${y+rh/2+2}" fill="#9AAAB0" font-family="Mono" font-size="22" dominant-baseline="middle">${l.p}</text>
      ${l.tag?`<text x="${tx}" y="${y+rh/2+2}" fill="${col}" font-family="Pop" font-weight="600" font-size="20" dominant-baseline="middle">${l.tag}</text>`:''}`;}).join('');
  return `<div class="fp" style="direction:ltr"><svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto">${rows}</svg></div>`;
}

// ===== candlestick chart (SVG) with annotations =====
// candles: [{o,h,l,c}]; over: annotation list
function chart(candles, over=[], {w=940,h=440,pad=46,rightPad=150}={}){
  const lo=Math.min(...candles.map(c=>c.l)), hi=Math.max(...candles.map(c=>c.h));
  const rng=(hi-lo)||1, PADp=rng*0.10, LO=lo-PADp, HI=hi+PADp;
  const n=candles.length, plotW=w-pad-rightPad, cw=plotW/n;
  const X=i=>pad+i*cw+cw/2, Y=p=>pad+(HI-p)/(HI-LO)*(h-2*pad);
  const bw=Math.max(6,cw*0.56);
  let cs='';
  candles.forEach((c,i)=>{const up=c.c>=c.o,col=up?'#2ECC9A':'#C86A62';
    const x=X(i),top=Y(Math.max(c.o,c.c)),bot=Y(Math.min(c.o,c.c)),bh=Math.max(2,bot-top);
    cs+=`<line x1="${x.toFixed(1)}" y1="${Y(c.h).toFixed(1)}" x2="${x.toFixed(1)}" y2="${Y(c.l).toFixed(1)}" stroke="${col}" stroke-width="2.4"/>`+
        `<rect x="${(x-bw/2).toFixed(1)}" y="${top.toFixed(1)}" width="${bw.toFixed(1)}" height="${bh.toFixed(1)}" rx="2.5" fill="${col}"/>`;});
  let ov='';
  for(const o of over){
    if(o.t==='hline'){const y=Y(o.p);ov+=`<line x1="${pad}" y1="${y}" x2="${w-rightPad+70}" y2="${y}" stroke="${o.c||'#E9C46A'}" stroke-width="2.2" stroke-dasharray="${o.dash||'10 7'}"/>`+
      (o.label?`<text x="${w-rightPad+78}" y="${y+7}" fill="${o.c||'#E9C46A'}" font-family="Pop" font-size="21">${o.label}</text>`:'');}
    if(o.t==='zone'){const y1=Y(Math.max(o.p1,o.p2)),y2=Y(Math.min(o.p1,o.p2));const x1=o.i1!=null?X(o.i1)-cw/2:pad;const x2=o.i2!=null?X(o.i2)+cw/2:w-rightPad+70;
      ov+=`<rect x="${x1}" y="${y1}" width="${(x2-x1)}" height="${(y2-y1)}" fill="${o.c||'rgba(46,204,154,.16)'}" stroke="${o.sc||'rgba(46,204,154,.5)'}" stroke-width="1.5" rx="4"/>`+
      (o.label?`<text x="${x2-8}" y="${(y1+y2)/2+7}" fill="${o.tc||'#8FE9CF'}" font-family="Pop" font-size="20" text-anchor="end">${o.label}</text>`:'');}
    if(o.t==='lbl'){ov+=`<text x="${X(o.i)}" y="${Y(o.p)}" fill="${o.c||'#DCE8E8'}" font-family="Pop" font-size="${o.fs||20}" text-anchor="${o.anchor||'middle'}">${o.text}</text>`;}
    if(o.t==='sweep'){const x=X(o.i),y=Y(o.p);ov+=`<circle cx="${x}" cy="${y}" r="9" fill="none" stroke="${o.c||'#E15A5A'}" stroke-width="2.5"/>`+
      (o.text?`<text x="${x}" y="${y-18}" fill="${o.c||'#E15A5A'}" font-family="Pop" font-size="19" text-anchor="middle">${o.text}</text>`:'');}
    if(o.t==='arrow'){const x=X(o.i),y=Y(o.p),d=o.dir==='down'?-1:1;ov+=`<path d="M${x} ${y} L${x-9} ${y+18*d} L${x+9} ${y+18*d} Z" fill="${o.c||'#2ECC9A'}"/>`+
      (o.text?`<text x="${x}" y="${y+ (d>0?40:-24)}" fill="${o.c||'#2ECC9A'}" font-family="Pop" font-size="19" text-anchor="middle">${o.text}</text>`:'');}
  }
  return `<div class="fp" style="direction:ltr;padding:20px 16px"><svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto">${cs}${ov}</svg></div>`;
}
// mini vertical volume profile overlay to the right of a chart price range (standalone illustration)
function partdiv(num,title,sub,tag){return page(`
  <div class="glow" style="background:#2ECC9A;top:-150px;right:-120px;width:560px;height:560px;opacity:.14"></div>
  <div class="glow" style="background:#E9C46A;bottom:-180px;left:-150px;width:480px;height:480px;opacity:.08"></div>
  <div style="position:absolute;top:70px;left:80px;right:80px;display:flex;align-items:center;gap:14px;color:#EAF3F2"><div style="width:44px;height:44px">${GEMW}</div><div class="lat" style="font-weight:600;font-size:24px;letter-spacing:4px">LIQUIDITY STATE</div></div>
  <div style="position:absolute;top:0;bottom:0;left:80px;right:80px;display:flex;flex-direction:column;justify-content:center;color:#EAF3F2">
    <div class="lat" style="font-weight:600;font-size:150px;color:rgba(46,204,154,.16);line-height:1">${num}</div>
    <div class="kick" style="margin-top:-10px">${tag||'الجزء'}</div>
    <h1 class="big" style="color:#fff;font-size:88px">${title}</h1>
    <div class="rule" style="background:#2ECC9A"></div>
    <div style="font-weight:600;font-size:40px;color:#B7C8C6;line-height:1.5;max-width:820px">${sub}</div>
  </div>
  <div style="position:absolute;bottom:70px;left:80px;right:80px;display:flex;justify-content:space-between;color:#7C8C92" class="lat"><div style="font-size:24px" dir="ltr">@liquidity.state</div><div style="font-size:22px">لغرض تعليمي فقط</div></div>
`,'dark');}

// ---- page template ----
function page(inner, cls=''){return `<div class="page ${cls}">${inner}</div>`;}
function head(ch){return `<div class="hd"><div class="wm">${GEM}<b>LIQUIDITY STATE</b></div><div class="ch">${ch}</div></div>`;}
function foot(n){return `<div class="ft"><div>الفوت برنت · دليل تعليمي</div><div class="pg">صفحة <b>${n}</b> / @@TOT@@</div></div>`;}
function content(html){return `<div class="content">${html}</div>`;}
function cpage(ch,html){const n=P.length+1;return page(head(ch)+content(html)+foot(n));}

const P=[];

/* ============ 1 · COVER ============ */
P.push(page(`
  <div class="glow" style="background:#2ECC9A;top:-160px;right:-120px;width:560px;height:560px"></div>
  <div class="glow" style="background:#E9C46A;bottom:-200px;left:-160px;width:520px;height:520px;opacity:.10"></div>
  <div style="position:absolute;top:70px;left:80px;right:80px;display:flex;align-items:center;gap:16px;color:#EAF3F2">
    <div style="width:48px;height:48px">${GEMW}</div>
    <div class="lat" style="font-weight:600;font-size:26px;letter-spacing:4px">LIQUIDITY STATE</div>
  </div>
  <div style="position:absolute;top:430px;left:80px;right:80px">
    <div class="kick">دليل تعليمي شامل · ORDER FLOW</div>
