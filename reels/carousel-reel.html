<meta charset="utf-8">
<title>Liquidity State — Animated Carousel Reel</title>
<style>
  html,body{margin:0;padding:0;background:#0A1015;overflow:hidden}
  #stage{position:relative;width:1080px;height:1920px;overflow:hidden;background:#0A1015}
  .slide{position:absolute;top:0;left:0;width:1080px;height:1920px;
    background-size:cover;background-position:center;will-change:transform;
    backface-visibility:hidden;transform-origin:center center}
  .slide.s1{background-image:url(assets/1.png)}
  .slide.s2{background-image:url(assets/2.png)}
  .slide.s3{background-image:url(assets/3.png)}
  .slide.s4{background-image:url(assets/4.png)}
  .slide.s5{background-image:url(assets/5.png)}
  canvas#fx{position:absolute;inset:0;pointer-events:none}
  #seam{position:absolute;top:0;bottom:0;width:120px;pointer-events:none;opacity:0;
    background:linear-gradient(90deg,rgba(0,0,0,0),rgba(0,0,0,.45),rgba(0,0,0,0))}
  #vig{position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(120% 78% at 50% 42%, rgba(0,0,0,0) 58%, rgba(0,0,0,.30) 100%)}
  #prog{position:absolute;top:26px;left:40px;right:40px;height:5px;display:flex;gap:8px;z-index:5}
  #prog .seg{flex:1;border-radius:4px;background:rgba(255,255,255,.16);overflow:hidden}
  #prog .seg>i{display:block;height:100%;width:0;background:rgba(120,230,200,.95);border-radius:4px}
</style>

<div id="stage">
  <div class="slide s1"></div>
  <div class="slide s2"></div>
  <div class="slide s3"></div>
  <div class="slide s4"></div>
  <div class="slide s5"></div>
  <canvas id="fx" width="1080" height="1920"></canvas>
  <div id="seam"></div>
  <div id="vig"></div>
  <div id="prog">
    <div class="seg"><i></i></div><div class="seg"><i></i></div><div class="seg"><i></i></div>
    <div class="seg"><i></i></div><div class="seg"><i></i></div>
  </div>
</div>

<script>
const FPS=30, W=1080, HH=1920, N=5;
const HOLDS=[3.3,3.2,3.2,3.2,3.7], TR=0.6;
// pan direction per slide (dx,dy in px) for varied Ken Burns
const PAN=[[ -26,18],[22,-16],[-20,-18],[24,16],[-18,20]];
const segs=[]; let time=0;
for(let i=0;i<N;i++){
  segs.push({a:time,b:time+HOLDS[i],pa:i,pb:i,hold:true}); time+=HOLDS[i];
  if(i<N-1){segs.push({a:time,b:time+TR,pa:i,pb:i+1,hold:false}); time+=TR;}
}
const TOTAL=time;

const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const ss=(a,b,x)=>{x=clamp((x-a)/(b-a),0,1);return x*x*(3-2*x);};
const lerp=(a,b,x)=>a+(b-a)*x;
const easeIO=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;

function pAt(t){for(const s of segs){if(t>=s.a&&t<=s.b){return s.hold?s.pa:lerp(s.pa,s.pb,easeIO(ss(s.a,s.b,t)));}}return N-1;}
const life=[];
for(let i=0;i<N;i++){let cs=null,ce=null;segs.forEach(s=>{if(s.pa===i||s.pb===i){if(cs===null)cs=s.a;ce=s.b;}});life.push([cs,ce]);}

// ---- deterministic particle field (constellation) ----
let _s=1337; const rnd=()=>{_s=(_s*1664525+1013904223)&0x7fffffff;return _s/0x7fffffff;};
const P=[]; for(let i=0;i<46;i++){P.push({x:rnd()*W,y:rnd()*HH,vx:(rnd()-.5)*7,vy:(rnd()-.5)*7,r:1+rnd()*2.2,ph:rnd()*6.28});}

const slides=[...document.querySelectorAll('.slide')];
const segEls=[...document.querySelectorAll('#prog .seg>i')];
const seam=document.getElementById('seam');
const fx=document.getElementById('fx'), fc=fx.getContext('2d');

function drawFX(t,p){
  fc.clearRect(0,0,W,HH);
  // particles drift (deterministic in t), wrap
  const pts=P.map(q=>({x:((q.x+q.vx*t)%W+W)%W, y:((q.y+q.vy*t)%HH+HH)%HH, r:q.r,
    a:0.20+0.16*Math.sin(t*0.9+q.ph)}));
  // connecting lines
  fc.lineWidth=1;
  for(let i=0;i<pts.length;i++){
    for(let j=i+1;j<pts.length;j++){
      const dx=pts[i].x-pts[j].x, dy=pts[i].y-pts[j].y; const d=Math.hypot(dx,dy);
      if(d<190){fc.strokeStyle='rgba(120,200,190,'+(0.10*(1-d/190))+')';
        fc.beginPath();fc.moveTo(pts[i].x,pts[i].y);fc.lineTo(pts[j].x,pts[j].y);fc.stroke();}
    }
  }
  for(const q of pts){fc.fillStyle='rgba(150,220,205,'+q.a+')';fc.beginPath();fc.arc(q.x,q.y,q.r,0,6.28);fc.fill();}
  // light sweep on active slide (once per hold)
  const cur=Math.round(p); const lt=(t-life[cur][0]);
  const sweep=ss(0.4,2.0,lt); // sweeps early in the hold
  if(sweep>0&&sweep<1){
    const sx=lerp(-300,W+300,sweep);
    const g=fc.createLinearGradient(sx-160,0,sx+160,HH);
    g.addColorStop(0,'rgba(255,255,255,0)');g.addColorStop(0.5,'rgba(180,240,225,0.06)');g.addColorStop(1,'rgba(255,255,255,0)');
    fc.fillStyle=g; fc.fillRect(0,0,W,HH);
  }
}

function render(t){
  t=clamp(t,0,TOTAL);
  const p=pAt(t);
  slides.forEach((el,i)=>{
    const off=(i-p)*W;
    if(Math.abs(i-p)>1.3){el.style.opacity=0;el.style.display='none';return;}
    el.style.display='block';el.style.opacity=1;
    const kb=clamp((t-life[i][0])/((life[i][1]-life[i][0])||1),0,1);
    const scale=lerp(1.05,1.15,kb);              // deeper zoom for life
    const px=lerp(0,PAN[i][0],kb), py=lerp(0,PAN[i][1],kb);
    const breathe=1+0.006*Math.sin(t*1.4+i);     // subtle breathing
    el.style.transform=`translate3d(${off+px}px,${py}px,0) scale(${scale*breathe})`;
  });
  drawFX(t,p);
  const frac=Math.abs(p-Math.round(p));
  seam.style.opacity=frac>0.001?Math.sin(frac*Math.PI)*0.9:0;
  seam.style.left=((Math.ceil(p)-p)*W-60)+'px';
  const op=t/TOTAL*N;
  segEls.forEach((el,i)=>{el.style.width=(clamp(op-i,0,1)*100)+'%';});
}

let _t0=null,_live=true;
function loop(ts){if(_live){if(_t0==null)_t0=ts;render(((ts-_t0)/1000)%TOTAL);}requestAnimationFrame(loop);}
window.__setT=t=>{_live=false;render(t);};
window.__meta=()=>({fps:FPS,duration:TOTAL});
render(0); requestAnimationFrame(loop);
</script>
