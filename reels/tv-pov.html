<meta charset="utf-8">
<title>Liquidity State — TradingView POV</title>
<style>
  @font-face{font-family:'Tajawal';src:url('fonts/Tajawal-Bold.ttf');font-weight:700}
  @font-face{font-family:'Tajawal';src:url('fonts/Tajawal-Black.ttf');font-weight:900}
  html,body{margin:0;padding:0;background:#131722;overflow:hidden}
  #stage{position:relative;width:1080px;height:1920px;overflow:hidden;background:#131722;
    font-family:-apple-system,'Trebuchet MS',Roboto,Ubuntu,sans-serif}
  canvas#c{position:absolute;inset:0}
  /* brand end card (Arabic via DOM) */
  #end{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:26px;opacity:0;background:linear-gradient(180deg,#0F151B,#06090C)}
  #end .gem{width:120px;height:120px}
  #end .t{color:#EDEFF1;font-family:'Tajawal';font-weight:900;font-size:70px;direction:rtl}
  #end .t em{font-style:normal;color:#C9A24B}
  #end .s{color:#8A949C;font-family:'Tajawal';font-weight:700;font-size:34px;direction:rtl;letter-spacing:1px}
  #end .h{color:#C7CDD2;font-family:'Tajawal';font-weight:700;letter-spacing:6px;font-size:30px;margin-top:10px}
</style>
<div id="stage">
  <canvas id="c" width="1080" height="1920"></canvas>
  <div id="end">
    <svg class="gem" viewBox="0 0 100 100"><g fill="none" stroke="#d7c79a" stroke-width="2.2" stroke-linejoin="round"><polygon points="50,6 88,28 88,72 50,94 12,72 12,28" fill="rgba(215,199,154,0.10)"/><path d="M12,28 L50,43 L88,28"/><path d="M12,72 L50,43 L88,72"/><path d="M50,43 L50,94"/><path d="M50,6 L50,43"/><path d="M31,17 L50,43 L69,17" stroke-width="1.5"/></g></svg>
    <div class="t">صفقة موثّقة · <em>+2R</em></div>
    <div class="s">XAUUSD · لونق من الاختراق · لغرض تعليمي</div>
    <div class="h">LIQUIDITY&nbsp;STATE</div>
  </div>
</div>
<script>
const TRADE={"symbol":"XAUUSD","tf":"60",
"candles":[[4064.0,4075.2,4061.1,4075.2],[4075.3,4075.5,4049.0,4050.9],[4050.5,4054.5,4005.8,4022.4],[4022.4,4027.5,4017.5,4023.3],[4023.1,4025.5,3992.9,4000.3],[4000.5,4009.3,3999.2,4000.6],[4000.7,4012.7,3993.6,4008.5],[4008.8,4011.6,4000.5,4009.3],[4009.4,4013.6,4002.8,4008.7],[4005.9,4015.5,4005.8,4007.4],[4007.7,4009.9,3999.1,4007.9],[4008.6,4014.3,3990.4,4011.6],[4010.8,4019.0,3998.6,4017.0],[4017.5,4025.7,4012.7,4019.2],[4019.1,4025.7,4017.5,4022.6],[4023.7,4029.7,4019.9,4026.7],[4027.2,4040.4,4026.2,4037.8],[4037.7,4039.5,4028.0,4030.4],[4030.6,4036.4,4026.5,4027.3],[4027.3,4031.1,4020.8,4022.6],[4022.4,4031.2,4020.1,4028.7],[4028.6,4029.6,4021.9,4028.2],[4028.2,4039.0,4022.1,4038.1],[4038.5,4112.5,4029.8,4083.9],[4084.0,4096.4,4078.2,4084.0],[4084.0,4098.4,4077.9,4093.0],[4093.0,4108.7,4071.3,4073.1]],
"lo":3980.6,"hi":4122.3,"entryIdx":22,"entry":4038.1,"sl":4019.2,"tp":4075.9,"tpHitIdx":23,"rr":2.0,
"supP1":[4,3992.9],"supP2":[10,3999.1]};
const FPS=30, W=1080, H=1920;
const cv=document.getElementById('c'), x2=cv.getContext('2d');
const endEl=document.getElementById('end');

// shell metrics
const TOPH=48, LEFTW=54, SCALEW=86, BOTH=46;
const CX0=LEFTW, CX1=W-SCALEW, CY0=TOPH, CY1=H-BOTH;
const PADT=120, PADB=90;
const N=TRADE.candles.length, RIGHT=6, slots=N+RIGHT;
const slotW=(CX1-CX0-24)/slots, bodyW=Math.min(22,slotW*0.66);
const xi=i=>CX0+16+i*slotW+slotW/2;
const lo=TRADE.lo, hi=TRADE.hi;
const py=p=>(CY0+PADT)+(hi-p)/(hi-lo)*((CY1-PADB)-(CY0+PADT));

const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const ss=(a,b,x)=>{x=clamp((x-a)/(b-a),0,1);return x*x*(3-2*x);};
const lerp=(a,b,x)=>a+(b-a)*x;
const eIO=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;

// ---------- CURSOR timeline ----------
const Y_ENTRY=py(TRADE.entry), Y_TP=py(TRADE.tp);
const ICON_TREND=[27,TOPH+34+46], ICON_POS=[27,TOPH+34+46*5];
const WP=[
 [0.0,720,1000],[1.3,ICON_TREND[0],ICON_TREND[1]],[2.0,ICON_TREND[0],ICON_TREND[1]],
 [2.8,xi(TRADE.supP1[0]),py(TRADE.supP1[1])],[3.3,xi(TRADE.supP1[0]),py(TRADE.supP1[1])],
 [4.3,xi(TRADE.supP2[0]),py(TRADE.supP2[1])],[4.8,xi(TRADE.supP2[0]),py(TRADE.supP2[1])],
 [5.6,ICON_POS[0],ICON_POS[1]],[6.2,ICON_POS[0],ICON_POS[1]],
 [7.0,xi(TRADE.entryIdx),Y_ENTRY],[7.5,xi(TRADE.entryIdx),Y_ENTRY],
 [8.7,xi(TRADE.entryIdx),Y_TP],[9.4,W-60,30],[10.0,W-60,30],[10.8,720,560]
];
function cursorAt(t){
 if(t<=WP[0][0])return[WP[0][1],WP[0][2]];
 for(let i=0;i<WP.length-1;i++){if(t>=WP[i][0]&&t<=WP[i+1][0]){
   const k=eIO(ss(WP[i][0],WP[i+1][0],t));
   const wob=(WP[i+1][0]-t<0.12)?Math.sin(t*60)*1.5:0;
   return[lerp(WP[i][1],WP[i+1][1],k),lerp(WP[i][2],WP[i+1][2],k)+wob];}}
 const l=WP[WP.length-1];return[l[1],l[2]];
}
// state timings
const T={ toolTrend:1.9, a1:3.2, a2:4.7, toolPos:6.1, entryDown:7.4, release:8.7, replay:9.9 };
// replay reveal times for candles beyond entry
const REVEAL={23:10.7,24:11.9,25:13.1,26:14.3};
const establish=23; // idx 0..22 always shown after establish-in

function roundRect(x,y,w,h,r){x2.beginPath();x2.moveTo(x+r,y);x2.arcTo(x+w,y,x+w,y+h,r);x2.arcTo(x+w,y+h,x,y+h,r);x2.arcTo(x,y+h,x,y,r);x2.arcTo(x,y,x+w,y,r);x2.closePath();}

function drawCandle(i,alpha,grow){
 const [o,h,l,c]=TRADE.candles[i]; const up=c>=o; const col=up?'#26A69A':'#EF5350';
 const x=xi(i); let yO=py(o),yC=py(c),yH=py(h),yL=py(l);
 if(grow<1){yH=lerp(yO,yH,grow);yL=lerp(yO,yL,grow);yC=lerp(yO,yC,grow);}
 const bt=Math.min(yO,yC),bb=Math.max(yO,yC);
 x2.globalAlpha=alpha; x2.strokeStyle=col; x2.fillStyle=col; x2.lineWidth=2;
 x2.beginPath();x2.moveTo(x,yH);x2.lineTo(x,yL);x2.stroke();
 x2.fillRect(x-bodyW/2,bt,bodyW,Math.max(2,bb-bt));
 x2.globalAlpha=1;
}

function drawChartArea(t){
 // clip to chart region
 x2.save();x2.beginPath();x2.rect(CX0,CY0,CX1-CX0,CY1-CY0);x2.clip();
 // grid + watermark
 x2.fillStyle='rgba(178,181,190,0.05)';x2.textAlign='center';x2.font='900 150px sans-serif';
 x2.fillText('XAUUSD',(CX0+CX1)/2, (CY0+CY1)/2-10);
 x2.font='500 60px sans-serif';x2.fillText('60 · 1H',(CX0+CX1)/2,(CY0+CY1)/2+70);
 // price gridlines
 x2.strokeStyle='#2A2E39';x2.lineWidth=1;x2.fillStyle='#B2B5BE';x2.font='22px sans-serif';x2.textAlign='left';
 for(let p=Math.ceil(lo/20)*20;p<=hi;p+=20){const y=py(p);
   x2.globalAlpha=1;x2.beginPath();x2.moveTo(CX0,y);x2.lineTo(CX1,y);x2.stroke();}
 // ---- position tool (after entry down) ----
 if(t>=T.entryDown){
   const dragP=clamp(ss(T.entryDown,T.release,t),0,1);
   const tpNow=lerp(TRADE.entry,TRADE.tp,dragP), slNow=lerp(TRADE.entry,TRADE.sl,dragP);
   const yE=py(TRADE.entry),yT=py(tpNow),yS=py(slNow);
   const xL=xi(TRADE.entryIdx)-slotW*0.6;
   // profit zone
   x2.fillStyle='rgba(38,166,154,0.20)';x2.fillRect(xL,yT,CX1-xL,yE-yT);
   x2.fillStyle='rgba(239,83,80,0.20)';x2.fillRect(xL,yE,CX1-xL,yS-yE);
   x2.strokeStyle='#26A69A';x2.lineWidth=1.5;x2.beginPath();x2.moveTo(xL,yT);x2.lineTo(CX1,yT);x2.stroke();
   x2.strokeStyle='#EF5350';x2.beginPath();x2.moveTo(xL,yS);x2.lineTo(CX1,yS);x2.stroke();
   x2.strokeStyle='#B2B5BE';x2.setLineDash([5,4]);x2.beginPath();x2.moveTo(xL,yE);x2.lineTo(CX1,yE);x2.stroke();x2.setLineDash([]);
   // TP pulse when hit
   let pulse=0; if(t>=REVEAL[23]+0.4){pulse=Math.max(0,Math.sin((t-(REVEAL[23]+0.4))*4))* (t<REVEAL[23]+2.2?1:0);}
   if(pulse>0){x2.fillStyle='rgba(38,166,154,'+(0.15*pulse)+')';x2.fillRect(xL,yT,CX1-xL,yE-yT);}
 }
 // support trendline (ray)
 if(t>=T.a1){
   const [i1,p1]=TRADE.supP1,[i2,p2]=TRADE.supP2;
   const x1=xi(i1),y1=py(p1); let x2e,y2e;
   if(t<T.a2){const cur=cursorAt(t);x2e=cur[0];y2e=cur[1];}
   else{ // full ray extended right
     const xa=xi(i2),ya=py(p2); const slope=(ya-y1)/(xa-x1);
     x2e=CX1; y2e=y1+slope*(CX1-x1);
   }
   x2.strokeStyle='#2962FF';x2.lineWidth=2.5;x2.beginPath();x2.moveTo(x1,y1);x2.lineTo(x2e,y2e);x2.stroke();
   // anchor dots
   x2.fillStyle='#2962FF';x2.beginPath();x2.arc(x1,y1,4,0,7);x2.fill();
   if(t>=T.a2){const xa=xi(i2),ya=py(p2);x2.beginPath();x2.arc(xa,ya,4,0,7);x2.fill();}
 }
 // ---- candles ----
 const estIn=ss(0.2,1.4,t); // establish fade/reveal of setup candles
 for(let i=0;i<establish;i++){
   const ap=ss(i*0.03,i*0.03+0.4,t)*estIn>0? Math.min(1,ss(0.2,1.2,t)) :0;
   if(ss(0.2,1.2,t)>0) drawCandle(i,1,1);
 }
 // last price line for current last revealed candle
 let lastIdx=establish-1;
 for(let i=establish;i<N;i++){ if(t>=REVEAL[i]){ const g=clamp(ss(REVEAL[i],REVEAL[i]+0.5,t),0,1); drawCandle(i,1,g); lastIdx=i; } }
 const lastC=TRADE.candles[lastIdx][3]; const yl=py(lastC);
 x2.strokeStyle=(TRADE.candles[lastIdx][3]>=TRADE.candles[lastIdx][0])?'#26A69A':'#EF5350';
 x2.setLineDash([6,4]);x2.lineWidth=1;x2.beginPath();x2.moveTo(CX0,yl);x2.lineTo(CX1,yl);x2.stroke();x2.setLineDash([]);
 x2.restore();

 // price scale labels (outside clip)
 x2.fillStyle='#B2B5BE';x2.font='22px sans-serif';x2.textAlign='left';
 for(let p=Math.ceil(lo/20)*20;p<=hi;p+=20){const y=py(p);x2.fillText(p.toFixed(1),CX1+10,y+7);}
 // last price pill on scale
 const col=(TRADE.candles[lastIdx][3]>=TRADE.candles[lastIdx][0])?'#26A69A':'#EF5350';
 x2.fillStyle=col;roundRect(CX1+2,yl-15,SCALEW-4,30,3);x2.fill();
 x2.fillStyle='#fff';x2.font='700 21px sans-serif';x2.textAlign='center';x2.fillText(lastC.toFixed(1),CX1+SCALEW/2,yl+7);

 // RR info card (after release)
 if(t>=T.release){
   const a=ss(T.release,T.release+0.4,t);
   const cx=xi(TRADE.entryIdx)+120, cy=py((TRADE.entry+TRADE.tp)/2);
   x2.globalAlpha=a;x2.fillStyle='#1E222D';x2.strokeStyle='#2A2E39';roundRect(cx,cy-46,196,92,6);x2.fill();x2.stroke();
   x2.textAlign='left';x2.fillStyle='#26A69A';x2.font='700 24px sans-serif';x2.fillText('Long · RR '+TRADE.rr.toFixed(1),cx+16,cy-14);
   x2.fillStyle='#B2B5BE';x2.font='20px sans-serif';
   x2.fillText('Target  '+TRADE.tp.toFixed(1),cx+16,cy+14);
   x2.fillText('Stop     '+TRADE.sl.toFixed(1),cx+16,cy+38);
   x2.globalAlpha=1;
 }
 // TP HIT tag
 if(t>=REVEAL[23]+0.3 && t<REVEAL[23]+3){
   const a=ss(REVEAL[23]+0.3,REVEAL[23]+0.7,t)*(1-ss(REVEAL[23]+2.4,REVEAL[23]+3,t));
   x2.globalAlpha=a;x2.fillStyle='#26A69A';roundRect(xi(23)-60,py(TRADE.tp)-52,150,38,5);x2.fill();
   x2.fillStyle='#0b1f1b';x2.font='800 24px sans-serif';x2.textAlign='center';x2.fillText('TP HIT',xi(23)+15,py(TRADE.tp)-26);x2.globalAlpha=1;
 }
}

// ---------- shell ----------
function icon(cx,cy,type,active){
 x2.strokeStyle=active?'#2962FF':'#B2B5BE';x2.fillStyle=active?'#2962FF':'#B2B5BE';x2.lineWidth=2;
 x2.save();x2.translate(cx,cy);
 if(type=='cross'){x2.beginPath();x2.moveTo(-11,0);x2.lineTo(11,0);x2.moveTo(0,-11);x2.lineTo(0,11);x2.stroke();}
 else if(type=='trend'){x2.beginPath();x2.moveTo(-11,10);x2.lineTo(11,-10);x2.stroke();x2.beginPath();x2.arc(-11,10,2.5,0,7);x2.arc(11,-10,2.5,0,7);x2.fill();}
 else if(type=='fib'){for(let k=-1;k<=1;k++){x2.beginPath();x2.moveTo(-11,k*7);x2.lineTo(11,k*7);x2.stroke();}}
 else if(type=='brush'){x2.beginPath();x2.moveTo(-10,10);x2.quadraticCurveTo(0,-6,10,-10);x2.stroke();}
 else if(type=='text'){x2.font='700 20px sans-serif';x2.textAlign='center';x2.fillText('T',0,7);}
 else if(type=='pos'){x2.globalAlpha=.9;x2.fillStyle=active?'rgba(41,98,255,.5)':'rgba(38,166,154,.5)';x2.fillRect(-11,-11,22,10);x2.fillStyle=active?'rgba(41,98,255,.5)':'rgba(239,83,80,.5)';x2.fillRect(-11,1,22,10);x2.globalAlpha=1;x2.strokeRect(-11,-11,22,22);}
 else if(type=='ruler'){x2.strokeRect(-11,-6,22,12);}
 else if(type=='magnet'){x2.beginPath();x2.arc(0,-2,9,Math.PI,0);x2.stroke();x2.beginPath();x2.moveTo(-9,-2);x2.lineTo(-9,8);x2.moveTo(9,-2);x2.lineTo(9,8);x2.stroke();}
 else if(type=='eye'){x2.beginPath();x2.ellipse(0,0,11,6,0,0,7);x2.stroke();x2.beginPath();x2.arc(0,0,3,0,7);x2.fill();}
 else if(type=='trash'){x2.strokeRect(-8,-8,16,18);x2.beginPath();x2.moveTo(-11,-8);x2.lineTo(11,-8);x2.stroke();}
 x2.restore();
}
function drawShell(t,tool){
 // top toolbar
 x2.fillStyle='#131722';x2.fillRect(0,0,W,TOPH);
 x2.strokeStyle='#2A2E39';x2.lineWidth=1;x2.beginPath();x2.moveTo(0,TOPH+.5);x2.lineTo(W,TOPH+.5);x2.stroke();
 x2.fillStyle='#D1D4DC';x2.textAlign='left';x2.font='700 26px sans-serif';x2.fillText('XAUUSD',18,32);
 x2.fillStyle='#5d6673';x2.fillText('·',150,32);
 x2.fillStyle='#D1D4DC';x2.font='600 24px sans-serif';x2.fillText('60',172,32);
 x2.fillStyle='#B2B5BE';x2.font='500 22px sans-serif';x2.fillText('Indicators',240,32);
 // replay btn (right)
 const rpActive=t>=T.replay;
 x2.fillStyle=rpActive?'#2962FF':'#B2B5BE';x2.textAlign='right';x2.font='600 22px sans-serif';x2.fillText('⤺ Replay',W-30,32);
 // left toolbar
 x2.fillStyle='#131722';x2.fillRect(0,TOPH,LEFTW,H-TOPH-BOTH);
 x2.strokeStyle='#2A2E39';x2.beginPath();x2.moveTo(LEFTW+.5,TOPH);x2.lineTo(LEFTW+.5,H-BOTH);x2.stroke();
 const icons=['cross','trend','fib','brush','text','pos','ruler','magnet','eye','trash'];
 icons.forEach((ic,k)=>{const cy=TOPH+34+k*46;
   const active=(ic=='trend'&&tool=='trend')||(ic=='pos'&&tool=='pos')||(ic=='cross'&&tool=='cross');
   if(active){x2.fillStyle='rgba(41,98,255,0.12)';x2.fillRect(2,cy-20,LEFTW-4,40);}
   icon(27,cy,ic,active);});
 // bottom bar
 x2.fillStyle='#131722';x2.fillRect(0,H-BOTH,W,BOTH);
 x2.strokeStyle='#2A2E39';x2.beginPath();x2.moveTo(0,H-BOTH+.5);x2.lineTo(W,H-BOTH+.5);x2.stroke();
 x2.fillStyle='#B2B5BE';x2.textAlign='left';x2.font='500 20px sans-serif';
 x2.fillText('1D  5D  1M  3M  6M  1Y  All',18,H-BOTH+29);
 // replay control bar (after replay click)
 if(t>=T.replay){const a=ss(T.replay,T.replay+0.3,t);x2.globalAlpha=a;
   x2.fillStyle='#1E222D';x2.strokeStyle='#2A2E39';roundRect(W/2-120,H-BOTH-52,240,40,6);x2.fill();x2.stroke();
   x2.fillStyle='#D1D4DC';x2.textAlign='center';x2.font='600 20px sans-serif';x2.fillText('▐▐   ▶   1x   ⏭',W/2,H-BOTH-25);x2.globalAlpha=1;}
}
function drawCursor(t){
 const [cx,cy]=cursorAt(t);
 const overChart=cx>CX0&&cx<CX1&&cy>CY0&&cy<CY1;
 if(overChart){ // crosshair
   x2.strokeStyle='#9598A1';x2.lineWidth=1;x2.setLineDash([4,4]);
   x2.beginPath();x2.moveTo(CX0,cy);x2.lineTo(CX1,cy);x2.moveTo(cx,CY0);x2.lineTo(cx,CY1);x2.stroke();x2.setLineDash([]);
   // price label on scale
   const p=hi-(cy-(CY0+PADT))/((CY1-PADB)-(CY0+PADT))*(hi-lo);
   x2.fillStyle='#363A45';roundRect(CX1+2,cy-15,SCALEW-4,30,3);x2.fill();
   x2.fillStyle='#D1D4DC';x2.font='700 21px sans-serif';x2.textAlign='center';x2.fillText(p.toFixed(1),CX1+SCALEW/2,cy+7);
 }
 // arrow pointer
 x2.save();x2.translate(cx,cy);
 x2.fillStyle='#fff';x2.strokeStyle='#131722';x2.lineWidth=1.5;
 x2.beginPath();x2.moveTo(0,0);x2.lineTo(0,22);x2.lineTo(6,16);x2.lineTo(11,26);x2.lineTo(15,24);x2.lineTo(10,14);x2.lineTo(18,14);x2.closePath();
 x2.fill();x2.stroke();x2.restore();
 // click ring
 for(const ct of [T.toolTrend,T.a1,T.a2,T.toolPos,T.entryDown,T.replay]){
   if(t>=ct&&t<ct+0.35){const a=1-(t-ct)/0.35;x2.strokeStyle='rgba(255,255,255,'+a*0.8+')';x2.lineWidth=2;
     x2.beginPath();x2.arc(cx,cy,6+(1-a)*16,0,7);x2.stroke();}
 }
}

const TOTAL=21.5;
function toolAt(t){ if(t>=T.toolPos)return 'pos'; if(t>=T.toolTrend)return 'trend'; return 'cross'; }
function render(t){
 t=clamp(t,0,TOTAL);
 x2.clearRect(0,0,W,H); x2.fillStyle='#131722'; x2.fillRect(0,0,W,H);
 const platform=1-ss(17.6,18.4,t);
 x2.globalAlpha=platform;
 drawChartArea(t);
 drawShell(t,toolAt(t));
 if(t<11) drawCursor(t); else if(t<17) drawCursor(t);
 x2.globalAlpha=1;
 // end card
 endEl.style.opacity=ss(17.8,18.6,t);
 const g=endEl.querySelector('.t'); // subtle rise
}
let _t0=null,_live=true;
function loop(ts){if(_live){if(_t0==null)_t0=ts;render(((ts-_t0)/1000)%TOTAL);}requestAnimationFrame(loop);}
window.__setT=t=>{_live=false;render(t);};
window.__meta=()=>({fps:FPS,duration:TOTAL});
document.fonts.ready.then(()=>{render(0);requestAnimationFrame(loop);});
</script>
