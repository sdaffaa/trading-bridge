<meta charset="utf-8">
<title>Liquidity State — خطوات دخول الصفقة</title>
<link rel="stylesheet" href="./brand.css">
<style>
  html,body { margin:0; padding:0; }
  .slide { width:1080px; height:1920px; box-sizing:border-box; padding:58px 60px 46px;
           background:var(--ls-bg); font-family:var(--ls-font-ar); color:var(--ls-text);
           direction:rtl; display:flex; flex-direction:column; }
  .top { display:flex; justify-content:space-between; align-items:baseline; }
  .eyebrow { font-size:25px; font-weight:700; letter-spacing:.22em; color:var(--ls-text-accent);
             direction:ltr; text-transform:uppercase; }
  .pair { font-size:24px; font-weight:600; color:var(--ls-text-secondary); direction:ltr; }
  h1  { font-size:58px; font-weight:800; margin:14px 0 8px; text-align:left; line-height:1.24; }
  .sub{ font-size:28px; font-weight:500; color:var(--ls-text-secondary); text-align:left;
        margin:0 0 18px; }
  .rule { height:1px; background:var(--ls-gridline); margin:0 0 16px; }

  /* the step rail — the current step is the only one at full weight */
  .steps { display:flex; gap:10px; margin-bottom:16px; }
  .steps .s { flex:1; border-top:3px solid var(--ls-gridline); padding-top:9px;
              font-size:20px; font-weight:700; color:var(--ls-text-secondary);
              opacity:.45; transition:none; direction:ltr; text-align:right; }
  .steps .s.on   { border-top-color:var(--ls-text-accent); color:var(--ls-text-accent); opacity:1; }
  .steps .s.done { opacity:.75; border-top-color:var(--ls-text-accent); }

  .card { border:1.5px solid #CFDDE2; border-radius:22px; padding:16px 10px 8px;
          background:var(--ls-bg-grad-top); overflow:hidden; }

  /* the caption for the step currently being drawn */
  .say { margin-top:18px; min-height:118px; }
  .say .t { font-size:37px; font-weight:800; line-height:1.3; }
  .say .d { font-size:26px; font-weight:500; color:var(--ls-text-secondary);
            margin-top:7px; line-height:1.5; }

  .plan { display:flex; gap:12px; margin-top:14px; }
  /* child combinator: `.plan div` would also match the nested .k/.v and hide
     them at opacity 0, which the JS only ever clears on the card itself. */
  .plan > div { flex:1; border:1.5px solid var(--ls-gridline); border-radius:12px;
                padding:11px 14px; opacity:0; }
  .plan .k { font-size:19px; font-weight:600; color:var(--ls-text-secondary); direction:ltr; }
  .plan .v { font-size:29px; font-weight:800; direction:ltr; margin-top:2px; }
  .plan .risk .v { color:var(--ls-invalid); }
  .plan .tp   .v { color:var(--ls-text-accent); }

  .foot { margin-top:auto; display:flex; justify-content:space-between; align-items:center;
          gap:24px; border-top:1px solid var(--ls-gridline); padding-top:16px; }
  .foot .lm { font-family:var(--ls-font-wordmark); font-size:19px; letter-spacing:.2em;
              color:var(--ls-text-secondary); direction:ltr; text-transform:uppercase;
              white-space:nowrap; }
  .foot .dc { font-size:19px; font-weight:500; color:var(--ls-text-secondary); white-space:nowrap; }
</style>

<div class="slide">
  <div class="top">
    <div class="eyebrow">Entry Model · Sweep → MSS → FVG</div>
    <div class="pair">XAUUSD · M15</div>
  </div>
  <h1>خطوات دخول الصفقة</h1>
  <div class="sub">الشارت يمشي، ونقف عند كل حدث يستحق الوقوف.</div>
  <div class="rule"></div>

  <div class="steps" id="steps">
    <div class="s">5 · TP</div><div class="s">4 · Entry</div><div class="s">3 · FVG</div>
    <div class="s">2 · MSS</div><div class="s">1 · Sweep</div>
  </div>

  <div class="card"><div id="chart"></div></div>

  <div class="say"><div class="t" id="sayT"></div><div class="d" id="sayD"></div></div>

  <div class="plan">
    <div class="tp"   id="pTP"><div class="k">TP</div><div class="v" id="vTP">—</div></div>
    <div class="risk" id="pSL"><div class="k">SL</div><div class="v" id="vSL">—</div></div>
    <div          id="pEN"><div class="k">Entry</div><div class="v" id="vEN">—</div></div>
  </div>

  <div class="foot">
    <div class="lm">Liquidity State · Markup System</div>
    <div class="dc">مثال تخطيطي — ليست توصية</div>
  </div>
</div>

<script src="./markup.js"></script>
<script>
/* ---------------------------------------------------------------------------
   A schematic series shaped to carry one setup: a rally into equal highs, a
   sweep of them, displacement down leaving a gap, a break of structure, then a
   retrace into that gap. Prices are illustrative — every level drawn below is
   READ BACK OFF these candles, never typed in, so each line lands on a real
   wick per the zero rule.
--------------------------------------------------------------------------- */
function series() {
  let s = 31337;
  const rnd = () => (s = (s * 1664525 + 1013904223) % 4294967296) / 4294967296 - 0.5;
  const A = [
    [0,4238],[14,4262],[22,4276],          // context: the leg up
    [30,4288],[34,4286.5],[38,4288.4],     // equal highs forming
    [42,4281],[46,4291.5],                 // the push that sweeps them
    [50,4268],[54,4258],[60,4256],         // displacement down, leaving gaps
    [68,4276],                             // retrace back up into one of them
    [74,4262],[82,4244],[92,4234]          // and away to target
  ];
  const out = [];
  for (let k = 0; k < A.length - 1; k++) {
    const [i0,p0] = A[k], [i1,p1] = A[k+1];
    for (let i = i0; i < i1; i++) {
      const t = (i - i0) / (i1 - i0);
      out.push(p0 + (p1 - p0) * t + rnd() * 2.0);
    }
  }
  out.push(A[A.length-1][1]);
  return out.slice(0,-1).map((v,i) => {
    const o = v, c = out[i+1], w = 0.7 + Math.abs(rnd()) * 2.3;
    return { o, c, h: Math.max(o,c) + Math.abs(rnd())*w, l: Math.min(o,c) - Math.abs(rnd())*w };
  });
}

const candles = series();
const hiOf = (a,b) => { let i=a,p=candles[a].h; for(let k=a;k<=b;k++) if(candles[k].h>p){p=candles[k].h;i=k;} return {i,p}; };
const loOf = (a,b) => { let i=a,p=candles[a].l; for(let k=a;k<=b;k++) if(candles[k].l<p){p=candles[k].l;i=k;} return {i,p}; };

/* --- read the chart before drawing it (spec: Read before drawing) --------- */
const BSL   = hiOf(30, 40);                       // the equal-high liquidity
let sweepI = BSL.i + 1;                           // first bar to take it out
while (sweepI < candles.length && candles[sweepI].h <= BSL.p) sweepI++;
const sweepH = candles[sweepI].h;                 // the wick that did it → SL sits above

const swingLo = loOf(38, 44);                     // last higher low before the drop
let mssI = sweepI + 1;                            // MSS = a BODY close below it
while (mssI < candles.length && candles[mssI].c >= swingLo.p) mssI++;

/* FVG = the three-candle gap: candle i-1's low above candle i+1's high. A
   displacement leaves several; the one that matters is the first that price
   actually trades back into, because an untouched gap is not an entry, it is
   just a gap. Pick by that test rather than by being first. */
const gaps = [];
for (let i = sweepI + 1; i < Math.min(mssI + 10, candles.length - 1); i++) {
  if (candles[i-1].l > candles[i+1].h)
    gaps.push({ i, top: candles[i-1].l, bottom: candles[i+1].h });
}
let fvg = null, entryI = mssI + 2;
for (const g of gaps) {
  let e = g.i + 2;
  while (e < candles.length && candles[e].h < g.bottom) e++;
  if (e < candles.length - 6) { fvg = g; entryI = e; break; }
}
const ENTRY = fvg ? fvg.bottom : candles[entryI].h;
const SL    = sweepH;
const targetLo = loOf(entryI + 2, candles.length - 1);
const TP    = targetLo.p;
const R     = (ENTRY - TP) / (SL - ENTRY);

/* --- chart ---------------------------------------------------------------- */
const ch = LSChart({
  mount: '#chart', width: 940, height: 1075, candles,
  padding: { top: 44, right: 104, bottom: 36, left: 20 },
  barsRight: 2, barsVisible: 58, tolerance: 0.05, anim: {}
});
ch.priceScale({ step: 15, decimals: 0 });
ch.drawCandles();

/* Holds: the replay freezes on the bar that just printed while its step draws.
   4s each is enough to draw and read one idea. */
const HOLD = 3.6;
const holds = [
  { atBar: sweepI + 2, seconds: HOLD },
  { atBar: mssI   + 2, seconds: HOLD },
  { atBar: (fvg ? fvg.i : mssI) + 4, seconds: HOLD },
  { atBar: entryI + 2, seconds: HOLD },
  { atBar: targetLo.i + 1, seconds: HOLD + 1.6 }
];
ch.replay({ rate: 4.71, window: 56, start: 24, holds });
const T = holds.map(h => h.t);          // when each step begins

/* --- the markup, in the spec's order ------------------------------------- */
// 1 · Liquidity + the sweep that took it
ch.level({ price: BSL.p, from: BSL.i, to: sweepI, dashed: true, tone: 'accent', at: T[0] + .2 });
ch.anchor({ i: BSL.i, price: BSL.p, n: 1, at: T[0] + .9 });
ch.sticker({ i: sweepI, price: sweepH, text: 'سحب سيولة القمم', n: 1,
             dx: -54, dy: -74, at: T[0] + 1.4 });

// 2 · MSS — a body close through the last higher low, not a wick
ch.level({ price: swingLo.p, from: swingLo.i, to: mssI, mode: 'close', at: T[1] + .2 });
ch.anchor({ i: swingLo.i, price: swingLo.p, n: 2, at: T[1] + .9 });
ch.sticker({ i: mssI, price: swingLo.p, text: 'كسر البنية بإغلاق', n: 2,
             dx: -58, dy: 88, at: T[1] + 1.4 });

// 3 · the gap the displacement left behind
if (fvg) {
  ch.zone({ from: fvg.i - 1, to: entryI, top: fvg.top, bottom: fvg.bottom,
            tone: 'accent', whole: false, at: T[2] + .2 });
  ch.sticker({ i: fvg.i, price: fvg.top, text: 'FVG', n: 3, dx: 96, dy: -56, at: T[2] + 1.2 });
}

// 4 · the position: entry at the gap, stop above the sweep wick, target the low
ch.position({ from: entryI, to: targetLo.i, entry: ENTRY, stop: SL, target: TP, at: T[3] + .3 });
ch.sticker({ i: entryI, price: ENTRY, text: 'الدخول من الفجوة', n: 4,
             dx: 104, dy: 62, at: T[3] + 1.4 });

// 5 · where it was going
ch.level({ price: TP, from: targetLo.i, to: 'edge', tone: 'accent', at: T[4] + .3 });
ch.sticker({ i: targetLo.i, price: TP, text: 'الهدف: سيولة القيعان', n: 5,
             dx: -60, dy: 74, at: T[4] + 1.2 });

ch.layout();

/* --- the words and the plan, on the same clock --------------------------- */
const SAY = [
  ['السيولة فوق القمم', 'قمم متساوية = أوامر وقف مكدّسة. السوق يروح لها، ما يهرب منها.'],
  ['كسر البنية بإغلاق', 'الفتيل وحده سحب. الإغلاق تحت آخر قاع هو التأكيد.'],
  ['الفجوة اللي خلّفها الاندفاع', 'ثلاث شمعات: قاع الأولى فوق قمة الثالثة. هذي منطقة العودة.'],
  ['الدخول عند العودة', 'الوقف فوق فتيل السحب، لأن فوقه تعني الفكرة انتهت.'],
  ['الهدف سيولة القيعان', 'نخرج وين يوجد الطرف المقابل — مو عند رقم نحبه.']
];
const stepEls = [...document.querySelectorAll('#steps .s')].reverse();  // rail is RTL
const sayT = document.getElementById('sayT'), sayD = document.getElementById('sayD');
const vEN = document.getElementById('vEN'), vSL = document.getElementById('vSL'), vTP = document.getElementById('vTP');
const pEN = document.getElementById('pEN'), pSL = document.getElementById('pSL'), pTP = document.getElementById('pTP');
const f0 = n => n.toFixed(0);

function ui(t) {
  let cur = -1;
  T.forEach((tt, k) => { if (t >= tt + 0.15) cur = k; });
  stepEls.forEach((el, k) => {
    el.classList.toggle('on', k === cur);
    el.classList.toggle('done', k < cur);
  });
  if (cur >= 0) { sayT.textContent = SAY[cur][0]; sayD.textContent = SAY[cur][1]; }
  else { sayT.textContent = ''; sayD.textContent = ''; }
  // the plan fills in as each leg is established, not before
  pEN.style.opacity = t >= T[3] + 0.4 ? 1 : 0; vEN.textContent = f0(ENTRY);
  pSL.style.opacity = t >= T[3] + 0.7 ? 1 : 0; vSL.textContent = f0(SL);
  pTP.style.opacity = t >= T[4] + 0.4 ? 1 : 0;
  vTP.textContent = f0(TP) + '  ·  ' + R.toFixed(1) + 'R';
}

const TOTAL = ch.duration() + 1.0;
function seekAll(t) { ch.seek(t); ui(t); }
seekAll(0);
window.LS_DURATION = TOTAL;
window.seekTo = t => { seekAll(t); return true; };
window.LS_READY = true;
window.LS_INFO = { BSL: BSL.p, sweepI, sweepH, swingLo: swingLo.p, mssI,
                   fvg, entryI, ENTRY, SL, TP, R, holds: T, violations: ch.violations };
if (!location.search.includes('static')) {
  const t0 = performance.now();
  (function loop(now){ const t=(now-t0)/1000; seekAll(t); if(t<TOTAL) requestAnimationFrame(loop); })(t0);
}
</script>
