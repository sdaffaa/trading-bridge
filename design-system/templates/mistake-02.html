<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Liquidity State — الخطأ 02: تطارد الشمعة</title>
  <link rel="stylesheet" href="../css/tokens.css" />
  <link rel="stylesheet" href="../css/base.css" />
  <link rel="stylesheet" href="../css/series.css" />
  <style>
    body { margin: 0; }
    .m2-stage { position: relative; height: 620px; margin-top: 8px; }
    .m2-stage svg { position: absolute; inset: 0; width: 100%; height: 100%; }
    .m2-pills { position: absolute; right: 0; bottom: 12px; width: 512px; }
  </style>
</head>
<body>
  <div class="ls-canvas-carousel ls-content">
    <div class="sr-slide">
      <div class="sr-counter"><span class="ls-counter">3/5</span></div>

      <div class="sr-header">
        <img class="sr-logo" src="../logo/icosahedron.svg" alt="Liquidity State" />
        <div class="sr-wordmark">LIQUIDITY&nbsp;STATE</div>
      </div>

      <div class="sr-title">
        <div class="sr-eyebrow"><span class="num">02</span>&nbsp;الخطأ</div>
        <div class="sr-headline">تطارد الشمعة</div>
        <p class="sr-lead">
          تشوف شمعة قوية فتدخل في آخرها.<br />
          لكنك دخلت بعد ما أخذ السوق أغلب الحركة.<br />
          <b>النتيجة؟</b> دخول متأخر وستوب أقرب من اللازم.
        </p>
      </div>

      <div class="m2-stage">
        <svg id="chart"></svg>
        <div class="m2-pills sr-pills">
          <div class="sr-pill">
            <span class="icon"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l2.4 5.6L20 8l-4 4 1.2 6L12 15l-5.2 3L8 12 4 8l5.6-.4L12 2z"/></svg></span>
            <span class="divider"></span>
            <span class="txt">لا تدخل بعد <b>الانفجار</b></span>
          </div>
          <div class="sr-pill">
            <span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5" stroke-linecap="round"/></svg></span>
            <span class="divider"></span>
            <span class="txt">انتظر <b>إعادة الاختبار</b></span>
          </div>
          <div class="sr-pill">
            <span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3l7 3v5c0 4.4-3 8-7 10-4-2-7-5.6-7-10V6l7-3z" stroke-linejoin="round"/></svg></span>
            <span class="divider"></span>
            <span class="txt">فكّر <b>بالمخاطرة</b> قبل الحماس</span>
          </div>
        </div>
      </div>

      <div class="ls-edu-tag" style="position:absolute; left:70px; bottom:52px;">EURUSD · يومي · لغرض تعليمي</div>
      <div class="sr-swipe"><span class="arrow">←</span><span>اسحب</span></div>
    </div>
  </div>

  <script type="module">
    import { SeriesChart } from "../css/series.js";
    // REAL data — EURUSD daily, 2025-03-11 → 2025-04-10 (source: FMP). 23 candles.
    // Calm March, then a standout 04-03 impulse (341 pips ≈ 3× the average range),
    // a retest into its origin at 1.0878 (04-07/08), then the 04-10 continuation.
    const ohlc = [
      {o:1.09181,h:1.09469,l:1.08284,c:1.09181},{o:1.09181,h:1.09306,l:1.08752,c:1.08873},
      {o:1.08873,h:1.08968,l:1.08221,c:1.08507},{o:1.08507,h:1.09121,l:1.08302,c:1.08751},
      {o:1.08753,h:1.09294,l:1.08682,c:1.09217},{o:1.09217,h:1.09544,l:1.08921,c:1.09439},
      {o:1.09439,h:1.09457,l:1.08601,c:1.09009},{o:1.09009,h:1.09169,l:1.08144,c:1.08473},
      {o:1.08473,h:1.08611,l:1.07958,c:1.08115},{o:1.08122,h:1.08578,l:1.07812,c:1.08003},
      {o:1.08003,h:1.08299,l:1.07765,c:1.07902},{o:1.07902,h:1.08025,l:1.07436,c:1.07528},
      {o:1.07528,h:1.08209,l:1.07324,c:1.08006},{o:1.08006,h:1.08444,l:1.07634,c:1.08217},
      {o:1.08175,h:1.08490,l:1.07836,c:1.08147},{o:1.08147,h:1.08297,l:1.07779,c:1.07925},
      {o:1.07925,h:1.09241,l:1.07799,c:1.08489},{o:1.08489,h:1.11450,l:1.08045,c:1.10513},
      {o:1.10513,h:1.11074,l:1.09236,c:1.09625},{o:1.08878,h:1.10497,l:1.08778,c:1.09055},
      {o:1.09055,h:1.09916,l:1.08877,c:1.09533},{o:1.09533,h:1.10948,l:1.09126,c:1.09449},
      {o:1.09449,h:1.12414,l:1.09426,c:1.11982},
    ];
    const c = new SeriesChart(document.getElementById("chart"), ohlc,
      { width: 1000, height: 620, padL: 40, padR: 560, padT: 44, padB: 150, gap: 0.34 });
    c.render();
    // retest zone — pullback into the impulse's origin (04-04..04-09), the better entry
    c.box(18, 21, 1.0965, 1.0878, { opacity: 0.16 });
    // wrong entry: chasing the top of the impulse candle (04-03 high 1.1145)
    c.annot({ at:{ i:17, price:1.1145 }, labelXY:{ x:470, y:c.y(1.1145) },
      text:"دخول خاطئ", sub:"دخول عند القمة", tone:"grey", marker:"xcircle", anchor:"end", subDy:32 });
    // better entry: the retest into the origin (04-07 low 1.0878) — label lifted
    // above the pills with a connector down to the marker on the real price
    c.annot({ at:{ i:19, price:1.0888 }, labelXY:{ x:486, y:c.y(1.0888)-104 },
      text:"إعادة اختبار", sub:"منطقة أفضل للدخول", tone:"turq", marker:"check", anchor:"end", subDy:32 });
  </script>
</body>
</html>
