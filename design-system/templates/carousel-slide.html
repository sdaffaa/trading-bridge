<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Liquidity State — Carousel Slide (1080×1350)</title>
  <link rel="stylesheet" href="../css/tokens.css" />
  <link rel="stylesheet" href="../css/base.css" />
  <style>
    body { margin: 0; }
    .slide { display: flex; flex-direction: column; padding: 96px 80px; height: 100%; gap: 44px; }
    .kicker { display: flex; align-items: center; gap: 16px; }
    .kicker .bar { width: 46px; height: 4px; background: var(--ls-turq); }
    .kicker span { font-weight: 700; letter-spacing: 0.14em; color: var(--ls-turq); font-size: 26px; }
    .list { display: flex; flex-direction: column; gap: 30px; margin-top: 8px; }
    .row { display: flex; align-items: flex-start; gap: 22px; }
    .foot { margin-top: auto; display: flex; align-items: center; justify-content: space-between; }
    .brandline { display: flex; align-items: center; gap: 16px; }
    .brandline img { width: 56px; height: 56px; }
    .brandline .wm { font-weight: 700; letter-spacing: 0.28em; font-size: 18px; color: var(--ls-text-2); }
  </style>
</head>
<body>
  <div class="ls-canvas-carousel ls-content">
    <div class="slide">
      <div class="kicker"><span>الدرس</span><div class="bar"></div><span class="ls-counter">02</span></div>
      <h1 class="ls-h1">تغيّر النمط<br />قبل لا يبين</h1>
      <p class="ls-body-2" style="max-width:820px">
        أول ما ينكسر آخر قاع صاعد، السوق يقول لك القصة تغيّرت.
        خلّ الدرس معاك وطبّقه على الشارت.
      </p>

      <div class="list">
        <div class="row"><span class="ls-step ls-step--turq">1</span>
          <div><div class="ls-h3">حدد القمم والقيعان</div>
            <div class="ls-body-2">علّم آخر قمة وآخر قاع واضحين</div></div></div>
        <div class="row"><span class="ls-step">2</span>
          <div><div class="ls-h3">راقب الكسر</div>
            <div class="ls-body-2">كسر القاع <span class="ls-arrow">←</span> تغيّر نمط للهابط</div></div></div>
        <div class="row"><span class="ls-step ls-step--turq">3</span>
          <div><div class="ls-h3">انتظر التأكيد</div>
            <div class="ls-body-2">رجعة للمنطقة <span class="ls-arrow">←</span> فرصة أوضح</div></div></div>
      </div>

      <div class="foot">
        <div class="brandline">
          <img src="../logo/icosahedron.svg" alt="" />
          <span class="wm">LIQUIDITY STATE</span>
        </div>
        <span class="ls-keyword">اكتب: ستركجر</span>
      </div>
    </div>
  </div>
</body>
</html>
