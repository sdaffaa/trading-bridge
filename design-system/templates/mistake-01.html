<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Liquidity State — الخطأ 01: تدخل قبل التأكيد</title>
  <link rel="stylesheet" href="../css/tokens.css" />
  <link rel="stylesheet" href="../css/base.css" />
  <link rel="stylesheet" href="../css/series.css" />
  <style> body { margin: 0; } </style>
</head>
<body>
  <div class="ls-canvas-carousel ls-content">
    <div class="sr-slide">
      <div class="sr-counter"><span class="ls-counter">2/5</span></div>

      <div class="sr-header">
        <img class="sr-logo" src="../logo/icosahedron.svg" alt="Liquidity State" />
        <div class="sr-wordmark">LIQUIDITY&nbsp;STATE</div>
      </div>

      <div class="sr-title">
        <div class="sr-eyebrow"><span class="num">01</span>&nbsp;الخطأ</div>
        <div class="sr-headline">تدخل قبل التأكيد</div>
        <p class="sr-lead">
          أول ما يلمس المستوى تدخل مباشرة.<br />
          لكن السوق ما أعطاك إغلاق يؤكد الاتجاه.<br />
          <b>النتيجة؟</b> ستوب سريع ثم الحركة تمشي بدونك.
        </p>
      </div>

      <div class="sr-chart">
        <svg id="chart"></svg>
        <div class="sr-check-card" style="left:0; bottom:0; width:410px; padding:22px 26px; gap:18px;">
          <div class="sr-check-row"><span>انتظر الإغلاق</span>
            <span class="sr-check-icon"><svg viewBox="0 0 24 24" fill="none"><path d="M4 12l5 5L20 6" stroke="#2E7D96" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></span></div>
          <div class="sr-check-row"><span>راقب مكان الشمعة</span>
            <span class="sr-check-icon"><svg viewBox="0 0 24 24" fill="none"><path d="M4 12l5 5L20 6" stroke="#2E7D96" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></span></div>
          <div class="sr-check-row"><span>ادخل بعد التأكيد</span>
            <span class="sr-check-icon"><svg viewBox="0 0 24 24" fill="none"><path d="M4 12l5 5L20 6" stroke="#2E7D96" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></span></div>
        </div>
      </div>

      <div class="ls-edu-tag" style="position:absolute; right:70px; bottom:52px;">XAUUSD · يومي · لغرض تعليمي</div>
      <div class="sr-swipe"><span class="arrow">←</span><span>اسحب</span></div>
    </div>
  </div>

  <script type="module">
    import { SeriesChart } from "../css/series.js";
    // REAL data — XAUUSD (gold) daily, 2025-02-10 → 2025-03-18 (source: FMP). 27 candles.
    // Resistance 2956 poked repeatedly in Feb (highs 2964–2974, closing back below →
    // trap → drop to 2844), then a decisive confirmed close at 2991 on 03-13.
    const ohlc = [
      {o:2884.8,h:2938.1,l:2879.9,c:2934.4},{o:2937.0,h:2968.5,l:2907.0,c:2932.6},
      {o:2927.0,h:2936.5,l:2886.5,c:2928.7},{o:2928.8,h:2958.8,l:2925.8,c:2945.4},
      {o:2957.3,h:2964.1,l:2889.9,c:2900.7},{o:2895.1,h:2956.5,l:2887.6,c:2949.0},
      {o:2879.2,h:2936.4,l:2873.8,c:2931.6},{o:2954.1,h:2964.4,l:2933.7,c:2936.1},
      {o:2949.5,h:2973.4,l:2939.3,c:2956.1},{o:2955.7,h:2964.7,l:2930.1,c:2953.2},
      {o:2950.4,h:2974.0,l:2936.8,c:2963.2},{o:2968.5,h:2970.4,l:2897.0,c:2918.8},
      {o:2929.0,h:2942.0,l:2903.3,c:2930.6},{o:2931.4,h:2935.8,l:2879.0,c:2895.9},
      {o:2889.0,h:2896.1,l:2844.1,c:2848.5},{o:2872.0,h:2906.4,l:2866.3,c:2901.1},
      {o:2904.2,h:2939.8,l:2892.5,c:2920.6},{o:2929.0,h:2941.3,l:2903.4,c:2926.0},
      {o:2929.5,h:2935.9,l:2897.6,c:2926.6},{o:2919.2,h:2938.8,l:2905.3,c:2914.1},
      {o:2919.6,h:2926.4,l:2885.2,c:2899.4},{o:2893.2,h:2929.0,l:2882.5,c:2920.9},
      {o:2922.3,h:2948.9,l:2911.0,c:2946.8},{o:2943.3,h:3001.5,l:2942.2,c:2991.3},
      {o:3001.4,h:3017.1,l:2988.6,c:3001.1},{o:2994.8,h:3010.9,l:2991.4,c:3006.1},
      {o:3009.4,h:3047.5,l:3008.2,c:3040.8},
    ];
    const R = 2956;
    const c = new SeriesChart(document.getElementById("chart"), ohlc,
      { width: 1000, height: 470, padL: 44, padR: 44, padT: 150, padB: 40 });
    c.render();
    c.level(R, { label: "مستوى رئيسي", side: "start", labelX: 150, tone: "neutral" });
    // real touch of the level (02-17 wick tags 2956.5)
    c.annot({ at:{ i:5, price:R }, labelXY:{ x:c.x(3), y:c.y(R)-108 },
      text:"لمس المستوى", tone:"neutral", marker:"ring", dash:false });
    // premature entry on a poke that closed back below (02-20 high 2973 → trapped)
    c.annot({ at:{ i:8, price:2966 }, labelXY:{ x:c.x(12), y:c.y(R)-108 },
      text:"دخول مبكر (خطأ)", tone:"bear", marker:"xred" });
    // the close that actually confirms the break (03-13 closes 2991.3)
    c.annot({ at:{ i:23, price:2991.3 }, labelXY:{ x:c.x(24), y:c.y(2991.3)-86 },
      text:"إغلاق يؤكد الاتجاه", tone:"neutral", marker:"dot" });
    // valid entry once the break holds above the level (03-14)
    c.annot({ at:{ i:24, price:R+8 }, labelXY:{ x:c.x(23), y:c.y(R)+118 },
      text:"دخول صحيح", tone:"turq", marker:"check" });
  </script>
</body>
</html>
