<!doctype html>
<html dir="rtl" lang="ar">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="fonts.css">
<link rel="stylesheet" href="brand.css">
<title>slide-07-cta</title>
</head>
<body>
<!-- ==== SLIDE 7 · CTA ====
     One primary action only: keyword OR "احفظ الدرس 📌". Handle + gem. ≤18 words. -->
<div class="slide">
  <svg width="0" height="0" aria-hidden="true"><defs>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E8EDEE"/><stop offset="1" stop-color="#A9BCC2"/>
    </linearGradient>
  </defs></svg>

  <div class="stage center">
    <div class="kicker">قبل لا تطلع</div>
    <h2 class="title">حجم صفقتك القادمة… محسوب ولا على الإحساس؟</h2>
    <div class="cta-pill">احفظ الدرس 📌</div>
    <div class="cta-keyword">علّق «<span>حجم</span>» ويوصلك جدول المخاطرة</div>
  </div>

  <div class="band">
    <div class="brand">
      <div class="gem-wrap"><svg viewBox="0 0 100 100" class="gem" aria-hidden="true">
        <polygon points="50,5 90,28 90,72 50,95 10,72 10,28" fill="url(#metal)" stroke="#0E1E24" stroke-width="3"/>
      </svg></div>
      <span class="handle">@liquidity.state</span>
    </div>
    <span class="spacer"></span>
    <span class="counter">7/7</span>
  </div>
</div>
</body>
</html>
