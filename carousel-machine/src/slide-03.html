<!doctype html>
<html dir="rtl" lang="ar">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="fonts.css">
<link rel="stylesheet" href="brand.css">
<title>slide-03-turn</title>
</head>
<body>
<!-- ==== SLIDE 3 · TURN ====
     "لكن بالواقع؟" — the shift in understanding. ≤25 on-screen words. -->
<div class="slide">
  <svg width="0" height="0" aria-hidden="true"><defs>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E8EDEE"/><stop offset="1" stop-color="#A9BCC2"/>
    </linearGradient>
  </defs></svg>

  <div class="stage center">
    <div class="kicker">لكن بالواقع؟</div>
    <h2 class="title">ما تخسر لأن تحليلك غلط…<br>تخسر لأن حجمك أكبر من حسابك.</h2>
    <div class="card alt">
      <p class="body">اللي يحمي حسابك اهو <b class="bull">حجم المخاطرة الثابت</b> — مو نسبة النجاح.</p>
    </div>
  </div>

  <div class="band">
    <div class="brand">
      <div class="gem-wrap"><svg viewBox="0 0 100 100" class="gem" aria-hidden="true">
        <polygon points="50,5 90,28 90,72 50,95 10,72 10,28" fill="url(#metal)" stroke="#0E1E24" stroke-width="3"/>
      </svg></div>
      <span class="handle">@liquidity.state</span>
    </div>
    <span class="spacer"></span>
    <span class="counter">3/7</span>
  </div>
</div>
</body>
</html>
