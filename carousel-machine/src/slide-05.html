<!doctype html>
<html dir="rtl" lang="ar">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="fonts.css">
<link rel="stylesheet" href="brand.css">
<title>slide-05-proof</title>
</head>
<body>
<!-- ==== SLIDE 5 · PROOF ==== line-art chart, SCHEMATIC -> "توضيحي" (§7.5) -->
<div class="slide">
  <div class="pagebox">5 / 7</div>
  <div class="brandmark-sm">LIQUIDITY STATE</div>

  <div class="stage between">
    <div>
      <h2 class="h2">مخاطرة <span class="num">$100</span> مقابل هدف <span class="num">$200</span></h2>
      <div class="chip" style="margin-top:26px">توضيحي · رسم تخطيطي</div>
    </div>

    <div class="chartwrap">
      <div class="hair"></div>
      <svg viewBox="0 0 888 430" width="100%" style="display:block; margin:26px 0" aria-hidden="true">
        <!-- hairline grid -->
        <g stroke="#E2DACE" stroke-width="1">
          <line x1="0" y1="60"  x2="888" y2="60"/>
          <line x1="0" y1="160" x2="888" y2="160"/>
          <line x1="0" y1="270" x2="888" y2="270"/>
          <line x1="0" y1="370" x2="888" y2="370"/>
        </g>

        <!-- TP (teal, dashed) · Entry (navy, solid) · SL (red, dashed) -->
        <line x1="0" y1="92"  x2="888" y2="92"  stroke="#1B6980" stroke-width="1.6" stroke-dasharray="9 8"/>
        <line x1="0" y1="238" x2="888" y2="238" stroke="#12303B" stroke-width="2"/>
        <line x1="0" y1="330" x2="888" y2="330" stroke="#D14A4A" stroke-width="1.6" stroke-dasharray="9 8"/>

        <!-- price path: line art only, no fills -->
        <polyline fill="none" stroke="#12303B" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"
          points="24,300 92,282 150,316 214,290 276,262 330,286 388,244 436,238 494,206 556,214 612,168 668,132 726,140 784,104 840,92"/>

        <!-- entry marker -->
        <circle cx="436" cy="238" r="7" fill="#F4EFE8" stroke="#12303B" stroke-width="2.6"/>
      </svg>
      <div class="hair"></div>

      <div class="clab" style="top:38px;   right:0; color:#1B6980">هدف <span class="num">3420</span> · <span class="num">+$200</span></div>
      <div class="clab" style="top:184px;  right:0">دخول <span class="num">3400</span></div>
      <div class="clab" style="top:276px;  right:0; color:#B93A3A">ستوب <span class="num">3390</span> · <span class="num">−$100</span></div>
    </div>

    <div>
      <p class="strong">الستوب يحدّد الحجم — والهدف يحدّد الـ <span class="num">R</span>.</p>
      <p class="body" style="margin-top:14px">طق الستوب = خسارة <span class="num">1R</span> · وصل الهدف = ربح <span class="num">2R</span>.</p>
      <p class="disclaimer" style="margin-top:20px">التداول ينطوي على مخاطر — المحتوى لغرض تعليمي فقط.</p>
    </div>
  </div>

  <div class="foot"><span class="h">@liquidity.state</span> · لغرض تعليمي</div>
  <div class="dots"><i></i><i></i><i></i><i></i><i class="on"></i><i></i><i></i></div>
</div>
</body>
</html>
