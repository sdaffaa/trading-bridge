<!doctype html>
<html dir="rtl" lang="ar">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="fonts.css">
<link rel="stylesheet" href="brand.css">
<title>slide-02-stakes</title>
</head>
<body>
<!-- ==== SLIDE 2 · STAKES ==== ≤25 content words -->
<div class="slide">
  <div class="pagebox">2 / 7</div>
  <div class="brandmark-sm">LIQUIDITY STATE</div>

  <div class="stage mid" style="gap:64px">
    <div>
      <h2 class="h2">بعد <span class="num">10</span> خسائر ورا بعض…<br>چم ينزل حسابك؟</h2>
      <div class="alertchip" style="margin-top:30px"><span class="num">10</span> خسائر متتالية</div>
    </div>

    <div>
      <div class="hair"></div>
      <div class="stats">
        <div class="stat-row">
          <span class="statlabel">مخاطرة <span class="num">1%</span> بالصفقة</span>
          <span class="stat-val bull">−9.6%</span>
        </div>
        <div class="stat-row">
          <span class="statlabel">مخاطرة <span class="num">5%</span> بالصفقة</span>
          <span class="stat-val bear">−40.1%</span>
        </div>
      </div>
      <div class="hair"></div>
    </div>

    <div>
      <p class="strong">نفس الخسائر — فرق كبير.</p>
      <p class="body" style="margin-top:16px">حساب <span class="num">$10,000</span> · نسبة ثابتة.</p>
    </div>
  </div>

  <div class="foot"><span class="h">@liquidity.state</span> · لغرض تعليمي</div>
  <div class="dots"><i></i><i class="on"></i><i></i><i></i><i></i><i></i><i></i></div>
</div>
</body>
</html>
