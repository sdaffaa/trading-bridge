<!doctype html>
<html dir="rtl" lang="ar">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="fonts.css">
<link rel="stylesheet" href="brand.css">
<title>slide-02-stakes</title>
</head>
<body>
<!-- ==== SLIDE 2 · STAKES ====
     Why this matters: one sharp claim + one visual. ≤25 on-screen words. -->
<div class="slide">
  <svg width="0" height="0" aria-hidden="true"><defs>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E8EDEE"/><stop offset="1" stop-color="#A9BCC2"/>
    </linearGradient>
  </defs></svg>

  <div class="stage between">
    <div>
      <div class="kicker">الرقم الصادم</div>
      <h2 class="title">بعد <span class="num">10</span> خسائر ورا بعض… چم ينزل حسابك؟</h2>
    </div>

    <div class="card">
      <div class="cmp">
        <div class="cmp-row">
          <span class="cmp-label">مخاطرة <span class="num">1%</span> بالصفقة</span>
          <span class="cmp-val bull">−9.6%</span>
        </div>
        <div class="cmp-row">
          <span class="cmp-label">مخاطرة <span class="num">5%</span> بالصفقة</span>
          <span class="cmp-val bear">−40.1%</span>
        </div>
      </div>
    </div>

    <p class="body">نفس الخسائر… فرق كبير.</p>
  </div>

  <div class="band">
    <div class="brand">
      <div class="gem-wrap"><svg viewBox="0 0 100 100" class="gem" aria-hidden="true">
        <polygon points="50,5 90,28 90,72 50,95 10,72 10,28" fill="url(#metal)" stroke="#0E1E24" stroke-width="3"/>
      </svg></div>
      <span class="handle">@liquidity.state</span>
    </div>
    <span class="spacer"></span>
    <span class="counter">2/7</span>
  </div>
</div>
</body>
</html>
