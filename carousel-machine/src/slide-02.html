<!doctype html>
<html dir="rtl" lang="ar">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="fonts.css">
<link rel="stylesheet" href="brand.css">
<title>slide-02-stakes</title>
</head>
<body>
<!-- ==== SLIDE 2 · STAKES ==== -->
<div class="slide">
  <svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
    <linearGradient id="gemFace" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F4F8F8"/><stop offset=".5" stop-color="#C7D6D9"/><stop offset="1" stop-color="#98AEB4"/>
    </linearGradient>
    <linearGradient id="gemEdge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2FBF95"/><stop offset="1" stop-color="#0E1E24"/>
    </linearGradient>
    <symbol id="gem" viewBox="0 0 120 120">
      <polygon points="60,4 108,32 108,88 60,116 12,88 12,32" fill="url(#gemFace)" stroke="url(#gemEdge)" stroke-width="2.5"/>
      <polygon points="60,4 108,32 60,50 12,32" fill="#FFFFFF" opacity=".5"/>
      <polygon points="60,50 108,32 108,88 60,70" fill="#17A97F" opacity=".12"/>
      <polygon points="60,50 12,32 12,88 60,70" fill="#0E1E24" opacity=".06"/>
      <g stroke="#0E1E24" stroke-width="1.1" opacity=".34" fill="none">
        <path d="M12,32 L60,50 L108,32"/><path d="M60,4 L60,50 M60,50 L60,116"/>
        <path d="M12,88 L60,70 L108,88"/><path d="M60,50 L12,88 M60,50 L108,88"/>
      </g>
      <path d="M60,10 L101,34" stroke="#FFFFFF" stroke-width="2" opacity=".6" fill="none"/>
    </symbol>
  </defs></svg>
  <svg class="bg-gem" aria-hidden="true"><use href="#gem"/></svg>

  <div class="stage between">
    <div>
      <div class="head">
        <div class="kchip"><span class="dot"></span> الرقم الصادم</div>
        <div class="idx">RISK · 02</div>
      </div>
      <h2 class="title" style="margin-top:30px">بعد <span class="num">10</span> خسائر ورا بعض…<br>چم ينزل حسابك؟</h2>
    </div>

    <div class="cmp">
      <div class="cmp-row cool">
        <span class="cmp-label">مخاطرة <span class="num">1%</span> بالصفقة</span>
        <span class="cmp-val bull">−9.6%</span>
      </div>
      <div class="cmp-row hot">
        <span class="cmp-label">مخاطرة <span class="num">5%</span> بالصفقة</span>
        <span class="cmp-val bear">−40.1%</span>
      </div>
    </div>

    <div class="card alt">
      <p class="lead">نفس الخسائر… <span class="bear">فرق كبير.</span></p>
    </div>
  </div>

  <div class="band">
    <div class="brand">
      <div class="gem-wrap"><svg class="gem" aria-hidden="true"><use href="#gem"/></svg></div>
      <span class="handle">@liquidity.state</span>
    </div>
    <span class="spacer"></span>
    <span class="counter">2/7</span>
  </div>
</div>
</body>
</html>
