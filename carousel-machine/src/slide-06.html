<!doctype html>
<html dir="rtl" lang="ar">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="fonts.css">
<link rel="stylesheet" href="brand.css">
<title>slide-06-reframe</title>
</head>
<body>
<!-- ==== SLIDE 6 · REFRAME (quote / screenshot slide) ====
     One centered quote line — must work standalone as a screenshot. ≤14 words. -->
<div class="slide">
  <svg width="0" height="0" aria-hidden="true"><defs>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E8EDEE"/><stop offset="1" stop-color="#A9BCC2"/>
    </linearGradient>
  </defs></svg>

  <div class="stage center">
    <div class="cover-gem" style="position:static; margin:0 auto 8px; width:84px; height:84px">
      <svg viewBox="0 0 100 100" class="gem" aria-hidden="true">
        <polygon points="50,5 90,28 90,72 50,95 10,72 10,28" fill="url(#metal)" stroke="#0E1E24" stroke-width="2.5"/>
        <path d="M50,5 L50,95 M10,28 L90,72 M90,28 L10,72" stroke="#0E1E24" stroke-width="1.4" opacity=".55"/>
      </svg>
    </div>
    <p class="quote">المحترف ما يسأل «چم بربح؟»<br>يسأل «چم أتحمّل أخسر؟»</p>
  </div>

  <div class="band">
    <div class="brand">
      <div class="gem-wrap"><svg viewBox="0 0 100 100" class="gem" aria-hidden="true">
        <polygon points="50,5 90,28 90,72 50,95 10,72 10,28" fill="url(#metal)" stroke="#0E1E24" stroke-width="3"/>
      </svg></div>
      <span class="handle">@liquidity.state</span>
    </div>
    <span class="spacer"></span>
    <span class="counter">6/7</span>
  </div>
</div>
</body>
</html>
