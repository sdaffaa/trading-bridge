<!doctype html>
<html dir="rtl" lang="ar">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="fonts.css">
<link rel="stylesheet" href="brand.css">
<title>slide-04-rule</title>
</head>
<body>
<!-- ==== SLIDE 4 · RULE ====
     The numbered framework (١، ٢، ٣). ≤35 on-screen words. -->
<div class="slide">
  <svg width="0" height="0" aria-hidden="true"><defs>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E8EDEE"/><stop offset="1" stop-color="#A9BCC2"/>
    </linearGradient>
  </defs></svg>

  <div class="stage">
    <div>
      <div class="kicker">المعادلة</div>
      <h2 class="title">حجم الصفقة بثلاث خطوات</h2>
    </div>

    <div class="card">
      <div class="steps">
        <div class="step">
          <span class="n">١</span>
          <span class="t">حدّد مخاطرتك: <span class="num">1% × $10,000 = $100</span></span>
        </div>
        <div class="step">
          <span class="n">٢</span>
          <span class="t">قيس المسافة للستوب: <span class="num">3400 − 3390 = 10</span> نقاط.</span>
        </div>
        <div class="step">
          <span class="n">٣</span>
          <span class="t">وحجمك الصحيح: <span class="num bull">$100 ÷ 10 = 10</span> وحدات.</span>
        </div>
      </div>
    </div>

    <p class="label">القاعدة: الستوب يحدّد الحجم — مو رغبتك بالربح.</p>
  </div>

  <div class="band">
    <div class="brand">
      <div class="gem-wrap"><svg viewBox="0 0 100 100" class="gem" aria-hidden="true">
        <polygon points="50,5 90,28 90,72 50,95 10,72 10,28" fill="url(#metal)" stroke="#0E1E24" stroke-width="3"/>
      </svg></div>
      <span class="handle">@liquidity.state</span>
    </div>
    <span class="spacer"></span>
    <span class="counter">4/7</span>
  </div>
</div>
</body>
</html>
