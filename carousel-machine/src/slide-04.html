<body>
<!-- ==== SLIDE 4 · RULE ==== ≤35 content words -->
<div class="slide">

  <div class="stage mid" style="gap:60px">

      <div class="chip">المعادلة</div>

    <div class="panel">
      <div class="row">
        <span class="rnum">1</span>

      </div>
      <div class="row">
        <span class="rnum">2</span>
        <span class="rtext">قيس المسافة للستوب · <span class="num">3400 − 3390 = 10</span></span>
      </div>

        <span class="rnum">3</span>
        <span class="rtext">وحجمك الصحيح · <span class="num">$100 ÷ 10 = 10</span> وحدات</span>
      </div>
    </div>

    <p class="label" style="text-align:center">الستوب يحدّد الحجم — مو رغبتك بالربح.</p>
  </div>

  <div class="foot"><span class="h">@liquidity.state</span> · لغرض تعليمي</div>
  <div class="dots"><i></i><i></i><i></i><i class="on"></i><i></i><i></i><i></i></div>
</div>
